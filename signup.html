
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dil Say Dil Tak - Sign Up</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #20242c;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #777;
    }

    .login a {
      color: #20242c;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="signup-box">

  <div class="logo">Dil Say Dil Tak</div>

  <div class="subtitle">
    Create your account
  </div>

  <form id="signupForm">

    <input
      type="text"
      id="username"
      placeholder="Username"
      required
    >

    <input
      type="email"
      id="email"
      placeholder="Email"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm Password"
      required
    >

    <button type="submit">Create Account</button>

  </form>

  <div id="message"></div>

  <div class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>

<script>
const SUPABASE_URL = "https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY = "PASTE_YOUR_COMPLETE_PUBLISHABLE_KEY_HERE";sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

document.getElementById("signupForm").addEventListener("submit", async function(e) {

  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const message = document.getElementById("message");

  if (password !== confirmPassword) {
    message.textContent = "Passwords do not match.";
    return;
  }

  if (password.length < 6) {
    message.textContent = "Password must be at least 6 characters.";
    return;
  }

  message.textContent = "Creating account...";

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        username: username
      }
    }
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  message.textContent =
    "Account created successfully! Please check your email if verification is required.";

  document.getElementById("signupForm").reset();
});
</script>

</body>
</html>
