<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Socialyte - Sign Up</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 35px 25px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #6c5ce7;
    }

    .logo span {
      color: #8e44ad;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #6c5ce7;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6c5ce7, #8e44ad);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #777;
    }

    .login a {
      color: #6c5ce7;
      font-weight: bold;
      text-decoration: none;
    }

  </style>

</head>

<body>

  <div class="signup-box">

    <div class="logo">
      Socia<span>lyte</span>
    </div>

    <div class="subtitle">
      Create your account
    </div>

    <form id="signupForm">

      <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="new-password"
        required
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        autocomplete="new-password"
        required
      >

      <button
        type="submit"
        id="signupButton">
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>


  <script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://szmauhxiyjffjhrcrue.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    /* =====================================================
       SIGN UP
    ===================================================== */

    document
      .getElementById("signupForm")
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();


          const username =
            document
              .getElementById("username")
              .value
              .trim();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          const confirmPassword =
            document
              .getElementById("confirmPassword")
              .value;


          const message =
            document
              .getElementById("message");


          const signupButton =
            document
              .getElementById("signupButton");


          /* Username check */

          if (!username) {

            message.textContent =
              "Please enter a username.";

            return;
          }


          /* Password check */

          if (password !== confirmPassword) {

            message.textContent =
              "Passwords do not match.";

            return;
          }


          if (password.length < 6) {

            message.textContent =
              "Password must be at least 6 characters.";

            return;
          }


          message.textContent =
            "Creating account...";


          signupButton.disabled =
            true;


          try {

            const {
              data,
              error
            } =
            await supabaseClient
              .auth
              .signUp({

                email: email,

                password: password,

                options: {

                  data: {
                    username: username
                  }

                }

              });


            if (error) {

              console.error(
                "SIGNUP ERROR:",
                error
              );

              message.textContent =
                error.message;

              signupButton.disabled =
                false;

              return;
            }


            console.log(
              "SIGNUP DATA:",
              data
            );


            /*
              Agar email confirmation enabled hai
            */

            if (
              data &&
              data.user &&
              !data.session
            ) {

              message.textContent =
                "Account created! Please check your email and verify your account.";

              document
                .getElementById("signupForm")
                .reset();

              signupButton.disabled =
                false;

              return;
            }


            /*
              Agar direct session mil gayi
            */

            if (
              data &&
              data.user
            ) {

              message.textContent =
                "Account created successfully!";


              document
                .getElementById("signupForm")
                .reset();


              setTimeout(
                () => {

                  window.location.href =
                    "index.html";

                },
                1000
              );

              return;
            }


            message.textContent =
              "Account created. Please login.";

            signupButton.disabled =
              false;

          }

          catch(error) {

            console.error(
              "SIGNUP EXCEPTION:",
              error
            );

            message.textContent =
              "Signup failed. Please try again.";

            signupButton.disabled =
              false;

          }

        }
      );

  </script>

</body>
</html>
