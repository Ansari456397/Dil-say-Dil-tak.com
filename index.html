<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dil Say Dil Tak</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      min-height: 100vh;
    }

    header {
      background: #20242c;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    #logout {
      background: white;
      color: #20242c;
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: bold;
    }

    .welcome {
      text-align: center;
      padding: 50px 20px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #777;
      font-size: 16px;
    }

    .card {
      background: white;
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Dil Say Dil Tak</div>
  <button id="logout">Logout</button>
</header>

<div class="welcome">
  <h1>Welcome 👋</h1>
  <p id="userEmail">Loading...</p>
</div>

<div class="card">
  <h2>💬 Chatting</h2>
  <p style="margin-top:10px;color:#777;">
    Your chatting area will be added here.
  </p>
</div>

<script>

const SUPABASE_URL = "https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY = "sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep;

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function checkUser() {

  const { data, error } = await supabaseClient.auth.getUser();

  if (error || !data.user) {
    window.location.href = "login.html";
    return;
  }

  document.getElementById("userEmail").textContent =
    "Logged in as: " + data.user.email;
}

document.getElementById("logout").addEventListener("click", async function() {

  await supabaseClient.auth.signOut();

  window.location.href = "login.html";

});

checkUser();

</script>

</body>
</html>
