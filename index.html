```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Socialyte</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
}

/* HEADER */
.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:60px;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  padding:0 15px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#4f46e5;
}

/* FIXED MESSAGE BOX */
.message-area{
  position:fixed;
  top:60px;
  left:0;
  width:100%;
  z-index:999;
  background:#f4f6fb;
  padding:10px;
  border-bottom:1px solid #ddd;
}

.message-box{
  max-width:650px;
  margin:auto;
  background:#fff;
  border-radius:14px;
  padding:10px;
  box-shadow:0 2px 10px rgba(0,0,0,.10);
}

.message-input{
  width:100%;
  height:60px;
  resize:none;
  border:1px solid #ddd;
  border-radius:10px;
  padding:11px;
  font-size:15px;
  outline:none;
}

.message-input:focus{
  border-color:#4f46e5;
}

/* BUTTONS */
.message-actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:8px;
}

.action-buttons{
  display:flex;
  gap:7px;
}

.action-btn{
  border:1px solid #ddd;
  background:#f8f8f8;
  border-radius:9px;
  padding:7px 10px;
  cursor:pointer;
}

.post-btn{
  border:0;
  background:#4f46e5;
  color:#fff;
  padding:8px 17px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

/* POSTS AREA */
.container{
  max-width:650px;
  margin:auto;

  /* header + fixed message box ke liye space */
  padding:185px 10px 20px;
}

.post{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.post-user{
  font-weight:bold;
  margin-bottom:8px;
}

.post-text{
  font-size:15px;
  line-height:1.5;
}

.post-image{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
}

/* IMAGE PREVIEW */
#imagePreview img{
  width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:10px;
  margin-top:8px;
}

/* MOBILE */
@media(max-width:500px){

  .message-area{
    padding:7px;
  }

  .message-box{
    border-radius:11px;
  }

  .message-input{
    height:55px;
  }

  .container{
    padding-top:175px;
  }

  .action-btn{
    font-size:12px;
    padding:7px 8px;
  }

  .post-btn{
    padding:8px 14px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Socialyte</div>
</div>


<!-- FIXED MESSAGE BOX -->
<div class="message-area">

  <div class="message-box">

    <textarea
      id="messageInput"
      class="message-input"
      placeholder="What's on your mind?"
    ></textarea>

    <div class="message-actions">

      <div class="action-buttons">

        <button
          class="action-btn"
          onclick="document.getElementById('imageInput').click()">
          🖼️ Image
        </button>

        <button
          class="action-btn"
          onclick="startVoice()">
          🎤 Voice
        </button>

      </div>

      <button class="post-btn" onclick="addPost()">
        Post
      </button>

    </div>

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      style="display:none"
      onchange="previewImage(event)"
    >

    <div id="imagePreview"></div>

  </div>

</div>


<!-- POSTS -->
<div class="container">

  <div id="posts">

    <div class="post">
      <div class="post-user">Socialyte</div>

      <div class="post-text">
        Welcome to Socialyte 💙
      </div>
    </div>

  </div>

</div>


<script>

let selectedImage = "";


/* IMAGE */
function previewImage(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    selectedImage = e.target.result;

    document.getElementById("imagePreview").innerHTML =
      `<img src="${selectedImage}">`;

  };

  reader.readAsDataURL(file);
}


/* ADD POST */
function addPost(){

  const input = document.getElementById("messageInput");

  const text = input.value.trim();

  if(!text && !selectedImage){

    alert("Message ya image add karein.");

    return;
  }

  const post = document.createElement("div");

  post.className = "post";

  post.innerHTML = `
    <div class="post-user">You</div>

    ${
      text
      ? `<div class="post-text">${escapeHTML(text)}</div>`
      : ""
    }

    ${
      selectedImage
      ? `<img class="post-image" src="${selectedImage}">`
      : ""
    }
  `;

  document.getElementById("posts").prepend(post);

  input.value = "";

  selectedImage = "";

  document.getElementById("imagePreview").innerHTML = "";

  document.getElementById("imageInput").value = "";
}


/* SECURITY */
function escapeHTML(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* VOICE */
function startVoice(){

  if(!("webkitSpeechRecognition" in window)){

    alert("Voice typing is not supported on this browser.");

    return;
  }

  const recognition = new webkitSpeechRecognition();

  recognition.lang = "ur-PK";

  recognition.start();

  recognition.onresult = function(event){

    document.getElementById("messageInput").value =
      event.results[0][0].transcript;

  };

}

</script>

</body>
</html>
```
