<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let currentUsername = "User";

let replyToUser = "";

let replyToUserId = null;

let mediaRecorder = null;

let audioChunks = [];

let isRecording = false;


/* =====================================================
   CHECK USER
===================================================== */

async function checkUser(){

  try{

    const {
      data:{user},
      error
    } =
    await supabaseClient.auth.getUser();


    if(error || !user){

      window.location.href =
        "login.html";

      return;
    }


    currentUser = user;


    currentUsername =
      user.user_metadata?.username ||
      user.email?.split("@")[0] ||
      "User";


    const profileName =
      document.getElementById(
        "profileName"
      );


    if(profileName){

      profileName.textContent =
        currentUsername;

    }


    await loadPosts();

  }catch(error){

    console.error(
      "CHECK USER ERROR:",
      error
    );

  }

}


checkUser();


/* =====================================================
   LOAD POSTS
===================================================== */

async function loadPosts(){

  if(!currentUser) return;


  const box =
    document.getElementById("posts");


  if(!box) return;


  /* GET BLOCKED USERS */

  const {
    data:blockedRows,
    error:blockError
  } =
  await supabaseClient
    .from("user_blocks")
    .select("blocked_id")
    .eq(
      "blocker_id",
      currentUser.id
    );


  if(blockError){

    console.error(
      "BLOCK LOAD ERROR:",
      blockError
    );

  }


  const blockedIds =
    (blockedRows || [])
      .map(x => x.blocked_id);


  /* GET POSTS */

  const {
    data,
    error
  } =
  await supabaseClient
    .from("posts")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    console.error(
      "POST LOAD ERROR:",
      error
    );


    box.innerHTML =
      `<div class="empty">
        Posts load nahi ho sake.
      </div>`;


    return;
  }


  const posts =
    (data || []).filter(
      p =>
        !blockedIds.includes(
          p.user_id
        )
    );


  if(!posts.length){

    box.innerHTML =
      `<div class="empty">
        Abhi koi post nahi hai.
      </div>`;

    return;
  }


  box.innerHTML =
    posts.map(
      post => `

      <div class="post">

        <div class="post-user">
          @${escapeHtml(
            post.username || "User"
          )}
        </div>


        <div class="post-time">
          ${formatDate(
            post.created_at
          )}
        </div>


        <div class="post-content">
          ${escapeHtml(
            post.content || ""
          )}
        </div>


        <div class="post-actions">


          <button
            onclick="
              toggleAction(
                '${post.id}',
                'jhappi'
              )
            ">
            🤗 Jhappi
          </button>


          <button
            onclick="
              toggleAction(
                '${post.id}',
                'chupair'
              )
            ">
            👋 Chupair
          </button>


          <button
            onclick="
              showNotice('Love')
            ">
            ❤️ Love
          </button>


          <button
            onclick="
              showNotice('Haha')
            ">
            😂 Haha
          </button>


          <button
            class="comment-btn"
            onclick="
              toggleComments(
                '${post.id}'
              )
            ">
            💬 Comments
          </button>


          ${
            post.user_id === currentUser.id

            ?

            `<button
              class="delete-btn"
              onclick="
                deletePost(
                  '${post.id}'
                )
              ">
              🗑️ Delete
            </button>`

            :

            `<button
              class="block-btn"
              onclick="
                blockUser(
                  '${post.user_id}'
                )
              ">
              🚫 Block
            </button>`
          }


        </div>


        <!-- COMMENTS -->

        <div
          id="comments-${post.id}"
          class="comments-area">


          <div
            id="comment-list-${post.id}">

            Loading comments...

          </div>


          <div
            class="comment-input-row">


            <input
              id="comment-input-${post.id}"
              placeholder="Write a comment..."
              onkeydown="
                if(event.key==='Enter'){
                  event.preventDefault();
                  addComment('${post.id}');
                }
              "
            >


            <button
              onclick="
                addComment(
                  '${post.id}'
                )
              ">
              ➤
            </button>


          </div>


        </div>


      </div>

    `
    ).join("");

}


/* =====================================================
   ADD COMMENT
===================================================== */

async function addComment(postId){

  if(!currentUser){

    alert(
      "Please login first."
    );

    return;
  }


  const input =
    document.getElementById(
      "comment-input-" +
      postId
    );


  if(!input){

    alert(
      "Comment box nahi mila."
    );

    return;
  }


  const text =
    input.value.trim();


  if(!text) return;


  const {
    error
  } =
  await supabaseClient
    .from("comments")
    .insert({

      post_id:postId,

      user_id:currentUser.id,

      username:currentUsername,

      content:text

    });


  if(error){

    console.error(
      "COMMENT SAVE ERROR:",
      error
    );


    alert(
      "Comment save nahi hua.\n\n" +
      error.message
    );


    return;
  }


  input.value = "";


  await loadComments(
    postId
  );

}


/* =====================================================
   LOAD COMMENTS
===================================================== */

async function loadComments(postId){

  const box =
    document.getElementById(
      "comment-list-" +
      postId
    );


  if(!box) return;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("comments")
    .select("*")
    .eq(
      "post_id",
      postId
    )
    .order(
      "created_at",
      {ascending:true}
    );


  if(error){

    console.error(
      "COMMENT LOAD ERROR:",
      error
    );


    box.innerHTML =
      `<div class="empty">
        Comments load nahi hue.
      </div>`;


    return;
  }


  if(!data || !data.length){

    box.innerHTML =
      `<div class="empty">
        No comments yet.
      </div>`;


    return;
  }


  box.innerHTML =
    data.map(
      comment => `

      <div class="comment">


        <div class="comment-user">

          @${escapeHtml(
            comment.username ||
            "User"
          )}

        </div>


        <div class="comment-text">

          ${escapeHtml(
            comment.content ||
            ""
          )}

        </div>


        <button
          class="reply-btn"
          onclick="
            replyTo(
              '${escapeAttr(
                comment.username ||
                "User"
              )}'
            )
          ">

          ↩️ Reply

        </button>


      </div>

    `
    ).join("");

}


/* =====================================================
   TOGGLE COMMENTS
===================================================== */

async function toggleComments(postId){

  const area =
    document.getElementById(
      "comments-" +
      postId
    );


  if(!area) return;


  if(
    area.style.display ===
    "block"
  ){

    area.style.display =
      "none";

  }else{

    area.style.display =
      "block";


    await loadComments(
      postId
    );

  }

}


/* =====================================================
   REPLY
===================================================== */

function replyTo(username){

  replyToUser =
    username;


  replyToUserId =
    null;


  const preview =
    document.getElementById(
      "replyPreview"
    );


  const replyUsername =
    document.getElementById(
      "replyUsername"
    );


  if(replyUsername){

    replyUsername.textContent =
      "@" + username;

  }


  if(preview){

    preview.style.display =
      "block";

  }


  const input =
    document.getElementById(
      "chatInput"
    );


  if(input){

    input.value =
      "@" +
      username +
      " ";

    input.focus();

  }

}


/* =====================================================
   CANCEL REPLY
===================================================== */

function cancelReply(){

  replyToUser =
    "";

  replyToUserId =
    null;


  const preview =
    document.getElementById(
      "replyPreview"
    );


  if(preview){

    preview.style.display =
      "none";

  }


  const input =
    document.getElementById(
      "chatInput"
    );


  if(input){

    input.value =
      "";

  }

}


/* =====================================================
   DELETE POST
===================================================== */

async function deletePost(postId){

  if(!currentUser) return;


  const confirmDelete =
    confirm(
      "Kya aap ye post delete karna chahte hain?"
    );


  if(!confirmDelete) return;


  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .delete()
    .eq(
      "id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    );


  if(error){

    console.error(
      "DELETE POST ERROR:",
      error
    );


    alert(
      "Post delete nahi hua.\n\n" +
      error.message
    );


    return;
  }


  await loadPosts();

}


/* =====================================================
   BLOCK USER
===================================================== */

async function blockUser(userId){

  if(!currentUser) return;


  if(
    userId ===
    currentUser.id
  ){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("user_blocks")
    .insert({

      blocker_id:
        currentUser.id,

      blocked_id:
        userId

    });


  if(error){

    if(
      error.code ===
      "23505"
    ){

      alert(
        "Ye user already blocked hai."
      );

    }else{

      console.error(
        "BLOCK ERROR:",
        error
      );


      alert(
        "User block nahi hua.\n\n" +
        error.message
      );

    }


    return;
  }


  alert(
    "User blocked."
  );


  await loadPosts();

}


/* =====================================================
   POST ACTION
===================================================== */

async function toggleAction(
  postId,
  actionType
){

  if(!currentUser) return;


  const {
    data:existing,
    error:findError
  } =
  await supabaseClient
    .from("post_actions")
    .select("id")
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .eq(
      "action_type",
      actionType
    )
    .maybeSingle();


  if(findError){

    console.error(
      "ACTION FIND ERROR:",
      findError
    );


    return;
  }


  if(existing){

    const {
      error
    } =
    await supabaseClient
      .from("post_actions")
      .delete()
      .eq(
        "id",
        existing.id
      );


    if(error){

      console.error(
        "ACTION DELETE ERROR:",
        error
      );

    }


  }else{

    const {
      error
    } =
    await supabaseClient
      .from("post_actions")
      .insert({

        post_id:
          postId,

        user_id:
          currentUser.id,

        action_type:
          actionType

      });


    if(error){

      console.error(
        "ACTION INSERT ERROR:",
        error
      );


      alert(
        error.message
      );

    }

  }

}


/* =====================================================
   SEND TEXT MESSAGE
===================================================== */

/* =====================================================
   VOICE RECORDING
===================================================== */

async function toggleRecording(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "Voice recording browser mein supported nahi hai."
    );


    return;
  }


  /* STOP */

  if(isRecording){

    mediaRecorder.stop();

    isRecording =
      false;


    const status =
      document.getElementById(
        "recordStatus"
      );


    const voiceBtn =
      document.getElementById(
        "voiceBtn"
      );


    if(status){

      status.style.display =
        "none";

    }


    if(voiceBtn){

      voiceBtn.textContent =
        "🎤 Voice";

    }


    return;
  }


  /* START */

  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    audioChunks =
      [];


    mediaRecorder =
      new MediaRecorder(
        stream
      );


    mediaRecorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size > 0
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        alert(
          "Voice recording ready hai. Messages mein save karne ke liye Storage setup karna hoga."
        );

      };


    mediaRecorder.start();


    isRecording =
      true;


    const status =
      document.getElementById(
        "recordStatus"
      );


    const voiceBtn =
      document.getElementById(
        "voiceBtn"
      );


    if(status){

      status.style.display =
        "block";

    }


    if(voiceBtn){

      voiceBtn.textContent =
        "⏹️ Stop";

    }


  }catch(error){

    console.error(
      "MIC ERROR:",
      error
    );


    alert(
      "Microphone permission allow karein."
    );

  }

}

/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttr(value){

  return escapeHtml(value)
    .replace(
      /`/g,
      "&#096;"
    );

}


/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(date){

  if(!date) return "";


  try{

    return new Date(date)
      .toLocaleString();

  }catch{

    return "";

  }

}
