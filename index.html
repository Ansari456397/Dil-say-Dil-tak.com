<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Socialyte</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  color:#ffd6ff;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.header-buttons button{
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:18px;
}

.container{
  max-width:650px;
  margin:auto;
  padding:12px;
  padding-bottom:100px;
}

.profile-card{
  background:white;
  border-radius:18px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-bottom:12px;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:linear-gradient(135deg,#6c5ce7,#e056fd);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  font-weight:bold;
}

.profile-name{
  font-size:18px;
  font-weight:bold;
}

.status{
  font-size:13px;
  color:#28a745;
  margin-top:3px;
}

.create-box{
  background:white;
  border-radius:18px;
  padding:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-bottom:12px;
}

.create-box textarea{
  width:100%;
  min-height:80px;
  border:1px solid #e2e2e2;
  border-radius:14px;
  padding:12px;
  resize:none;
  font-size:15px;
  outline:none;
}

.create-box textarea:focus{
  border-color:#6c5ce7;
}

.post-btn{
  width:100%;
  border:0;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:12px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:14px;
}

.action{
  background:white;
  border:0;
  border-radius:14px;
  padding:12px 5px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:13px;
}

.action span{
  font-size:22px;
}

.action small{
  font-size:12px;
  font-weight:600;
}

.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.menu button{
  border:0;
  background:white;
  padding:12px 5px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  font-size:13px;
  min-height:48px;
}

.section-title{
  font-size:19px;
  font-weight:bold;
  margin:16px 3px 10px;
}

.post{
  background:white;
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:linear-gradient(135deg,#6c5ce7,#e056fd);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:18px;
}

.post-user{
  font-weight:bold;
  font-size:16px;
}

.post-time{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.post-content{
  margin:14px 0;
  line-height:1.5;
  white-space:pre-wrap;
}

.post-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.post-action{
  border:0;
  background:#f4f5fa;
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
}

.post-action.active{
  background:#e9e2ff;
  color:#6c5ce7;
  font-weight:bold;
}

.comment-box{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #eee;
}

.comment-input{
  width:100%;
  min-height:55px;
  border:1px solid #ddd;
  border-radius:12px;
  padding:10px;
  resize:none;
  outline:none;
  font-size:14px;
}

.comment-input:focus{
  border-color:#6c5ce7;
}

.comment-submit{
  width:100%;
  margin-top:7px;
  border:0;
  background:#6c5ce7;
  color:white;
  padding:9px;
  border-radius:10px;
  font-weight:bold;
}

.comments-list{
  margin-top:10px;
}

.comment{
  background:#f5f6fa;
  border-radius:12px;
  padding:9px 11px;
  margin-top:7px;
}

.comment-user{
  font-weight:bold;
  font-size:13px;
  color:#6c5ce7;
}

.comment-text{
  font-size:13px;
  margin-top:3px;
  white-space:pre-wrap;
}

.empty{
  background:white;
  border-radius:16px;
  padding:25px;
  text-align:center;
  color:#777;
}

/* =========================
   CHAT
========================= */

.chat-box{
  background:white;
  border-radius:18px;
  padding:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-top:15px;
}

.messages{
  max-height:360px;
  min-height:80px;
  overflow-y:auto;
  padding:4px;
}

.message{
  padding:10px;
  border-bottom:1px solid #eee;
}

.message-user{
  font-weight:bold;
  color:#6c5ce7;
  font-size:14px;
}

.message-text{
  margin-top:4px;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-word;
}

.chat-image{
  width:100%;
  max-width:280px;
  max-height:300px;
  object-fit:cover;
  border-radius:14px;
  margin-top:7px;
  display:block;
}

.chat-audio{
  width:100%;
  max-width:300px;
  margin-top:7px;
}

.chat-time{
  color:#999;
  font-size:10px;
  margin-top:5px;
}

.chat-tools{
  display:flex;
  gap:7px;
  margin-top:10px;
  align-items:center;
}

.chat-input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:12px;
  padding:11px;
  outline:none;
  font-size:14px;
}

.chat-input:focus{
  border-color:#6c5ce7;
}

.chat-btn{
  border:0;
  width:43px;
  height:43px;
  border-radius:12px;
  background:#f0edff;
  font-size:19px;
}

.chat-send{
  background:#6c5ce7;
  color:white;
}

.chat-btn.recording{
  background:#e74c3c;
  color:white;
}

.chat-file{
  display:none;
}

.record-status{
  display:none;
  font-size:12px;
  color:#e74c3c;
  margin-top:6px;
  text-align:center;
  font-weight:bold;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px 5px;
  box-shadow:0 -3px 12px rgba(0,0,0,.08);
  z-index:30;
}

.bottom-nav button{
  border:0;
  background:none;
  font-size:12px;
  color:#555;
}

.bottom-nav button span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

@media(max-width:400px){

  .actions{
    gap:5px;
  }

  .action{
    font-size:11px;
  }

  .menu{
    grid-template-columns:repeat(2,1fr);
  }

  .post-action{
    padding:8px 8px;
    font-size:11px;
  }

  .chat-tools{
    gap:4px;
  }

  .chat-btn{
    width:39px;
    height:39px;
  }

}

</style>

</head>

<body>

<header class="header">

  <div class="logo">
    Socia<span>lyte</span>
  </div>

  <div class="header-buttons">

    <button onclick="showNotice('Notifications coming soon 🔔')">
      🔔
    </button>

    <button onclick="showNotice('Settings coming soon ⚙️')">
      ⚙️
    </button>

  </div>

</header>


<div class="container">

  <div class="profile-card">

    <div class="avatar" id="avatar">
      U
    </div>

    <div>

      <div class="profile-name" id="profileName">
        Loading...
      </div>

      <div class="status">
        🟢 Online
      </div>

    </div>

  </div>


  <!-- CREATE POST -->

    <button

    >
      <span>👋</span>

    </button>

    <button
      class="action"
      onclick="showAction('❤️ Love')"
    >
      <span>❤️</span>
      <small>Love</small>
    </button>

    <button
      class="action"

  <div class="menu">

  <!-- POSTS -->

  <div class="section-title">

  </div>

  <div id="postsList">

    <div class="empty">

    </div>

  </div>


  <!-- PUBLIC CHAT -->

  <div
    class="section-title"
    id="publicChatTitle"

    💬 Public Chat

  <div class="chat-box">

  <div

</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">

    <span>📝</span>
    Posts
  </button>

  <button onclick="showNotice('Members coming soon')">
    <span>👥</span>
    Members
  </button>

  <button onclick="showNotice('Profile coming soon')">
    <span>👤</span>
    Profile
  </button>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;


/* =========================
   CHECK LOGIN
========================= */

async function checkUser(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getUser();

    if(error){

      console.error(
        "Supabase Auth Error:",
        error
      );

      document.getElementById("status")
        .textContent =
        "Login session error. Please login again.";

      return;
    }

    if(
      !data ||
      !data.user
    ){

      window.location.href =
        "login.html";

      return;
    }

    currentUser =
      data.user;

    const username =
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "User";

    document.getElementById(
      "profileName"
    ).textContent =
      username;

    document.getElementById(
      "avatar"
    ).textContent =
      username.charAt(0).toUpperCase();

    await loadPosts();

    await loadMessages();

  }catch(error){

    console.error(
      "Website Error:",
      error
    );

    document.getElementById(
      "status"
    ).textContent =
      "Something went wrong. Please refresh.";

  }

}


/* =========================
   CREATE POST
========================= */

async function createPost(){

  if(!currentUser){

    alert("Please login first.");
    return;

  }

  const input =
    document.getElementById(
      "postInput"
    );

  const content =
    input.value.trim();

  if(!content){

    alert("Please write something.");
    return;

  }

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({

      user_id:currentUser.id,

      username:username,

      content:content

    });

  if(error){

    alert(error.message);
    return;

  }

  input.value = "";

  await loadPosts();

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const box =
    document.getElementById(
      "postsList"
    );

  try{

    const {
      data:blockedRows,
      error:blockError
    } =
    await supabaseClient
      .from("user_blocks")
      .select("blocked_id");

    if(blockError){

      console.error(
        "Block error:",
        blockError
      );

    }

    const blockedIds =
      new Set(
        (blockedRows || [])
          .map(
            row => row.blocked_id
          )
      );


    const {
      data,
      error
    } =
    await supabaseClient
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );

    if(error){

      box.innerHTML =
        `<div class="empty">
          ${escapeHtml(error.message)}
        </div>`;

      return;

    }


    const visiblePosts =
      (data || []).filter(
        post =>
          !blockedIds.has(
            post.user_id
          )
      );


    if(
      visiblePosts.length === 0
    ){

      box.innerHTML =
        `<div class="empty">
          No posts yet.<br>
          Be the first to post! ✨
        </div>`;

      return;

    }


    box.innerHTML = "";


    for(
      const post
      of visiblePosts
    ){

      const article =
        document.createElement(
          "div"
        );

      article.className =
        "post";


      const username =
        post.username ||
        "User";


      const isMine =
        post.user_id ===
        currentUser.id;


      const postOptions =
        isMine

        ?

        `
        <button
          class="post-action"
          onclick="deletePost(${post.id})"
        >
          🗑️ Delete
        </button>
        `

        :

        `
        <button
          class="post-action"
          onclick="blockUser('${escapeAttribute(post.user_id)}')"
        >
          🚫 Block
        </button>
        `;


      const time =
        new Date(
          post.created_at
        ).toLocaleString(
          [],
          {
            day:"2-digit",
            month:"short",
            hour:"2-digit",
            minute:"2-digit"
          }
        );


      article.innerHTML = `

        <div class="post-head">

          <div class="post-avatar">
            ${escapeHtml(
              username
                .charAt(0)
                .toUpperCase()
            )}
          </div>

          <div>

            <div class="post-user">
              ${escapeHtml(username)}
            </div>

            <div class="post-time">
              ● Active · ${time}
            </div>

          </div>

        </div>


        <div class="post-content">
          ${escapeHtml(
            post.content
          )}
        </div>


        <div
          class="post-actions"
          id="actions-${post.id}"
        >

          <button
            class="post-action"
            onclick="
              togglePostAction(
                ${post.id},
                'jhappi'
              )
            "
          >
            🤗 Jhappi
            <span id="jhappi-${post.id}">
              0
            </span>
          </button>


          <button
            class="post-action"
            onclick="
              togglePostAction(
                ${post.id},
                'chupair'
              )
            "
          >
            👋 Chupair
            <span id="chupair-${post.id}">
              0
            </span>
          </button>


          <button
            class="post-action"
            onclick="
              toggleComments(${post.id})
            "
          >
            💬 Comment
            <span id="comment-count-${post.id}">
              0
            </span>
          </button>


          <button
            class="post-action"
            onclick="
              replyToPost(
                '${escapeAttribute(username)}'
              )
            "
          >
            ↩️ Reply
          </button>


          ${postOptions}

        </div>


        <div
          class="comment-box"
          id="comment-box-${post.id}"
          style="display:none;"
        >

          <textarea
            class="comment-input"
            id="comment-input-${post.id}"
            placeholder="Write a comment..."
          ></textarea>

          <button
            class="comment-submit"
            onclick="
              addComment(${post.id})
            "
          >
            💬 Post Comment
          </button>

          <div
            class="comments-list"
            id="comments-${post.id}"
          ></div>

        </div>

      `;


      box.appendChild(
        article
      );


      loadPostActions(
        post.id
      );

      loadCommentCount(
        post.id
      );

    }

  }catch(error){

    console.error(
      "Load Posts Error:",
      error
    );

    box.innerHTML =
      `<div class="empty">
        ${escapeHtml(
          error.message
        )}
      </div>`;

  }

}


/* =========================
   DELETE POST
========================= */

async function deletePost(
  postId
){

  if(!currentUser){
    return;
  }

  const confirmDelete =
    confirm(
      "Delete this post?"
    );

  if(!confirmDelete){
    return;
  }

  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .delete()
    .eq(
      "id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    );

  if(error){

    alert(
      error.message
    );

    return;
  }

  await loadPosts();

}


/* =========================
   BLOCK USER
========================= */

async function blockUser(
  userId
){

  if(
    !currentUser ||
    userId === currentUser.id
  ){

    return;

  }

  const confirmBlock =
    confirm(
      "Block this user?"
    );

  if(!confirmBlock){
    return;
  }

  const {
    error
  } =
  await supabaseClient
    .from("user_blocks")
    .insert({

      blocker_id:
        currentUser.id,

      blocked_id:
        userId

    });


  if(error){

    if(
      error.code ===
      "23505"
    ){

      alert(
        "This user is already blocked."
      );

    }else{

      alert(
        error.message
      );

    }

    return;
  }


  alert(
    "User blocked successfully."
  );


  await loadPosts();

}


/* =========================
   LOAD ACTION COUNTS
========================= */

async function loadPostActions(
  postId
){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("post_actions")
    .select(
      "user_id,action_type"
    )
    .eq(
      "post_id",
      postId
    );


  if(error){
    return;
  }


  let jhappiCount = 0;
  let chupairCount = 0;

  let myJhappi = false;
  let myChupair = false;


  (data || []).forEach(
    action => {

      if(
        action.action_type ===
        "jhappi"
      ){

        jhappiCount++;

        if(
          action.user_id ===
          currentUser.id
        ){

          myJhappi = true;

        }

      }


      if(
        action.action_type ===
        "chupair"
      ){

        chupairCount++;

        if(
          action.user_id ===
          currentUser.id
        ){

          myChupair = true;

        }

      }

    }
  );


  const jhappi =
    document.getElementById(
      "jhappi-" + postId
    );

  const chupair =
    document.getElementById(
      "chupair-" + postId
    );


  if(jhappi){

    jhappi.textContent =
      jhappiCount;

  }


  if(chupair){

    chupair.textContent =
      chupairCount;

  }


  const buttons =
    document.querySelectorAll(
      `#actions-${postId} .post-action`
    );


  if(buttons.length >= 2){

    buttons[0]
      .classList
      .toggle(
        "active",
        myJhappi
      );

    buttons[1]
      .classList
      .toggle(
        "active",
        myChupair
      );

  }

}

/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(
  postId
){

  const list =
    document.getElementById(
      "comments-" + postId
    );

  const count =
    document.getElementById(
      "comment-count-" + postId
    );

  if(!list){
    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("comments")
    .select("*")
    .eq(
      "post_id",
      postId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    list.innerHTML =
      `<div class="comment">
        ${escapeHtml(
          error.message
        )}
      </div>`;

    return;

  }


  if(count){

    count.textContent =
      (data || []).length;

  }


  if(
    !data ||
    data.length === 0
  ){

    list.innerHTML =
      `<div
        style="
          color:#777;
          font-size:12px;
          margin-top:8px;
        "
      >
        No comments yet.
      </div>`;

    return;

  }


  list.innerHTML = "";


  data.forEach(
    item => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "comment";


      div.innerHTML = `

        <div class="comment-user">
          ${escapeHtml(
            item.username ||
            "User"
          )}
        </div>

        <div class="comment-text">
          ${escapeHtml(
            item.comment
          )}
        </div>

      `;


      list.appendChild(
        div
      );

    }
  );

}

      );

/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(
  msg,
  box
){

  const username =
    msg.username ||
    "User";


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message";


  let content = "";


  const messageType =
    msg.message_type ||
    "text";


  if(
    messageType === "image" &&
    msg.media_url
  ){

    content = `

      <img
        class="chat-image"
        src="${escapeAttribute(msg.media_url)}"
        alt="Chat image"
        loading="lazy"
      >

    `;

  }

  else if(
    messageType === "voice" &&
    msg.media_url
  ){

    content = `

      <audio
        class="chat-audio"
        controls
        preload="metadata"
        src="${escapeAttribute(msg.media_url)}"
      ></audio>

    `;

  }

  else{

    content = `

      <div class="message-text">
        ${escapeHtml(msg.message || "")}
      </div>

    `;

  }


  let time = "";

  if(msg.created_at){

    time =
      new Date(
        msg.created_at
      ).toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );

  }


  div.innerHTML = `

    <div class="message-user">
      ${escapeHtml(username)}
    </div>

    ${content}

    <div class="chat-time">
      ${escapeHtml(time)}
    </div>

  `;


  box.appendChild(
    div
  );

}

/* =========================

async function toggleRecording(){

/* =========================
   START RECORDING
========================= */

async function startRecording(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "Voice recording is not supported by this browser."
    );

    return;

  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    audioChunks = [];


    let options = {};


    if(
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ){

      options.mimeType =
        "audio/webm";

    }


    mediaRecorder =
      new MediaRecorder(
        stream,
        options
      );


    mediaRecorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size > 0
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      async () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        const mimeType =
          mediaRecorder.mimeType ||
          "audio/webm";


        const audioBlob =
          new Blob(
            audioChunks,
            {
              type:mimeType
            }
          );


        if(
          audioBlob.size === 0
        ){

          alert(
            "Voice recording empty hai."
          );

          return;

        }


        await uploadVoice(
          audioBlob,
          mimeType
        );

      };


    mediaRecorder.start();

    isRecording = true;


    const btn =
      document.getElementById(
        "voiceBtn"
      );


    btn.classList.add(
      "recording"
    );


    btn.textContent =
      "⏹️";


    document.getElementById(
      "recordStatus"
    ).style.display =
      "block";


  }catch(error){

    console.error(
      error
    );

    alert(
      "Microphone permission allow karein."
    );

  }

}


/* =========================
   STOP RECORDING
========================= */

function stopRecording(){

  if(
    mediaRecorder &&
    isRecording
  ){

    isRecording = false;


    mediaRecorder.stop();


    const btn =
      document.getElementById(
        "voiceBtn"
      );


    btn.classList.remove(
      "recording"
    );


    btn.textContent =
      "🎤";


    document.getElementById(
      "recordStatus"
    ).style.display =
      "none";

  }

}


/* =========================
   UPLOAD VOICE
========================= */

async function uploadVoice(
  audioBlob,
  mimeType
){

  if(!currentUser){
    return;
  }


  document.getElementById(
    "status"
  ).textContent =
    "Uploading voice...";


  let extension =
    "webm";


  if(
    mimeType.includes(
      "mp4"
    )
  ){

    extension =
      "mp4";

  }

  else if(
    mimeType.includes(
      "ogg"
    )
  ){

    extension =
      "ogg";

  }


  const filePath =
    currentUser.id +
    "/" +
    Date.now() +
    "_voice." +
    extension;


  const {
    error:uploadError
  } =
  await supabaseClient
    .storage
    .from("chat-voice")
    .upload(
      filePath,
      audioBlob,
      {
        contentType:
          mimeType,
        upsert:false
      }
    );


  if(uploadError){

    alert(
      "Voice upload failed: " +
      uploadError.message
    );

    document.getElementById(
      "status"
    ).textContent = "";

    return;

  }


  const {
    data:urlData
  } =
  supabaseClient
    .storage
    .from("chat-voice")
    .getPublicUrl(
      filePath
    );


  const voiceUrl =
    urlData.publicUrl;


  const {
    error:messageError
  } =
  await supabaseClient
    .from("messages")
    .insert({

      user_id:
        currentUser.id,

      username:
        getUsername(),

      message:
        "🎤 Voice message",

      message_type:
        "voice",

      media_url:
        voiceUrl

    });


  if(messageError){

    alert(
      "Voice message save failed: " +
      messageError.message
    );

    return;

  }


  document.getElementById(
    "status"
  ).textContent = "";


  await loadMessages();

}

/* =========================
   SECURITY
========================= */

function escapeHtml(
  value
){

  return String(value ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttribute(
  value
){

  return String(value ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    );

}
