
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Socialyte</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  color:#ffd6ff;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.header-buttons button{
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:18px;
}

.container{
  max-width:650px;
  margin:auto;
  padding:12px;
  padding-bottom:90px;
}

.profile-card{
  background:white;
  border-radius:18px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-bottom:12px;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:linear-gradient(135deg,#6c5ce7,#e056fd);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:24px;
  font-weight:bold;
}

.profile-name{
  font-size:18px;
  font-weight:bold;
}

.status{
  font-size:13px;
  color:#28a745;
  margin-top:3px;
}

.create-box{
  background:white;
  border-radius:18px;
  padding:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-bottom:12px;
}

.create-box textarea{
  width:100%;
  min-height:80px;
  border:1px solid #e2e2e2;
  border-radius:14px;
  padding:12px;
  resize:none;
  font-size:15px;
  outline:none;
}

.create-box textarea:focus{
  border-color:#6c5ce7;
}

.post-btn{
  width:100%;
  border:0;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:12px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

.actions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:14px;
}

.action{
  background:white;
  border:0;
  border-radius:14px;
  padding:10px 5px;
  font-size:13px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}

.menu button{
  border:0;
  background:white;
  padding:12px 5px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  font-size:13px;
}

.section-title{
  font-size:19px;
  font-weight:bold;
  margin:16px 3px 10px;
}

.post{
  background:white;
  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:linear-gradient(135deg,#6c5ce7,#e056fd);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:18px;
}

.post-user{
  font-weight:bold;
  font-size:16px;
}

.post-time{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.post-content{
  margin:14px 0;
  line-height:1.5;
  white-space:pre-wrap;
}

.post-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.post-action{
  border:0;
  background:#f4f5fa;
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
}

.post-action.active{
  background:#e9e2ff;
  color:#6c5ce7;
  font-weight:bold;
}

.empty{
  background:white;
  border-radius:16px;
  padding:25px;
  text-align:center;
  color:#777;
}

.chat-box{
  background:white;
  border-radius:18px;
  padding:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  margin-top:15px;
}

.messages{
  max-height:280px;
  overflow-y:auto;
}

.message{
  padding:8px 0;
  border-bottom:1px solid #eee;
}

.message-user{
  font-weight:bold;
  color:#6c5ce7;
}

.message-text{
  margin-top:3px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px 5px;
  box-shadow:0 -3px 12px rgba(0,0,0,.08);
  z-index:30;
}

.bottom-nav button{
  border:0;
  background:none;
  font-size:12px;
  color:#555;
}

.bottom-nav button span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

@media(max-width:400px){

  .actions{
    gap:5px;
  }

  .action{
    font-size:11px;
  }

  .menu{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>

</head>

<body>

  <div class="header-buttons">

    >

    <button
      class="action"
      onclick="showAction('❤️ Love')"
    >
      ❤️<br>

    </button>

    <button
      class="action"
      onclick="showAction('😂 Haha')"

      😂<br>

  <div class="menu">

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
"YOUR_SUPABASE_PUBLISHABLE_KEY";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;


/* =========================
   CHECK LOGIN
========================= */

async function checkUser(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getUser();

    if(error){

      console.error(
        "Supabase Auth Error:",
        error
      );

      document.getElementById("status")
        .textContent =
        "Login session error. Please login again.";

      return;
    }

    if(
      !data ||
      !data.user
    ){

      window.location.href =
        "login.html";

      return;
    }

    currentUser =
      data.user;

    const username =
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "User";

    document.getElementById(
      "profileName"
    ).textContent =
      username;

    document.getElementById(
      "avatar"
    ).textContent =
      username.charAt(0).toUpperCase();

    await loadPosts();

    await loadMessages();

  }catch(error){

    console.error(
      "Website Error:",
      error
    );

    document.getElementById(
      "status"
    ).textContent =
      "Something went wrong. Please refresh.";

  }

}


/* =========================
   CREATE POST
========================= */

async function createPost(){

  if(!currentUser){

    alert("Please login first.");
    return;

  }

  const input =
    document.getElementById(
      "postInput"
    );

  const content =
    input.value.trim();

  if(!content){

    alert("Please write something.");
    return;

  }

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .insert({

      user_id:currentUser.id,

      username:username,

      content:content

    });

  if(error){

    alert(error.message);
    return;

  }

  input.value = "";

  await loadPosts();

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const box =
    document.getElementById(
      "postsList"
    );

  try{

    const {
      data:blockedRows,
      error:blockError
    } =
    await supabaseClient
      .from("user_blocks")
      .select("blocked_id");

    if(blockError){

      console.error(
        "Block error:",
        blockError
      );

    }

    const blockedIds =
      new Set(
        (blockedRows || [])
          .map(
            row => row.blocked_id
          )
      );


    const {
      data,
      error
    } =
    await supabaseClient
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );

    if(error){

      box.innerHTML =
        `<div class="empty">
          ${escapeHtml(error.message)}
        </div>`;

      return;

    }


    const visiblePosts =
      (data || []).filter(
        post =>
          !blockedIds.has(
            post.user_id
          )
      );


    if(
      visiblePosts.length === 0
    ){

      box.innerHTML =
        `<div class="empty">
          No posts yet.<br>
          Be the first to post! ✨
        </div>`;

      return;

    }


    box.innerHTML = "";


    for(
      const post
      of visiblePosts
    ){

      const article =
        document.createElement(
          "div"
        );

      article.className =
        "post";


      const username =
        post.username ||
        "User";


      const isMine =
        post.user_id ===
        currentUser.id;


      const postOptions =
        isMine

        ?

        `
        <button
          class="post-action"
          onclick="deletePost(${post.id})"
        >
          🗑️ Delete
        </button>
        `

        :

        `
        <button
          class="post-action"
          onclick="blockUser('${post.user_id}')"
        >
          🚫 Block
        </button>
        `;


      const time =
        new Date(
          post.created_at
        ).toLocaleString(
          [],
          {
            day:"2-digit",
            month:"short",
            hour:"2-digit",
            minute:"2-digit"
          }
        );


      article.innerHTML = `

        <div class="post-head">

          <div class="post-avatar">
            ${escapeHtml(
              username
                .charAt(0)
                .toUpperCase()
            )}
          </div>

          <div>

            <div class="post-user">
              ${escapeHtml(username)}
            </div>

            <div class="post-time">
              ● Active · ${time}
            </div>

          </div>

        </div>


        <div class="post-content">
          ${escapeHtml(
            post.content
          )}
        </div>


        <div
          class="post-actions"
          id="actions-${post.id}"
        >

          <button
            class="post-action"
            onclick="
              togglePostAction(
                ${post.id},
                'jhappi'
              )
            "
          >
            🤗 Jhappi
            <span id="jhappi-${post.id}">
              0
            </span>
          </button>


          <button
            class="post-action"
            onclick="
              togglePostAction(
                ${post.id},
                'chupair'
              )
            "
          >
            👋 Chupair
            <span id="chupair-${post.id}">
              0
            </span>
          </button>


          <button
            class="post-action"
            onclick="
              replyToPost(
                '${escapeAttribute(username)}'
              )
            "
          >
            ↩️ Reply
          </button>


          ${postOptions}

        </div>

      `;


      box.appendChild(
        article
      );


      loadPostActions(
        post.id
      );

    }

  }catch(error){

    console.error(
      "Load Posts Error:",
      error
    );

    box.innerHTML =
      `<div class="empty">
        ${escapeHtml(
          error.message
        )}
      </div>`;

  }

}


/* =========================
   DELETE POST
========================= */

async function deletePost(
  postId
){

  if(!currentUser){
    return;
  }

  const confirmDelete =
    confirm(
      "Delete this post?"
    );

  if(!confirmDelete){
    return;
  }

  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .delete()
    .eq(
      "id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    );

  if(error){

    alert(
      error.message
    );

    return;
  }

  await loadPosts();

}


/* =========================
   BLOCK USER
========================= */

async function blockUser(
  userId
){

  if(
    !currentUser ||
    userId === currentUser.id
  ){

    return;

  }

  const confirmBlock =
    confirm(
      "Block this user?"
    );

  if(!confirmBlock){
    return;
  }

  const {
    error
  } =
  await supabaseClient
    .from("user_blocks")
    .insert({

      blocker_id:
        currentUser.id,

      blocked_id:
        userId

    });


  if(error){

    if(
      error.code ===
      "23505"
    ){

      alert(
        "This user is already blocked."
      );

    }else{

      alert(
        error.message
      );

    }

    return;
  }


  alert(
    "User blocked successfully."
  );


  await loadPosts();

}


/* =========================
   LOAD ACTION COUNTS
========================= */

async function loadPostActions(
  postId
){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("post_actions")
    .select(
      "user_id,action_type"
    )
    .eq(
      "post_id",
      postId
    );


  if(error){
    return;
  }


  let jhappiCount = 0;
  let chupairCount = 0;

  let myJhappi = false;
  let myChupair = false;


  (data || []).forEach(
    action => {

      if(
        action.action_type ===
        "jhappi"
      ){

        jhappiCount++;

        if(
          action.user_id ===
          currentUser.id
        ){

          myJhappi = true;

        }

      }


      if(
        action.action_type ===
        "chupair"
      ){

        chupairCount++;

        if(
          action.user_id ===
          currentUser.id
        ){

          myChupair = true;

        }

      }

    }
  );


  const jhappi =
    document.getElementById(
      "jhappi-" + postId
    );

  const chupair =
    document.getElementById(
      "chupair-" + postId
    );


  if(jhappi){

    jhappi.textContent =
      jhappiCount;

  }


  if(chupair){

    chupair.textContent =
      chupairCount;

  }


  const buttons =
    document.querySelectorAll(
      `#actions-${postId} .post-action`
    );


  if(buttons.length >= 2){

    if(myJhappi){

      buttons[0]
        .classList
        .add("active");

    }

    if(myChupair){

      buttons[1]
        .classList
        .add("active");

    }

  }

}


/* =========================
   TOGGLE ACTION
========================= */

async function togglePostAction(
  postId,
  actionType
){

  if(!currentUser){

    alert(
      "Please login first."
    );

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("post_actions")
    .select("id")
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .eq(
      "action_type",
      actionType
    )
    .maybeSingle();


  if(error){

    alert(
      error.message
    );

    return;

  }


  /* REMOVE */

  if(data){

    const {
      error:deleteError
    } =
    await supabaseClient
      .from("post_actions")
      .delete()
      .eq(
        "id",
        data.id
      );


    if(deleteError){

      alert(
        deleteError.message
      );

      return;

    }

  }


  /* ADD */

  else{

    const {
      error:insertError
    } =
    await supabaseClient
      .from("post_actions")
      .insert({

        post_id:
          postId,

        user_id:
          currentUser.id,

        action_type:
          actionType

      });


    if(insertError){

      alert(
        insertError.message
      );

      return;

    }

  }


  /* TURANT COUNT UPDATE */

  await updateActionCount(
    postId,
    actionType
  );

}


/* =========================
   UPDATE ACTION COUNT
========================= */

async function updateActionCount(
  postId,
  actionType
){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("post_actions")
    .select("id")
    .eq(
      "post_id",
      postId
    )
    .eq(
      "action_type",
      actionType
    );


  if(error){

    console.error(
      error
    );

    return;

  }


  const count =
    (data || []).length;


  const counter =
    document.getElementById(
      actionType +
      "-" +
      postId
    );


  if(counter){

    counter.textContent =
      count;

  }


  /* BUTTON ACTIVE STATE */

  const buttons =
    document.querySelectorAll(
      `#actions-${postId} .post-action`
    );


  if(
    actionType ===
    "jhappi" &&
    buttons[0]
  ){

    const {
      data:mine
    } =
    await supabaseClient
      .from("post_actions")
      .select("id")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "action_type",
        "jhappi"
      )
      .maybeSingle();


    buttons[0]
      .classList
      .toggle(
        "active",
        !!mine
      );

  }


  if(
    actionType ===
    "chupair" &&
    buttons[1]
  ){

    const {
      data:mine
    } =
    await supabaseClient
      .from("post_actions")
      .select("id")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "action_type",
        "chupair"
      )
      .maybeSingle();


    buttons[1]
      .classList
      .toggle(
        "active",
        !!mine
      );

  }

}


/* =========================
   REPLY
========================= */

function replyToPost(
  username
){

  const input =
    document.getElementById(
      "postInput"
    );

  input.value =
    "@" +
    username +
    " ";

  input.focus();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   PUBLIC CHAT
========================= */

async function loadMessages(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select("*")
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    document.getElementById(
      "messages"
    ).textContent =
      error.message;

    return;

  }


  const box =
    document.getElementById(
      "messages"
    );


  box.innerHTML = "";


  (data || []).forEach(
    msg => {

      const username =
        msg.username ||
        "User";


      const div =
        document.createElement(
          "div"
        );

      div.className =
        "message";


      div.innerHTML = `

        <div class="message-user">
          ${escapeHtml(username)}
        </div>

        <div class="message-text">
          ${escapeHtml(msg.message)}
        </div>

      `;


      box.appendChild(
        div
      );

    }
  );

}

}

  message
){

    message
  );

/* =========================
   SECURITY
========================= */

function escapeHtml(
  value
){

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttribute(
  value
){

  return String(value)
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    );

}
