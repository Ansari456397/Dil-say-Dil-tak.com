<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Socialyte</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-bottom:80px;
}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  height:60px;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.logo span{
  font-weight:normal;
}

.online-btn{
  border:0;
  background:rgba(255,255,255,.15);
  color:white;
  padding:9px 12px;
  border-radius:20px;
  font-size:13px;
  cursor:pointer;
}

/* ================= CONTAINER ================= */

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:12px;
}

/* ================= BOXES ================= */

.create-post-box,
.welcome-box{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.box-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:10px;
}

#postInput{
  width:100%;
  min-height:90px;
  resize:none;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  font-size:15px;
  outline:none;
  font-family:Arial,sans-serif;
}

#postInput:focus{
  border-color:#7b61d9;
}

.post-media-row{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.media-btn{
  flex:1;
  border:0;
  background:#f0edff;
  color:#6045c5;
  padding:10px 7px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.media-btn:active{
  transform:scale(.98);
}

#recordStatus{
  display:none;
  margin-top:8px;
  text-align:center;
  color:#e74c3c;
  font-size:12px;
}

.welcome-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:5px;
}

.username-line{
  color:#777;
  font-size:13px;
}

/* ================= SECTION ================= */

.section-title{
  font-size:18px;
  font-weight:bold;
  margin:15px 3px 10px;
}

/* ================= FEED ================= */

.feed-item{
  background:white;
  border-radius:14px;
  padding:13px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.feed-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.feed-user{
  font-weight:bold;
  color:#5d42c5;
  font-size:15px;
}

.feed-date{
  color:#999;
  font-size:11px;
}

.feed-content{
  margin-top:9px;
  font-size:15px;
  line-height:1.5;
  word-break:break-word;
}

.feed-type{
  display:inline-block;
  margin-top:7px;
  font-size:11px;
  color:#999;
}

/* ================= ACTION BUTTONS ================= */

.action-row{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

.action-btn{
  border:0;
  background:#f3f4f8;
  color:#444;
  padding:7px 9px;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
}

.action-btn:hover{
  background:#e9e7f7;
}

.delete-btn{
  background:#ffecec;
  color:#d63031;
}

.block-btn{
  background:#fff3f3;
  color:#c0392b;
}

.follow-btn{
  background:#eeeaff;
  color:#5d42c5;
}

/* ================= COMMENTS ================= */

.comments-box{
  display:none;
  margin-top:10px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.comment-item{
  background:#f7f7fa;
  border-radius:9px;
  padding:8px;
  margin-bottom:7px;
}

.comment-user{
  font-weight:bold;
  font-size:12px;
  color:#5d42c5;
}

.comment-text{
  font-size:13px;
  margin-top:3px;
  word-break:break-word;
}

.comment-actions{
  margin-top:5px;
}

.reply-btn{
  border:0;
  background:none;
  color:#6c5ce7;
  font-size:11px;
  padding:0;
  cursor:pointer;
}

.comment-input-row{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.comment-input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:8px;
  padding:8px;
  outline:none;
  font-size:13px;
}

.comment-send{
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:8px;
  padding:0 12px;
  cursor:pointer;
}

.reply-box{
  display:none;
  margin-top:6px;
}

.reply-input-row{
  display:flex;
  gap:5px;
}

.reply-input{
  flex:1;
  border:1px solid #ddd;
  border-radius:8px;
  padding:7px;
  font-size:12px;
  outline:none;
}

.reply-send{
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:8px;
  padding:0 10px;
}

/* ================= EMPTY ================= */

.empty{
  background:white;
  border-radius:12px;
  padding:25px;
  text-align:center;
  color:#999;
}

/* ================= NOTICE ================= */

.notice{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%);
  z-index:3000;
  background:#222;
  color:white;
  padding:10px 15px;
  border-radius:10px;
  font-size:13px;
  max-width:90%;
  text-align:center;
  display:none;
}

/* ================= ONLINE POPUP ================= */

.online-popup{
  display:none;
  position:fixed;
  top:65px;
  right:10px;
  z-index:2000;
  width:240px;
  max-width:90%;
  background:white;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
  padding:12px;
}

.online-popup h3{
  margin:0 0 10px;
  font-size:16px;
}

.online-user{
  padding:8px;
  border-bottom:1px solid #eee;
  font-size:13px;
}

.online-dot{
  color:#16a085;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:1500;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -2px 10px rgba(0,0,0,.08);
}

.nav-btn{
  border:0;
  background:none;
  color:#666;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
}

.nav-icon{
  font-size:21px;
}

.nav-btn.active{
  color:#6c5ce7;
}

/* ================= MOBILE ================= */

@media(max-width:480px){

  .logo{
    font-size:22px;
  }

  .online-btn{
    font-size:12px;
    padding:8px 10px;
  }

  .container{
    padding:10px;
  }

  .post-media-row{
    gap:6px;
  }

  .media-btn{
    font-size:12px;
    padding:9px 4px;
  }

}

/* ================= LOADING ================= */

.loading{
  text-align:center;
  color:#888;
  padding:20px;
}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="logo">
    Socia<span>lyte</span>
  </div>

  <button
    class="online-btn"
    type="button"
    onclick="toggleOnlineUsers()">
    🟢 Online Users
  </button>

</header>


<!-- ================= ONLINE USERS ================= -->

<div id="onlinePopup" class="online-popup">

  <h3>🟢 Online Users</h3>

  <div id="onlineUsersList">
    Loading...
  </div>

</div>


<!-- ================= MAIN ================= -->

<main class="container">


  <!-- ================= CREATE POST ================= -->

  <div class="create-post-box">

    <div class="box-title">
      📝 Create Post
    </div>

    <textarea
      id="postInput"
      placeholder="Write a post..."
      autocomplete="off"></textarea>

    <div class="post-media-row">

      <button
        id="uploadImageBtn"
        class="media-btn"
        type="button">
        🖼️ Upload Image
      </button>

      <button

    <input

    </div>

  </div>


  <!-- ================= WELCOME ================= -->

  <div class="welcome-box">

    <div class="welcome-title">
      Welcome to Socialyte ♥️
    </div>

    <div class="username-line">
      Logged in as:
      <strong id="loggedInUsername">User</strong>
    </div>

  </div>


  <!-- ================= HOME FEED ================= -->

  <div class="section-title">
    🏠 Home Feed
  </div>

  <div id="homeFeed">

    <div class="empty">
      Loading feed...
    </div>

  </div>

</main>


<!-- ================= NOTICE ================= -->

<div id="notice" class="notice"></div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    type="button"
    onclick="goHome()">

    <span class="nav-icon">🏠</span>
    <span>Home</span>

  </button>


  <button
    class="nav-btn"
    type="button"
    onclick="goPrivate()">

    <span class="nav-icon">💬</span>
    <span>Private</span>

  </button>


  <button
    class="nav-btn"
    type="button"
    onclick="goProfile()">

    <span class="nav-icon">👤</span>
    <span>Profile</span>

  </button>


  <button
    class="nav-btn"
    type="button"
    onclick="goNotifications()">

    <span class="nav-icon">🔔</span>
    <span>Notifications</span>

  </button>


  <button
    class="nav-btn"
    type="button"
    onclick="goMore()">

    <span class="nav-icon">☰</span>
    <span>More</span>

  </button>

</nav>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUser = null;
let currentUsername = "User";

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttr(value){

  return escapeHtml(value)
    .replace(/`/g,"&#096;");
}


function formatDate(date){

  if(!date){
    return "";
  }

  const d = new Date(date);

  return d.toLocaleString();
}


function showNotice(message){

  const notice =
    document.getElementById("notice");

  if(!notice){
    return;
  }

  notice.textContent = message;
  notice.style.display = "block";

  clearTimeout(window.noticeTimer);

  window.noticeTimer =
    setTimeout(() => {

      notice.style.display = "none";

    },3000);
}


/* =====================================================
   CURRENT USER
===================================================== */

function setCurrentUser(user){

  currentUser = user;

  if(!user){
    currentUsername = "User";
    return;
  }

  currentUsername =
    user.user_metadata?.username ||
    user.user_metadata?.name ||
    user.email?.split("@")[0] ||
    "User";

  const usernameElement =
    document.getElementById(
      "loggedInUsername"
    );

  if(usernameElement){

    usernameElement.textContent =
      currentUsername;

  }

}


/* =====================================================
   CHECK USER
===================================================== */

async function checkUser(){

  try{

    let user = null;

    const sessionResult =
      await supabaseClient.auth.getSession();

    if(
      sessionResult.data &&
      sessionResult.data.session
    ){

      user =
        sessionResult.data.session.user;

    }

    if(!user){

      const userResult =
        await supabaseClient.auth.getUser();

      if(
        userResult.data &&
        userResult.data.user
      ){

        user =
          userResult.data.user;

      }

    }

    if(!user){

      window.location.href = "login.html";
      return;

    }

    setCurrentUser(user);

    await loadFeed();

  }catch(error){

    console.error(
      "CHECK USER ERROR:",
      error
    );

    window.location.href =
      "login.html";

  }

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  async (event,session) => {

    if(session?.user){

      setCurrentUser(
        session.user
      );

    }

  }
);


/* =====================================================
   ADD POST
===================================================== */

async function addPost(){

  if(!currentUser){

    showNotice(
      "Please login first."
    );

    return;

  }

  const input =
    document.getElementById(
      "postInput"
    );

  if(!input){

    showNotice(
      "Post box nahi mila."
    );

    return;

  }

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  const { error } =
    await supabaseClient
      .from("posts")
      .insert({

        user_id:
          currentUser.id,

        username:
          currentUsername,

        content:
          text

      });

  if(error){

    console.error(
      "POST ERROR:",
      error
    );

    showNotice(
      "Post send nahi hua: " +
      error.message
    );

    return;

  }

  input.value = "";

  await loadFeed();

}


/* =====================================================
   LOAD FEED
===================================================== */

async function loadFeed(){

  const feed =
    document.getElementById(
      "homeFeed"
    );

  if(!feed){
    return;
  }

  feed.innerHTML =
    '<div class="loading">Loading feed...</div>';

  try{

    /* ---------- BLOCKED USERS ---------- */

    let blockedIds = [];

    if(currentUser){

      const blockedResult =
        await supabaseClient
          .from("user_blocks")
          .select("blocked_id")
          .eq(
            "blocker_id",
            currentUser.id
          );

      if(
        !blockedResult.error &&
        blockedResult.data
      ){

        blockedIds =
          blockedResult.data.map(
            row => row.blocked_id
          );

      }

    }


    /* ---------- POSTS ---------- */

    const postsResult =
      await supabaseClient
        .from("posts")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(postsResult.error){

      console.error(
        "POST LOAD ERROR:",
        postsResult.error
      );

    }


    /* ---------- MESSAGES ---------- */

    const messagesResult =
      await supabaseClient
        .from("home_messages")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(messagesResult.error){

      console.error(
        "MESSAGE LOAD ERROR:",
        messagesResult.error
      );

    }


    const posts =
      postsResult.data || [];

    const messages =
      messagesResult.data || [];


    /* ---------- COMBINE ---------- */

    let feedItems = [];


    posts.forEach(post => {

      if(
        !blockedIds.includes(
          post.user_id
        )
      ){

        feedItems.push({

          type:"post",
          data:post

        });

      }

    });


    messages.forEach(message => {

      if(
        !blockedIds.includes(
          message.user_id
        )
      ){

        feedItems.push({

          type:"message",
          data:message

        });

      }

    });


    /* ---------- NEWEST FIRST ---------- */

    feedItems.sort(
      (a,b) =>
        new Date(
          b.data.created_at
        ) -
        new Date(
          a.data.created_at
        )
    );


    if(feedItems.length === 0){

      feed.innerHTML =
        '<div class="empty">No posts or messages yet.</div>';

      return;

    }


    feed.innerHTML =
      feedItems
        .map(item => {

          if(item.type === "post"){

            return renderPost(
              item.data
            );

          }

          return renderMessage(
            item.data
          );

        })
        .join("");


    await loadPostActions();

    await loadFollowStatus();

  }catch(error){

    console.error(
      "FEED ERROR:",
      error
    );

    feed.innerHTML =
      '<div class="empty">Feed load nahi ho saki.</div>';

  }

}


/* =====================================================
   RENDER POST
===================================================== */

function renderPost(post){

  const isOwn =
    currentUser &&
    post.user_id ===
    currentUser.id;


  let buttons = "";


  if(isOwn){

    buttons += `
      <button
        class="action-btn delete-btn"
        onclick="deletePost(${post.id})">
        🗑️ Delete
      </button>
    `;

  }else{

    buttons += `
      <button
        class="action-btn block-btn"
        onclick="blockUser('${escapeAttr(post.user_id)}')">
        🚫 Block
      </button>

      <button
        id="follow-${post.user_id}"
        class="action-btn follow-btn"
        onclick="toggleFollow('${escapeAttr(post.user_id)}')">
        Follow
      </button>
    `;

  }


  return `

    <div
      class="feed-item"
      id="post-${post.id}">

      <div class="feed-head">

        <div class="feed-user">
          👤 ${escapeHtml(post.username || "User")}
        </div>

        <div class="feed-date">
          ${formatDate(post.created_at)}
        </div>

      </div>

      <div class="feed-content">
        ${escapeHtml(post.content)}
      </div>

      <div class="feed-type">
        📝 Post
      </div>

      <div class="action-row">

        ${buttons}

        <button
          id="like-btn-${post.id}"
          class="action-btn"
          onclick="toggleLike(${post.id})">
          ❤️ Like <span id="like-count-${post.id}">0</span>
        </button>

        <button
          id="dislike-btn-${post.id}"
          class="action-btn"
          onclick="toggleDislike(${post.id})">
          👎 Dislike <span id="dislike-count-${post.id}">0</span>
        </button>

        <button
          class="action-btn"
          onclick="toggleComments(${post.id})">
          💬 Comments
        </button>

      </div>

      <div
        id="comments-${post.id}"
        class="comments-box">

        <div
          id="comments-list-${post.id}">
          Loading comments...
        </div>

        <div class="comment-input-row">

          <input
            id="comment-input-${post.id}"
            class="comment-input"
            type="text"
            placeholder="Write a comment..."
            autocomplete="off">

          <button
            class="comment-send"
            onclick="addComment(${post.id})">
            ➤
          </button>

        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(message){

  const isOwn =
    currentUser &&
    message.user_id ===
    currentUser.id;


  let buttons = "";


  if(isOwn){

    buttons += `
      <button
        class="action-btn delete-btn"
        onclick="deleteHomeMessage(${message.id})">
        🗑️ Delete
      </button>
    `;

  }else{

    buttons += `
      <button
        class="action-btn block-btn"
        onclick="blockUser('${escapeAttr(message.user_id)}')">
        🚫 Block
      </button>
    `;

  }


  return `

    <div
      class="feed-item"
      id="message-${message.id}">

      <div class="feed-head">

        <div class="feed-user">
          👤 ${escapeHtml(message.username || "User")}
        </div>

        <div class="feed-date">
          ${formatDate(message.created_at)}
        </div>

      </div>

      <div class="feed-content">
        ${escapeHtml(message.message)}
      </div>

      <div class="feed-type">
        💬 Message
      </div>

      <div class="action-row">

        ${buttons}

      </div>

    </div>

  `;

}


/* =====================================================
   DELETE POST
===================================================== */

async function deletePost(postId){

  if(!currentUser){
    return;
  }

  if(
    !confirm(
      "Delete this post?"
    )
  ){
    return;
  }

  const { error } =
    await supabaseClient
      .from("posts")
      .delete()
      .eq(
        "id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      );

  if(error){

    showNotice(
      "Delete nahi hua: " +
      error.message
    );

    return;

  }

  await loadFeed();

}


/* =====================================================
   DELETE HOME MESSAGE
===================================================== */

async function deleteHomeMessage(messageId){

  if(!currentUser){
    return;
  }

  if(
    !confirm(
      "Delete this message?"
    )
  ){
    return;
  }

  const { error } =
    await supabaseClient
      .from("home_messages")
      .delete()
      .eq(
        "id",
        messageId
      )
      .eq(
        "user_id",
        currentUser.id
      );

  if(error){

    showNotice(
      "Message delete nahi hua: " +
      error.message
    );

    return;

  }

  await loadFeed();

}


/* =====================================================
   POST ACTIONS
===================================================== */

async function loadPostActions(){

  const { data,error } =
    await supabaseClient
      .from("post_actions")
      .select("*");

  if(error){

    console.error(
      "ACTION LOAD ERROR:",
      error
    );

    return;

  }


  const actions =
    data || [];


  document
    .querySelectorAll(
      "[id^='like-count-']"
    )
    .forEach(element => {

      const postId =
        Number(
          element.id
            .replace(
              "like-count-",
              ""
            )
        );

      const count =
        actions.filter(
          row =>
            row.post_id === postId &&
            row.action_type === "like"
        ).length;

      element.textContent =
        count;

    });


  document
    .querySelectorAll(
      "[id^='dislike-count-']"
    )
    .forEach(element => {

      const postId =
        Number(
          element.id
            .replace(
              "dislike-count-",
              ""
            )
        );

      const count =
        actions.filter(
          row =>
            row.post_id === postId &&
            row.action_type === "dislike"
        ).length;

      element.textContent =
        count;

    });

}


/* =====================================================
   SET POST ACTION
===================================================== */

async function setPostAction(
  postId,
  actionType
){

  if(!currentUser){

    showNotice(
      "Please login first."
    );

    return;

  }


  const opposite =
    actionType === "like"
      ? "dislike"
      : "like";


  const existing =
    await supabaseClient
      .from("post_actions")
      .select("*")
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "action_type",
        actionType
      )
      .maybeSingle();


  if(existing.data){

    await supabaseClient
      .from("post_actions")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "action_type",
        actionType
      );

  }else{

    await supabaseClient
      .from("post_actions")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "action_type",
        opposite
      );


    const { error } =
      await supabaseClient
        .from("post_actions")
        .insert({

          post_id:postId,

          user_id:
            currentUser.id,

          action_type:
            actionType

        });


    if(error){

      console.error(
        "ACTION ERROR:",
        error
      );

    }

  }

  await loadPostActions();

}

async function loadComments(postId){

  const list =
    document.getElementById(
      "comments-list-" + postId
    );

  if(!list){
    return;
  }


  const { data,error } =
    await supabaseClient
      .from("comments")
      .select("*")
      .eq(
        "post_id",
        postId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "COMMENTS ERROR:",
      error
    );

    list.innerHTML =
      "<div>No comments found.</div>";

    return;

  }


  const comments =
    data || [];


  if(comments.length === 0){

    list.innerHTML =
      '<div style="color:#999;font-size:12px;">No comments yet.</div>';

    return;

  }


  list.innerHTML =
    comments
      .map(comment => `

        <div
          class="comment-item"
          id="comment-${comment.id}">

          <div class="comment-user">
            @${escapeHtml(comment.username || "User")}
          </div>

          <div class="comment-text">
            ${escapeHtml(comment.content)}
          </div>

          <div class="comment-actions">

            <button
              class="reply-btn"
              onclick="showCommentReply(
                ${comment.id},
                '${escapeAttr(comment.username || "User")}'
              )">
              ↩ Reply
            </button>

          </div>

          <div
            id="reply-box-${comment.id}-${postId}"
            class="reply-box">

            <div class="reply-input-row">

              <input
                id="reply-input-${comment.id}-${postId}"
                class="reply-input"
                type="text"
                placeholder="@${escapeAttr(comment.username || "User")}">

              <button
                class="reply-send"
                onclick="sendCommentReply(
                  ${comment.id},
                  ${postId}
                )">
                ➤
              </button>

            </div>

          </div>

        </div>

      `)
      .join("");

}


function setupCommentInput(postId){

/* =====================================================
   COMMENT REPLY
===================================================== */

function showCommentReply(
  commentId,
  username
){

  const boxes =
    document.querySelectorAll(
      '[id^="reply-box-"]'
    );


  boxes.forEach(box => {

    box.style.display =
      "none";

  });


  let targetBox = null;


  boxes.forEach(box => {

    if(
      box.id.startsWith(
        "reply-box-" +
        commentId +
        "-"
      )
    ){

      targetBox =
        box;

    }

  });


  if(!targetBox){
    return;
  }


  targetBox.style.display =
    "block";


  const input =
    targetBox.querySelector(
      "input"
    );


  if(input){

    input.placeholder =
      "@" + username;

    input.focus();

  }

}

/* =====================================================
   VOICE
===================================================== */

async function toggleRecording(){

  const voiceBtn =
    document.getElementById(
      "voiceBtn"
    );

  const status =
    document.getElementById(
      "recordStatus"
    );


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    showNotice(
      "Voice recording browser mein available nahi."
    );

    return;

  }


  if(isRecording){

    if(mediaRecorder){

      mediaRecorder.stop();

    }

    return;

  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    audioChunks = [];


    mediaRecorder =
      new MediaRecorder(
        stream
      );


    mediaRecorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size > 0
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      () => {

        isRecording = false;

        if(voiceBtn){

          voiceBtn.textContent =
            "🎤 Voice";

        }

        if(status){

          status.style.display =
            "none";

        }


        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        showNotice(
          "🎤 Voice recording complete. Storage abhi setup nahi hai."
        );

      };


    mediaRecorder.start();

    isRecording = true;


    if(voiceBtn){

      voiceBtn.textContent =
        "⏹️ Stop Voice";

    }


    if(status){

      status.style.display =
        "block";

    }

  }catch(error){

    console.error(
      "VOICE ERROR:",
      error
    );

    showNotice(
      "Microphone permission allow karein."
    );

  }

}
