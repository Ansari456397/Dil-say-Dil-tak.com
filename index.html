<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  
  "https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let currentUsername = "User";

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;


/* =====================================================
   LOGIN / SESSION
   FIXED VERSION
===================================================== */

async function checkUser(){

  console.log("Checking Socialyte session...");

  try{

    let session = null;

    /*
      Kabhi login ke foran baad session
      thori der se available hota hai.
      Isliye 3 attempts kiye ja rahe hain.
    */

    for(let attempt = 1; attempt <= 3; attempt++){

      const {
        data,
        error
      } =
      await supabaseClient.auth.getSession();

      console.log(
        "SESSION ATTEMPT:",
        attempt,
        data
      );

      if(error){

        console.error(
          "SESSION ERROR:",
          error
        );

        break;
      }

      if(
        data &&
        data.session &&
        data.session.user
      ){

        session = data.session;
        break;
      }

      if(attempt < 3){

        await new Promise(
          resolve =>
            setTimeout(resolve, 700)
        );

      }

    }


    /*
      Agar session nahi mila tab hi login page
      par bhejna hai.
    */

    if(
      !session ||
      !session.user
    ){

      console.log(
        "NO ACTIVE SESSION - GOING TO LOGIN"
      );

      window.location.href =
        "login.html";

      return;
    }


    /* ===============================
       USER SET
    =============================== */

    currentUser =
      session.user;


    currentUsername =
      currentUser.user_metadata?.username ||
      currentUser.user_metadata?.name ||
      currentUser.email?.split("@")[0] ||
      "User";


    console.log(
      "LOGIN SESSION OK:",
      currentUser.email
    );


    /*
      IMPORTANT:
      Posts mein error aaye to user ko
      logout/login page par nahi bhejna.
    */

    try{

      await loadPosts();

    }

    catch(postError){

      console.error(
        "POST LOAD ERROR:",
        postError
      );

      const postsBox =
        document.getElementById("posts");

      if(postsBox){

        postsBox.innerHTML =
          '<div class="empty">Posts load nahi ho sake.</div>';

      }

    }

  }

  catch(error){

    /*
      Yahan redirect nahi hoga.
      Isse temporary database/network error
      login ko logout nahi samjhega.
    */

    console.error(
      "CHECK USER ERROR:",
      error
    );

  }

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    console.log(
      "AUTH EVENT:",
      event
    );


    if(
      session &&
      session.user
    ){

      currentUser =
        session.user;

      currentUsername =
        session.user.user_metadata?.username ||
        session.user.user_metadata?.name ||
        session.user.email?.split("@")[0] ||
        "User";

      console.log(
        "AUTH USER:",
        currentUser.email
      );

    }

  }
);


/* =====================================================
   PROFILE
===================================================== */

function openProfile(){

  window.location.href =
    "profile.html";

}


/* =====================================================
   LOAD POSTS
===================================================== */

async function loadPosts(){

  if(!currentUser){

    console.warn(
      "Cannot load posts: no user."
    );

    return;
  }


  const postsBox =
    document.getElementById("posts");


  if(!postsBox) return;


  postsBox.innerHTML =
    '<div class="empty">Loading posts...</div>';


  /* ===============================
     BLOCKED USERS
  =============================== */

  let blockedIds = [];


  try{

    const {
      data: blocked,
      error: blockError
    } =
    await supabaseClient
      .from("user_blocks")
      .select("blocked_id")
      .eq(
        "blocker_id",
        currentUser.id
      );


    if(blockError){

      console.warn(
        "BLOCK LOAD ERROR:",
        blockError
      );

    }

    else{

      blockedIds =
        (blocked || [])
          .map(
            item =>
              item.blocked_id
          );

    }

  }

  catch(error){

    console.warn(
      "BLOCK CHECK FAILED:",
      error
    );

  }


  /* ===============================
     GET POSTS
  =============================== */

  const {
    data,
    error
  } =
  await supabaseClient
    .from("posts")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(
      "POST ERROR:",
      error
    );

    postsBox.innerHTML =
      '<div class="empty">Posts load nahi hue.</div>';

    return;
  }


  const posts =
    (data || [])
      .filter(
        post =>
          !blockedIds.includes(
            post.user_id
          )
      );


  if(posts.length === 0){

    postsBox.innerHTML =
      '<div class="empty">No posts yet.</div>';

    return;
  }


  postsBox.innerHTML =
    posts
      .map(renderPost)
      .join("");

}


/* =====================================================
   RENDER POST
===================================================== */

function renderPost(post){

  const ownPost =
    post.user_id === currentUser.id;


  let controls = "";


  if(ownPost){

    controls = `
      <button
        type="button"
        onclick="deletePost('${escapeAttr(post.id)}')">
        🗑️ Delete Post
      </button>
    `;

  }

  else{

    controls = `
      <button
        type="button"
        onclick="blockUser('${escapeAttr(post.user_id)}')">
        🚫 Block
      </button>
    `;

  }


  return `

    <div
      class="post"
      id="post-${escapeAttr(post.id)}">

      <div class="post-user">
        ${escapeHtml(post.username || "User")}
      </div>


      <div class="post-date">
        ${formatDate(post.created_at)}
      </div>


      <div class="post-content">
        ${escapeHtml(post.content || "")}
      </div>


      <div class="post-actions">

        <button
          type="button"
          onclick="toggleLike('${escapeAttr(post.id)}')">
          👍 Like
        </button>


        <button
          type="button"
          onclick="toggleDislike('${escapeAttr(post.id)}')">
          👎 Dislike
        </button>


        <button
          type="button"
          onclick="toggleComments('${escapeAttr(post.id)}')">
          💬 Comments
        </button>


        ${controls}

      </div>


      <div
        class="comments"
        id="comments-${escapeAttr(post.id)}">

        <div
          id="comment-list-${escapeAttr(post.id)}">
        </div>


        <div class="comment-box">

          <input
            id="comment-input-${escapeAttr(post.id)}"
            type="text"
            placeholder="Write a comment..."
            onkeydown="
              if(event.key === 'Enter'){
                event.preventDefault();
                addComment('${escapeAttr(post.id)}');
              }
            "
          >


          <button
            type="button"
            onclick="addComment('${escapeAttr(post.id)}')">
            ➤
          </button>

        </div>

      </div>

    </div>

  `;

}


/* =====================================================
   TOGGLE COMMENTS
===================================================== */

async function toggleComments(postId){

  const box =
    document.getElementById(
      "comments-" + postId
    );


  if(!box) return;


  if(
    box.style.display === "block"
  ){

    box.style.display =
      "none";

    return;

  }


  box.style.display =
    "block";


  await loadComments(postId);

}


/* =====================================================
   LOAD COMMENTS
===================================================== */

async function loadComments(postId){

  const list =
    document.getElementById(
      "comment-list-" + postId
    );


  if(!list) return;


  list.innerHTML =
    '<div class="empty">Loading comments...</div>';


  const {
    data,
    error
  } =
  await supabaseClient
    .from("comments")
    .select("*")
    .eq(
      "post_id",
      postId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    console.error(
      "COMMENTS ERROR:",
      error
    );

    list.innerHTML =
      '<div class="empty">Comments load nahi hue.</div>';

    return;
  }


  if(
    !data ||
    data.length === 0
  ){

    list.innerHTML =
      '<div class="empty">No comments yet.</div>';

    return;
  }


  list.innerHTML =
    data
      .map(
        comment => {

          const username =
            comment.username ||
            "User";


          return `

            <div
              class="comment"
              id="comment-${escapeAttr(comment.id)}">

              <div class="comment-user">
                ${escapeHtml(username)}
              </div>


              <div class="comment-text">
                ${escapeHtml(comment.content || "")}
              </div>


              <div class="comment-actions">

                <button
                  type="button"
                  onclick="
                    showCommentReply(
                      '${escapeAttr(comment.id)}',
                      '${escapeAttr(username)}'
                    )
                  ">
                  ↩️ Reply
                </button>

              </div>


              <div
                class="comment-reply-box"
                id="reply-box-${escapeAttr(comment.id)}">

                <div class="comment-reply-row">

                  <input
                    id="reply-input-${escapeAttr(comment.id)}"
                    type="text"
                    placeholder="Reply to ${escapeAttr(username)}..."
                    onkeydown="
                      if(event.key === 'Enter'){
                        event.preventDefault();
                        sendCommentReply(
                          '${escapeAttr(comment.id)}',
                          '${escapeAttr(postId)}'
                        );
                      }
                    "
                  >


                  <button
                    type="button"
                    onclick="
                      sendCommentReply(
                        '${escapeAttr(comment.id)}',
                        '${escapeAttr(postId)}'
                      )
                    ">
                    ➤
                  </button>

                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =====================================================
   SHOW COMMENT REPLY
===================================================== */

function showCommentReply(
  commentId,
  username
){

  const box =
    document.getElementById(
      "reply-box-" + commentId
    );


  const input =
    document.getElementById(
      "reply-input-" + commentId
    );


  if(!box || !input) return;


  box.style.display =
    "block";


  input.value =
    "@" + username + " ";


  input.focus();

}


/* =====================================================
   SEND COMMENT REPLY
===================================================== */

async function sendCommentReply(
  commentId,
  postId
){

  if(!currentUser){

    alert("Please login first.");

    return;
  }


  const input =
    document.getElementById(
      "reply-input-" + commentId
    );


  if(!input) return;


  const text =
    input.value.trim();


  if(!text) return;


  const {
    error
  } =
  await supabaseClient
    .from("comments")
    .insert({

      post_id:postId,
      user_id:currentUser.id,
      username:currentUsername,
      content:text

    });


  if(error){

    console.error(
      "REPLY ERROR:",
      error
    );

    alert(
      "Reply send nahi hua.\n\n" +
      error.message
    );

    return;
  }


  input.value = "";


  await loadComments(postId);

}


/* =====================================================
   ADD COMMENT
===================================================== */

async function addComment(postId){

  if(!currentUser){

    alert("Please login first.");

    return;
  }


  const input =
    document.getElementById(
      "comment-input-" + postId
    );


  if(!input) return;


  const text =
    input.value.trim();


  if(!text) return;


  const {
    error
  } =
  await supabaseClient
    .from("comments")
    .insert({

      post_id:postId,
      user_id:currentUser.id,
      username:currentUsername,
      content:text

    });


  if(error){

    console.error(
      "COMMENT ERROR:",
      error
    );

    alert(
      "Comment send nahi hua.\n\n" +
      error.message
    );

    return;
  }


  input.value = "";


  await loadComments(postId);

}


/* =====================================================
   SEND TEXT MESSAGE
===================================================== */

async function sendTextMessage(){

  if(!currentUser){

    alert("Please login first.");

    return;
  }


  const input =
    document.getElementById(
      "chatInput"
    );


  if(!input){

    alert("Message box nahi mila.");

    return;
  }


  const text =
    input.value.trim();


  if(!text) return;


  let result =
    await supabaseClient
      .from("Messages")
      .insert({

        user_id:currentUser.id,
        username:currentUsername,
        content:text

      });


  /*
    Agar table lowercase messages ho
    to second attempt.
  */

  if(result.error){

    console.warn(
      "Messages table failed:",
      result.error.message
    );


    result =
      await supabaseClient
        .from("messages")
        .insert({

          user_id:currentUser.id,
          username:currentUsername,
          content:text

        });

  }


  if(result.error){

    console.error(
      "MESSAGE ERROR:",
      result.error
    );

    alert(
      "Message send nahi hua.\n\n" +
      result.error.message
    );

    return;
  }


  input.value = "";


  showNotice("Message sent.");

}


/* =====================================================
   LIKE
===================================================== */

async function toggleLike(postId){

async function toggleDislike(postId){

  const {
    error
  } =
  await supabaseClient

/* =====================================================
   DELETE POST
===================================================== */

async function deletePost(postId){

  if(!currentUser) return;


  const ok =
    confirm(
      "Delete this post?"
    );


  if(!ok) return;


  const {
    error
  } =
  await supabaseClient
    .from("posts")
    .delete()
    .eq("id",postId)
    .eq("user_id",currentUser.id);


  if(error){

    alert(
      "Post delete nahi hui.\n\n" +
      error.message
    );

    return;
  }


  const post =
    document.getElementById(
      "post-" + postId
    );


  if(post){

    post.remove();

  }

}


/* =====================================================
   BLOCK USER
===================================================== */

async function blockUser(userId){

  if(!currentUser) return;


  if(
    userId === currentUser.id
  ){

    return;
  }


  const ok =
    confirm(
      "Is user ko block karna hai?"
    );


  if(!ok) return;


  const {
    error
  } =
  await supabaseClient
    .from("user_blocks")
    .insert({

      blocker_id:currentUser.id,
      blocked_id:userId

    });


  if(error){

    if(error.code === "23505"){

      showNotice(
        "User already blocked."
      );

      return;
    }


    alert(
      "Block nahi hua.\n\n" +
      error.message
    );

    return;
  }


  showNotice("User blocked.");


  await loadPosts();

}

/* =====================================================
   VOICE
===================================================== */

async function toggleRecording(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "Voice recording browser mein available nahi."
    );

    return;
  }


  if(isRecording){

    if(mediaRecorder){

      mediaRecorder.stop();

    }

    return;
  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    audioChunks = [];


    mediaRecorder =
      new MediaRecorder(stream);


    mediaRecorder.ondataavailable =
      event => {

        if(event.data.size > 0){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        isRecording = false;


        const status =
          document.getElementById(
            "recordStatus"
          );


        const voiceBtn =
          document.getElementById(
            "voiceBtn"
          );


        if(status){

          status.style.display =
            "none";

        }


        if(voiceBtn){

          voiceBtn.textContent =
            "🎤 Voice";

        }


        showNotice(
          "Voice recording ready hai. Save karne ke liye Storage setup chahiye."
        );

      };


    mediaRecorder.start();


    isRecording = true;


    const status =
      document.getElementById(
        "recordStatus"
      );


    const voiceBtn =
      document.getElementById(
        "voiceBtn"
      );


    if(status){

      status.style.display =
        "block";

    }


    if(voiceBtn){

      voiceBtn.textContent =
        "⏹️ Stop";

    }

  }

  catch(error){

    console.error(
      "VOICE ERROR:",
      error
    );

    alert(
      "Microphone permission nahi mili."
    );

  }

}

/* =====================================================
   NOTICE
===================================================== */

function showNotice(message){

  const box =
    document.getElementById(
      "notice"
    );


  if(!box) return;


  box.textContent =
    message;


  box.style.display =
    "block";


  setTimeout(
    () => {

      box.style.display =
        "none";

    },
    2200
  );

}


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}


function formatDate(date){

  if(!date) return "";


  try{

    return new Date(date)
      .toLocaleString();

  }

  catch(error){

    return "";

  }

}
