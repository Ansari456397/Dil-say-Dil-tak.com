<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Socialyte</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-top:125px;
}

/* =========================
   HEADER
========================= */

.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:60px;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  box-shadow:0 2px 10px #0002;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

/* =========================
   TOP MESSAGE BOX
========================= */

.home-message-box{
  position:fixed;
  top:60px;
  left:0;
  width:100%;
  background:white;
  padding:10px;
  z-index:999;
  box-shadow:0 2px 10px #0002;
}

.message-title{
  font-weight:bold;
  color:#6c5ce7;
  margin-bottom:7px;
}

.message-row{
  display:flex;
  gap:6px;
}

#chatInput{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:20px;
  padding:11px 14px;
  outline:none;
  font-size:14px;
}

.chat-send{
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:20px;
  width:45px;
  font-size:20px;
  cursor:pointer;
}

.media-row{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.media-btn{
  border:0;
  background:#f0edff;
  color:#5d4bd6;
  padding:7px 12px;
  border-radius:15px;
  cursor:pointer;
  font-size:13px;
}

#recordStatus{
  display:none;
  color:#e74c3c;
  font-size:12px;
  margin-top:5px;
}

/* =========================
   MAIN
========================= */

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:10px;
}

/* =========================
   WELCOME
========================= */

.welcome{
  background:white;
  padding:15px;
  border-radius:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}

.welcome h3{
  margin:0 0 5px;
  color:#6c5ce7;
}

/* =========================
   SIX OPTIONS
========================= */

.quick-menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.menu-card{
  border:0;
  width:100%;
  background:white;
  border-radius:15px;
  padding:14px 10px;
  text-align:left;
  box-shadow:0 2px 8px #0001;
  cursor:pointer;
  transition:0.2s;
}

.menu-card:active{
  transform:scale(0.97);
}

.menu-icon{
  font-size:24px;
  display:block;
  margin-bottom:6px;
}

.menu-title{
  display:block;
  font-size:15px;
  font-weight:bold;
  color:#333;
}

.menu-subtitle{
  display:block;
  font-size:11px;
  color:#777;
  margin-top:3px;
}

/* Purple accent */

.menu-card:nth-child(1){
  border-left:4px solid #6c5ce7;
}

.menu-card:nth-child(2){
  border-left:4px solid #f1c40f;
}

.menu-card:nth-child(3){
  border-left:4px solid #ff7675;
}

.menu-card:nth-child(4){
  border-left:4px solid #3498db;
}

.menu-card:nth-child(5){
  border-left:4px solid #2ecc71;
}

.menu-card:nth-child(6){
  border-left:4px solid #9b59b6;
}

/* =========================
   SECTION TITLE
========================= */

.section-title{
  font-size:18px;
  font-weight:bold;
  color:#6c5ce7;
  margin:10px 3px;
}

/* =========================
   POSTS
========================= */

.post{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}

.post-user{
  font-weight:bold;
  color:#6c5ce7;
  margin-bottom:7px;
}

.post-text{
  white-space:pre-wrap;
  word-break:break-word;
}

.post-image{
  width:100%;
  max-width:500px;
  display:block;
  margin-top:10px;
  border-radius:12px;
}

.status{
  text-align:center;
  color:#777;
  font-size:13px;
  margin:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:400px){

  .menu-card{
    padding:12px 9px;
  }

  .menu-title{
    font-size:14px;
  }

  .menu-subtitle{
    font-size:10px;
  }

  .media-btn{
    padding:7px 9px;
    font-size:12px;
  }

}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div class="header">
  <div class="logo">Socialyte</div>
</div>


<!-- =========================
     TOP MESSAGE BOX
========================= -->

<div class="home-message-box">

  <div class="message-title">
    💬 Message
  </div>

  <div class="message-row">

    <input
      type="text"
      id="chatInput"
      placeholder="Write a message..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button
      class="chat-send"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

  <div class="media-row">

    <button
      class="media-btn"
      onclick="document.getElementById('imageInput').click()">
      🖼️ Upload Image
    </button>

    <button
      class="media-btn"
      onclick="toggleVoice()">
      🎤 Voice
    </button>

  </div>

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    style="display:none"
    onchange="sendImage()"
  >

  <div id="recordStatus">
    🎤 Listening... Tap Voice again to stop
  </div>

</div>


<!-- =========================
     MAIN CONTENT
========================= -->

<div class="container">


  <!-- WELCOME -->

  <div class="welcome">

    <h3>
      Welcome to Socialyte 💜
    </h3>

    <div id="userStatus">
      Checking login...
    </div>

  </div>


  <!-- =========================
       SIX OPTIONS
  ========================= -->

  <div class="quick-menu">


    <!-- PRIVATE CHAT -->

    <button
      class="menu-card"
      onclick="openPrivateChat()">

      <span class="menu-icon">
        💬
      </span>

      <span class="menu-title">
        Private Chat
      </span>

      <span class="menu-subtitle">
        Chat privately
      </span>

    </button>


    <!-- STARS -->

    <button
      class="menu-card"
      onclick="openStars()">

      <span class="menu-icon">
        ⭐
      </span>

      <span class="menu-title">
        Stars
      </span>

      <span class="menu-subtitle">
        Your stars
      </span>

    </button>


    <!-- TRENDING POSTS -->

    <button
      class="menu-card"
      onclick="openTrending()">

      <span class="menu-icon">
        🔥
      </span>

      <span class="menu-title">
        Trending Posts
      </span>

      <span class="menu-subtitle">
        Popular posts
      </span>

    </button>


    <!-- NOTIFICATIONS -->

    <button
      class="menu-card"
      onclick="openNotifications()">

      <span class="menu-icon">
        🔔
      </span>

      <span class="menu-title">
        Notifications
      </span>

      <span class="menu-subtitle">
        Your activity
      </span>

    </button>


    <!-- ONLINE USERS -->

    <button
      class="menu-card"
      onclick="openOnlineUsers()">

      <span class="menu-icon">
        👥
      </span>

      <span class="menu-title">
        Online Users
      </span>

      <span class="menu-subtitle">
        See who's online
      </span>

    </button>


    <!-- PROFILE -->

    <button
      class="menu-card"
      onclick="openProfile()">

      <span class="menu-icon">
        👤
      </span>

      <span class="menu-title">
        Profile
      </span>

      <span class="menu-subtitle">
        Your profile
      </span>

    </button>

  </div>


  <!-- =========================
       POSTS TITLE
  ========================= -->

  <div class="section-title">
    🔥 Trending Posts
  </div>


  <!-- =========================
       POSTS
  ========================= -->

  <div id="posts">

    <div class="status">
      Loading posts...
    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";




const SUPABASE_KEY =
"sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentUsername = "User";


/* =========================
   CHECK LOGIN
========================= */

async function startApp(){

  try{

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if(error){

      console.error(
        "Session error:",
        error
      );

      document.getElementById(
        "userStatus"
      ).textContent =
        "Login check failed.";

      return;
    }

    if(!data.session){

      window.location.href =
        "login.html";

      return;
    }

    currentUser =
      data.session.user;

    currentUsername =
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "User";

    document.getElementById(
      "userStatus"
    ).textContent =
      "Logged in as " +
      currentUsername;

    await loadPosts();

  }catch(err){

    console.error(
      "START ERROR:",
      err
    );

    document.getElementById(
      "userStatus"
    ).textContent =
      "Something went wrong.";

  }

}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const postsBox =
    document.getElementById("posts");

  postsBox.innerHTML =
    '<div class="status">Loading...</div>';

  const {
    data,
    error
  } = await supabaseClient
    .from("posts")
    .select("*")
    .order("id",{ascending:false});

  if(error){

    console.error(
      "POST ERROR:",
      error
    );

    postsBox.innerHTML =
      '<div class="status">Posts load nahi ho rahe.</div>';

    return;
  }

  postsBox.innerHTML = "";

  if(!data || data.length===0){

    postsBox.innerHTML =
      '<div class="status">Abhi koi post nahi hai.</div>';

    return;
  }

  data.forEach(function(post){

    const div =
      document.createElement("div");

    div.className =
      "post";


    const user =
      document.createElement("div");

    user.className =
      "post-user";

    user.textContent =
      post.username || "User";


    const text =
      document.createElement("div");

    text.className =
      "post-text";

    text.textContent =
      post.content || "";


    div.appendChild(user);

    if(post.content){

      div.appendChild(text);

    }


    if(post.image_url){

      const img =
        document.createElement("img");

      img.className =
        "post-image";

      img.src =
        post.image_url;

      img.alt =
        "Uploaded image";

      img.loading =
        "lazy";

      div.appendChild(img);

    }


    postsBox.appendChild(div);

  });

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const input =
    document.getElementById(
      "chatInput"
    );

  const text =
    input.value.trim();

  if(!text)
    return;

  if(!currentUser){

    alert(
      "Please login first."
    );

    return;
  }

  const {
    error
  } = await supabaseClient
    .from("posts")
    .insert({

      user_id:
        currentUser.id,

      username:
        currentUsername,

      content:
        text

    });

  if(error){

    console.error(
      "SEND ERROR:",
      error
    );

    alert(
      "Message send nahi hua.\n\n" +
      error.message
    );

    return;
  }

  input.value = "";

  await loadPosts();

}


/* =========================
   IMAGE UPLOAD
========================= */

async function sendImage(){

  const input =
    document.getElementById(
      "imageInput"
    );

  const file =
    input.files[0];

  if(!file)
    return;

  if(!currentUser){

    alert(
      "Please login first."
    );

    input.value = "";

    return;
  }

  try{

    if(
      file.size >
      50 * 1024 * 1024
    ){

      alert(
        "Image 50 MB se choti honi chahiye."
      );

      input.value = "";

      return;
    }

    const fileName =
      currentUser.id +
      "_" +
      Date.now() +
      "_" +
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );

    const {
      data:uploadData,
      error:uploadError
    } =
      await supabaseClient
        .storage
        .from("Image")
        .upload(
          fileName,
          file,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:file.type
          }
        );

    if(uploadError){

      console.error(
        "UPLOAD ERROR:",
        uploadError
      );

      alert(
        "Image upload nahi hui.\n\n" +
        uploadError.message
      );

      input.value = "";

      return;
    }

    const {
      data:urlData
    } =
      supabaseClient
        .storage
        .from("Image")
        .getPublicUrl(
          fileName
        );

    if(
      !urlData ||
      !urlData.publicUrl
    ){

      alert(
        "Image URL generate nahi ho saka."
      );

      input.value = "";

      return;
    }

    const imageUrl =
      urlData.publicUrl;

    const {
      error:postError
    } =
      await supabaseClient
        .from("posts")
        .insert({

          user_id:
            currentUser.id,

          username:
            currentUsername,

          content:
            "🖼️ Image",

          image_url:
            imageUrl

        });

    if(postError){

      console.error(
        "IMAGE POST ERROR:",
        postError
      );

      alert(
        "Image save nahi hui.\n\n" +
        postError.message
      );

      return;
    }

    input.value = "";

    await loadPosts();

    alert(
      "Image successfully uploaded ✅"
    );

  }catch(error){

    console.error(
      "IMAGE ERROR:",
      error
    );

    alert(
      "Image error:\n\n" +
      error.message
    );

    input.value = "";

  }

}


/* =========================
   VOICE TYPING
========================= */

let recognition = null;
let isRecording = false;


function toggleVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const status =
    document.getElementById(
      "recordStatus"
    );

  const input =
    document.getElementById(
      "chatInput"
    );

  if(!SpeechRecognition){

    alert(
      "Voice typing tumhare browser mein supported nahi hai."
    );

    return;
  }

  if(isRecording){

    recognition.stop();

    isRecording = false;

    status.style.display =
      "none";

    return;
  }

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "ur-PK";

  recognition.continuous =
    true;

  recognition.interimResults =
    false;

  recognition.onresult =
  function(event){

    let result = "";

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      if(
        event.results[i].isFinal
      ){

        result +=
          event.results[i][0]
            .transcript +
          " ";

      }

    }

    input.value += result;

  };

  recognition.onerror =
  function(){

    isRecording = false;

    status.style.display =
      "none";

  };

  recognition.onend =
  function(){

    isRecording = false;

    status.style.display =
      "none";

  };

  recognition.start();

  isRecording = true;

  status.style.display =
    "block";

}


/* =========================
   SIX MENU FUNCTIONS
========================= */

function openPrivateChat(){

  alert(
    "💬 Private Chat\n\nPrivate chat section yahan open hoga."
  );

}


function openStars(){

  alert(
    "⭐ Stars\n\nStars section yahan open hoga."
  );

}


function openTrending(){

  document.querySelector(
    ".section-title"
  ).scrollIntoView({
    behavior:"smooth"
  });

}


function openNotifications(){

  alert(
    "🔔 Notifications\n\nNotifications section yahan open hoga."
  );

}


function openOnlineUsers(){

  alert(
    "👥 Online Users\n\nOnline users section yahan open hoga."
  );

}


function openProfile(){

  alert(
    "👤 Profile\n\nProfile section yahan open hoga."
  );

}


/* =========================
   START APP
========================= */

startApp();

</script>

</body>
</html>
