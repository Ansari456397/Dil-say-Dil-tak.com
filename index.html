<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Socialyte</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6fa;
  color:#20242c;
  padding-bottom:80px;
}

header{
  background:#20242c;
  color:white;
  height:60px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#ff4f81;
}

.header-btns{
  display:flex;
  gap:8px;
}

.header-btns button{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#303641;
  color:white;
  font-size:17px;
}

/* PROFILE */
.profile{
  background:white;
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ff4f81;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:20px;
}

.name{
  font-weight:bold;
}

.online{
  color:#18a463;
  font-size:12px;
  margin-top:4px;
}

/* WRITE POST */
.write-card{
  background:white;
  margin:12px;
  padding:12px;
  border-radius:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.write-row{
  display:flex;
  gap:8px;
}

#postInput{
  flex:1;
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  outline:none;
}

#postBtn{
  border:0;
  background:#ff4f81;
  color:white;
  border-radius:14px;
  padding:0 18px;
  font-weight:bold;
}

/* POST ACTIONS */
.actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.action{
  flex:1;
  border:0;
  padding:10px 5px;
  border-radius:13px;
  background:#f1f2f5;
  font-size:12px;
}

.action:active{
  transform:scale(.96);
}

/* POSTS */
.posts{
  margin:12px;
}

.posts-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.post{
  background:white;
  padding:14px;
  border-radius:18px;
  margin-bottom:12px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ff4f81;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.post-name{
  font-weight:bold;
  font-size:14px;
}

.post-time{
  font-size:11px;
  color:#888;
  margin-top:3px;
}

.post-text{
  margin:13px 0;
  font-size:15px;
  line-height:1.5;
  word-break:break-word;
}

.post-actions{
  display:flex;
  gap:5px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.post-actions button{
  flex:1;
  border:0;
  background:#f4f5f7;
  border-radius:10px;
  padding:9px 3px;
  font-size:11px;
}

.post-actions button:active{
  transform:scale(.96);
}

.action-count{
  font-size:10px;
  color:#777;
  text-align:center;
  margin-top:7px;
}

/* MENU */
.menu{
  background:white;
  margin:12px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
  display:grid;
  grid-template-columns:1fr 1fr;
}

.menu button{
  border:0;
  background:white;
  padding:15px 10px;
  font-size:13px;
  text-align:left;
  border-bottom:1px solid #eee;
}

.menu button:hover{
  background:#f8f8f8;
}

/* CHAT */
.chat{
  background:white;
  margin:12px;
  border-radius:18px;
  overflow:hidden;
}

.chat-title{
  padding:15px;
  font-weight:bold;
  border-bottom:1px solid #eee;
}

#messages{
  max-height:45vh;
  overflow-y:auto;
  padding:15px;
}

.message-row{
  display:flex;
  margin-bottom:14px;
}

.mine{
  justify-content:flex-end;
}

.other{
  justify-content:flex-start;
}

.message{
  max-width:80%;
  padding:10px 13px;
  border-radius:16px;
}

.mine .message{
  background:#20242c;
  color:white;
  border-bottom-right-radius:4px;
}

.other .message{
  background:#f0f2f5;
  border-bottom-left-radius:4px;
}

.username{
  font-size:11px;
  font-weight:bold;
  opacity:.7;
  margin-bottom:4px;
}

.text{
  font-size:15px;
  word-break:break-word;
}

.time{
  font-size:9px;
  opacity:.55;
  text-align:right;
  margin-top:5px;
}

.reply{
  border:0;
  background:transparent;
  font-size:11px;
  margin-top:5px;
  opacity:.7;
}

/* ACTION NOTE */
.action-note{
  text-align:center;
  margin:8px 12px;
  padding:10px;
  border-radius:12px;
  background:white;
  font-size:13px;
  display:none;
}

/* STATUS */
#status{
  text-align:center;
  color:#777;
  font-size:11px;
  padding:7px;
}

/* BOTTOM */
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:10;
}

.bottom button{
  border:0;
  background:none;
  font-size:11px;
  color:#555;
}

.bottom div{
  font-size:20px;
  margin-bottom:3px;
}

.active{
  color:#ff4f81 !important;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <div class="logo">Socia<span>lyte</span></div>

  <div class="header-btns">
    <button>🔔</button>
    <button>⚙️</button>
  </div>
</header>

<!-- PROFILE -->
<div class="profile">

  <div class="avatar" id="avatar">U</div>

  <div>
    <div class="name" id="profileName">User</div>
    <div class="online">● Online</div>
  </div>

</div>

<!-- CREATE POST -->
<div class="write-card">

  <div class="write-row">

    <input
      id="postInput"
      type="text"
      placeholder="What's on your mind?"
    >

    <button id="postBtn">Post</button>

  </div>

  <div class="actions">

    <button class="action" onclick="showAction('🤗 Jhappi')">
      🤗<br>Jhappi
    </button>

    <button class="action" onclick="showAction('👋 Chupair')">
      👋<br>Chupair
    </button>

    <button class="action" onclick="showAction('❤️ Love')">
      ❤️<br>Love
    </button>

    <button class="action" onclick="showAction('😂 Haha')">
      😂<br>Haha
    </button>

  </div>

</div>

<div class="action-note" id="actionNote"></div>

<!-- MAIN OPTIONS -->
<div class="menu">

  <button>🏠 Home</button>
  <button>💬 Public Chat</button>

  <button>🔒 Private Chat</button>
  <button>🟢 Online Users</button>

  <button>👥 Members</button>
  <button>📝 Posts</button>

  <button>🔔 Notifications</button>
  <button>👤 My Profile</button>

  <button>⭐ Stars</button>
  <button>🔥 Trending Posts</button>

</div>

<!-- POSTS -->
<div class="posts">

  <div class="posts-title">
    📝 Socialyte Posts
  </div>

  <div id="postsList"></div>

  <div id="postStatus"></div>

</div>

<!-- PUBLIC CHAT -->
<div class="chat">

  <div class="chat-title">
    💬 Public Chat
  </div>

  <div id="messages"></div>

  <div id="status"></div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom">

  <button class="active">
    <div>🏠</div>
    Home
  </button>

  <button>
    <div>💬</div>
    Chat
  </button>

  <button>
    <div>🟢</div>
    Online
  </button>

  <button>
    <div>📝</div>
    Posts
  </button>

  <button>
    <div>👤</div>
    Profile
  </button>

</div>

<script>

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;

/* USER */
async function checkUser(){

  const {data,error} =
    await supabaseClient.auth.getUser();

  if(error || !data.user){

    window.location.href="login.html";
    return;
  }

  currentUser=data.user;

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email.split("@")[0];

  document.getElementById("profileName")
    .textContent=username;

  document.getElementById("avatar")
    .textContent=username.charAt(0).toUpperCase();

  loadMessages();
  loadPosts();
}

/* CREATE POST */
async function createPost(){

  const input =
    document.getElementById("postInput");

  const content =
    input.value.trim();

  if(!content || !currentUser){
    return;
  }

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email.split("@")[0];

  const {error} =
    await supabaseClient
    .from("posts")
    .insert({
      user_id:currentUser.id,
      username:username,
      content:content,
      post_type:"text"
    });

  if(error){

    document.getElementById("postStatus")
      .textContent=error.message;

    return;
  }

  input.value="";

  loadPosts();
}

/* LOAD POSTS */
async function loadPosts(){

  const {data,error} =
    await supabaseClient
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){

    document.getElementById("postStatus")
      .textContent=error.message;

    return;
  }

  const box =
    document.getElementById("postsList");

  box.innerHTML="";

  for(const post of data){

    const {data:actions} =
      await supabaseClient
      .from("post_actions")
      .select("action_type")
      .eq("post_id",post.id);

    const jhappiCount =
      actions?.filter(
        a => a.action_type==="jhappi"
      ).length || 0;

    const chupairCount =
      actions?.filter(
        a => a.action_type==="chupair"
      ).length || 0;

    const postDiv =
      document.createElement("div");

    postDiv.className="post";

    const head =
      document.createElement("div");

    head.className="post-head";

    const avatar =
      document.createElement("div");

    avatar.className="post-avatar";

    avatar.textContent =
      (post.username || "U")
      .charAt(0)
      .toUpperCase();

    const userInfo =
      document.createElement("div");

    const name =
      document.createElement("div");

    name.className="post-name";

    name.textContent =
      post.username || "User";

    const time =
      document.createElement("div");

    time.className="post-time";

    time.textContent =
      "🟢 " +
      new Date(post.created_at)
      .toLocaleString();

    userInfo.appendChild(name);
    userInfo.appendChild(time);

    head.appendChild(avatar);
    head.appendChild(userInfo);

    const text =
      document.createElement("div");

    text.className="post-text";

    text.textContent=post.content;

    const actionsDiv =
      document.createElement("div");

    actionsDiv.className="post-actions";

    const jhappiBtn =
      document.createElement("button");

    jhappiBtn.textContent =
      "🤗 Jhappi";

    jhappiBtn.onclick =
      () => togglePostAction(
        post.id,
        "jhappi"
      );

    const chupairBtn =
      document.createElement("button");

    chupairBtn.textContent =
      "👋 Chupair";

    chupairBtn.onclick =
      () => togglePostAction(
        post.id,
        "chupair"
      );

    const replyBtn =
      document.createElement("button");

    replyBtn.textContent =
      "↩️ Reply";

    replyBtn.onclick =
      () => replyToPost(
        post.username
      );

    actionsDiv.appendChild(jhappiBtn);
    actionsDiv.appendChild(chupairBtn);
    actionsDiv.appendChild(replyBtn);

    const count =
      document.createElement("div");

    count.className="action-count";

    count.textContent =
      "🤗 " + jhappiCount +
      "    👋 " + chupairCount;

    postDiv.appendChild(head);
    postDiv.appendChild(text);
    postDiv.appendChild(actionsDiv);
    postDiv.appendChild(count);

    box.appendChild(postDiv);
  }
}

/* POST ACTION */
async function togglePostAction(
  postId,
  actionType
){

  if(!currentUser)return;

  const {data:existing,error:findError} =
    await supabaseClient
    .from("post_actions")
    .select("id")
    .eq("post_id",postId)
    .eq("user_id",currentUser.id)
    .eq("action_type",actionType)
    .maybeSingle();

  if(findError){

    showAction(findError.message);
    return;
  }

  if(existing){

    await supabaseClient
      .from("post_actions")
      .delete()
      .eq("id",existing.id);

  }else{

    const {error} =
      await supabaseClient
      .from("post_actions")
      .insert({
        post_id:postId,
        user_id:currentUser.id,
        action_type:actionType
      });

    if(error){

      showAction(error.message);
      return;
    }
  }

  loadPosts();
}

/* REPLY */
function replyToPost(username){

  const input =
    document.getElementById("postInput");

  input.value =
    "@" + (username || "User") + " ";

  input.focus();
}

/* LOAD PUBLIC CHAT */
async function loadMessages(){

  const {data,error} =
    await supabaseClient
    .from("messages")
    .select("*")
    .order("created_at",{ascending:true});

  if(error){

    document.getElementById("status")
      .textContent=error.message;

    return;
  }

  const box =
    document.getElementById("messages");

  box.innerHTML="";

  data.forEach(msg=>{

    const row =
      document.createElement("div");

    const mine =
      msg.user_id===currentUser.id;

    row.className =
      "message-row " +
      (mine ? "mine":"other");

    const bubble =
      document.createElement("div");

    bubble.className="message";

    const username =
      document.createElement("div");

    username.className="username";

    username.textContent =
      msg.username || "User";

    const text =
      document.createElement("div");

    text.className="text";

    text.textContent=msg.message;

    const time =
      document.createElement("div");

    time.className="time";

    time.textContent =
      new Date(msg.created_at)
      .toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
      });

    const reply =
      document.createElement("button");

    reply.className="reply";

    reply.textContent="↩️ Reply";

    reply.onclick=function(){

      document.getElementById(
        "postInput"
      ).value =
        "@"+(msg.username || "User")+" ";

      document.getElementById(
        "postInput"
      ).focus();

    };

    bubble.appendChild(username);
    bubble.appendChild(text);
    bubble.appendChild(time);
    bubble.appendChild(reply);

    row.appendChild(bubble);
    box.appendChild(row);

  });

  box.scrollTop =
    box.scrollHeight;
}

/* SEND CHAT MESSAGE */
async function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if(!text || !currentUser)return;

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email.split("@")[0];

  const {error} =
    await supabaseClient
    .from("messages")
    .insert({
      user_id:currentUser.id,
      username:username,
      message:text
    });

  if(error){

    document.getElementById("status")
      .textContent=error.message;

    return;
  }

  input.value="";

  loadMessages();
}

/* ACTION NOTE */
function showAction(text){

  const box =
    document.getElementById("actionNote");

  box.textContent =
    text + " sent!";

  box.style.display="block";

  setTimeout(function(){

    box.style.display="none";

  },2000);
}

/* EVENTS */
document.getElementById("postBtn")
  .addEventListener(
    "click",
    createPost
  );

document.getElementById("postInput")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key==="Enter"){
        createPost();
      }

    }
  );

checkUser();

</script>

</body>
</html>
