<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Socialyte</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6fa;
  color:#20242c;
  padding-bottom:80px;
}

/* HEADER */

header{
  height:60px;
  background:#20242c;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.logo span{
  color:#ff4f81;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.header-buttons button{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#303641;
  color:white;
  font-size:17px;
}

/* PROFILE */

.profile{
  background:white;
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ff4f81;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
}

.profile-name{
  font-weight:bold;
  font-size:16px;
}

.online{
  color:#18a463;
  font-size:12px;
  margin-top:4px;
}

/* WRITE */

.write-card{
  background:white;
  margin:12px;
  padding:14px;
  border-radius:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.write-title{
  font-weight:bold;
  margin-bottom:10px;
}

.write-row{
  display:flex;
  gap:8px;
}

#postInput{
  flex:1;
  border:1px solid #ddd;
  border-radius:14px;
  padding:13px;
  font-size:15px;
  outline:none;
}

#postBtn{
  border:0;
  background:#ff4f81;
  color:white;
  border-radius:14px;
  padding:0 17px;
  font-weight:bold;
}

/* ACTIONS */

.actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.action{
  flex:1;
  border:0;
  background:#f1f2f5;
  border-radius:13px;
  padding:9px 3px;
  font-size:11px;
}

.action:active{
  transform:scale(.96);
}

/* MENU */

.menu{
  background:white;
  margin:12px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
  display:grid;
  grid-template-columns:1fr 1fr;
}

.menu button{
  border:0;
  background:white;
  padding:15px 10px;
  text-align:left;
  font-size:13px;
  border-bottom:1px solid #eee;
}

.menu button:hover{
  background:#f8f8f8;
}

/* POSTS */

.posts{
  margin:12px;
}

.post{
  background:white;
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;
}

.post-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#ff4f81;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.post-user{
  font-weight:bold;
  font-size:14px;
}

.post-time{
  font-size:10px;
  color:#888;
  margin-top:3px;
}

.post-content{
  margin:13px 0;
  font-size:15px;
  line-height:1.5;
  word-break:break-word;
}

.post-actions{
  display:flex;
  gap:5px;
  border-top:1px solid #eee;
  padding-top:10px;
  flex-wrap:wrap;
}

.post-action{
  flex:1;
  min-width:70px;
  border:0;
  background:#f5f6f8;
  border-radius:10px;
  padding:9px 3px;
  font-size:11px;
}

.post-action.active{
  background:#ffe6ef;
  color:#ff4f81;
  font-weight:bold;
}

/* CHAT */

.chat{
  background:white;
  margin:12px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.chat-title{
  padding:15px;
  font-weight:bold;
  border-bottom:1px solid #eee;
}

#messages{
  max-height:42vh;
  overflow-y:auto;
  padding:15px;
}

.message-row{
  display:flex;
  margin-bottom:13px;
}

.mine{
  justify-content:flex-end;
}

.other{
  justify-content:flex-start;
}

.message{
  max-width:80%;
  padding:10px 13px;
  border-radius:16px;
}

.mine .message{
  background:#20242c;
  color:white;
  border-bottom-right-radius:4px;
}

.other .message{
  background:#f0f2f5;
  border-bottom-left-radius:4px;
}

.username{
  font-size:11px;
  font-weight:bold;
  opacity:.7;
  margin-bottom:4px;
}

.text{
  font-size:15px;
  word-break:break-word;
}

.time{
  font-size:9px;
  opacity:.55;
  text-align:right;
  margin-top:5px;
}

.reply{
  border:0;
  background:transparent;
  font-size:11px;
  margin-top:5px;
  opacity:.7;
}

/* STATUS */

#status{
  text-align:center;
  color:#777;
  font-size:11px;
  padding:7px;
}

.action-note{
  display:none;
  margin:8px 12px;
  padding:10px;
  background:white;
  border-radius:12px;
  text-align:center;
  font-size:13px;
}

/* BOTTOM */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:10;
}

.bottom button{
  border:0;
  background:none;
  color:#555;
  font-size:10px;
}

.bottom-icon{
  font-size:20px;
  margin-bottom:3px;
}

.bottom .active{
  color:#ff4f81;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:25px;
  color:#888;
  font-size:13px;
}

</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="logo">
    Socia<span>lyte</span>
  </div>

  <div class="header-buttons">
    <button>🔔</button>
    <button>⚙️</button>
  </div>

</header>


<!-- PROFILE -->

<div class="profile">

  <div class="avatar" id="avatar">
    U
  </div>

  <div>
    <div class="profile-name" id="profileName">
      User
    </div>

    <div class="online">
      ● Online
    </div>
  </div>

</div>


<!-- WRITE POST -->

<div class="write-card">

  <div class="write-title">
    📝 Create a Post
  </div>

  <div class="write-row">

    <input
      id="postInput"
      type="text"
      placeholder="Write something..."
    >

    <button id="postBtn">
      Post
    </button>

  </div>

  <div class="actions">

    <button class="action"
      onclick="showAction('🤗 Jhappi')">
      🤗<br>Jhappi
    </button>

    <button class="action"
      onclick="showAction('👋 Chupair')">
      👋<br>Chupair
    </button>

    <button class="action"
      onclick="showAction('❤️ Love')">
      ❤️<br>Love
    </button>

    <button class="action"
      onclick="showAction('😂 Haha')">
      😂<br>Haha
    </button>

  </div>

</div>


<div id="actionNote" class="action-note"></div>


<!-- MENU -->

<div class="menu">

  <button>🏠 Home</button>

  <button>💬 Public Chat</button>

  <button>🔒 Private Chat</button>

  <button>🟢 Online Users</button>

  <button>👥 Members</button>

  <button>📝 Posts</button>

  <button>🔔 Notifications</button>

  <button>👤 My Profile</button>

  <button>⭐ Stars</button>

  <button>🔥 Trending Posts</button>

</div>


<!-- POSTS -->

<div class="posts">

  <div id="postsList">

    <div class="empty">
      Loading posts...
    </div>

  </div>

</div>


<!-- PUBLIC CHAT -->

<div class="chat">

  <div class="chat-title">
    💬 Public Chat
  </div>

  <div id="messages"></div>

  <div id="status"></div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom">

  <button class="active">
    <div class="bottom-icon">🏠</div>
    Home
  </button>

  <button>
    <div class="bottom-icon">💬</div>
    Chat
  </button>

  <button>
    <div class="bottom-icon">🟢</div>
    Online
  </button>

  <button>
    <div class="bottom-icon">📝</div>
    Posts
  </button>

  <button>
    <div class="bottom-icon">👤</div>
    Profile
  </button>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

/*
  IMPORTANT:
  Apni existing working Supabase Publishable Key
  yahan paste karein.
*/

const SUPABASE_KEY =
"sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;


/* CHECK USER */

async function checkUser(){

  const {data,error} =
    await supabaseClient.auth.getUser();

  if(error || !data.user){

    window.location.href="login.html";

    return;
  }

  currentUser = data.user;

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email.split("@")[0];

  document.getElementById("profileName")
    .textContent = username;

  document.getElementById("avatar")
    .textContent =
      username.charAt(0).toUpperCase();

  loadPosts();

  loadMessages();

}


/* CREATE POST */

async function createPost(){

  const input =
    document.getElementById("postInput");

  const content =
    input.value.trim();

  if(!content || !currentUser){
    return;
  }

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email.split("@")[0];

  const {error} =
    await supabaseClient
    .from("posts")
    .insert({

      user_id:currentUser.id,

      username:username,

      content:content

    });

  if(error){

    alert(error.message);

    return;
  }

  input.value="";

  loadPosts();

}


/* LOAD POSTS */

async function loadPosts(){

  const box =
    document.getElementById("postsList");

  /* GET BLOCKED USERS */

  const {data:blockedRows,error:blockError} =
    await supabaseClient
    .from("user_blocks")
    .select("blocked_id");

  if(blockError){

    box.innerHTML =
      `<div class="empty">
        ${escapeHtml(blockError.message)}
      </div>`;

    return;
  }

  const blockedIds =
    new Set(
      (blockedRows || [])
      .map(row => row.blocked_id)
    );


  /* GET POSTS */

  const {data,error} =
    await supabaseClient
    .from("posts")
    .select("*")
    .order("created_at",{
      ascending:false
    });

  if(error){

    box.innerHTML =
      `<div class="empty">
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  /* HIDE BLOCKED USERS */

  const visiblePosts =
    (data || []).filter(
      post => !blockedIds.has(post.user_id)
    );


  if(visiblePosts.length===0){

    box.innerHTML =
      `<div class="empty">
        No posts yet. Be the first to post! ✨
      </div>`;

    return;
  }


  box.innerHTML="";


  for(const post of visiblePosts){

    const article =
      document.createElement("div");

    article.className="post";


    const username =
      post.username || "User";


    const isMine =
      post.user_id === currentUser.id;


    /* DELETE / BLOCK BUTTON */

    const postOptions = isMine

      ? `
        <button
          class="post-action"
          onclick="deletePost(${post.id})"
        >
          🗑️ Delete
        </button>
      `

      : `
        <button
          class="post-action"
          onclick="blockUser('${post.user_id}')"
        >
          🚫 Block
        </button>
      `;


    const time =
      new Date(post.created_at)
      .toLocaleString([],{

        day:"2-digit",
        month:"short",
        hour:"2-digit",
        minute:"2-digit"

      });


    article.innerHTML = `

      <div class="post-head">

        <div class="post-avatar">
          ${escapeHtml(
            username.charAt(0).toUpperCase()
          )}
        </div>

        <div>

          <div class="post-user">
            ${escapeHtml(username)}
          </div>

          <div class="post-time">
            ● Active · ${time}
          </div>

        </div>

      </div>


      <div class="post-content">
        ${escapeHtml(post.content)}
      </div>


      <div
        class="post-actions"
        id="actions-${post.id}"
      >

        <button
          class="post-action"
          onclick="
            togglePostAction(
              ${post.id},
              'jhappi'
            )
          "
        >
          🤗 Jhappi
          <span id="jhappi-${post.id}">
            0
          </span>
        </button>


        <button
          class="post-action"
          onclick="
            togglePostAction(
              ${post.id},
              'chupair'
            )
          "
        >
          👋 Chupair
          <span id="chupair-${post.id}">
            0
          </span>
        </button>


        <button
          class="post-action"
          onclick="
            replyToPost(
              '${escapeAttribute(username)}'
            )
          "
        >
          ↩️ Reply
        </button>


        ${postOptions}

      </div>

    `;


    box.appendChild(article);

    loadPostActions(post.id);

  }

}


/* DELETE POST */

async function deletePost(postId){

  if(!currentUser){
    return;
  }


  const confirmDelete =
    confirm("Delete this post?");


  if(!confirmDelete){
    return;
  }


  const {error} =
    await supabaseClient
    .from("posts")
    .delete()
    .eq("id",postId)
    .eq("user_id",currentUser.id);


  if(error){

    alert(error.message);

    return;
  }


  loadPosts();

}


/* BLOCK USER */

async function blockUser(userId){

  if(
    !currentUser ||
    userId === currentUser.id
  ){

    return;
  }


  const confirmBlock =
    confirm("Block this user?");


  if(!confirmBlock){
    return;
  }


  const {error} =
    await supabaseClient
    .from("user_blocks")
    .insert({

      blocker_id:currentUser.id,

      blocked_id:userId

    });


  if(error){

    if(error.code === "23505"){

      alert(
        "This user is already blocked."
      );

    }else{

      alert(error.message);

    }

    return;
  }


  alert(
    "User blocked successfully."
  );


  loadPosts();

}


/* LOAD ACTION COUNTS */

async function loadPostActions(postId){

  const {data,error} =
    await supabaseClient
    .from("post_actions")
    .select(
      "user_id,action_type"
    )
    .eq("post_id",postId);


  if(error){
    return;
  }


  let jhappiCount=0;

  let chupairCount=0;

  let myJhappi=false;

  let myChupair=false;


  data.forEach(action=>{

    if(
      action.action_type ===
      "jhappi"
    ){

      jhappiCount++;

      if(
        action.user_id ===
        currentUser.id
      ){

        myJhappi=true;

      }

    }


    if(
      action.action_type ===
      "chupair"
    ){

      chupairCount++;

      if(
        action.user_id ===
        currentUser.id
      ){

        myChupair=true;

      }

    }

  });


  const jhappi =
    document.getElementById(
      "jhappi-"+postId
    );


  const chupair =
    document.getElementById(
      "chupair-"+postId
    );


  if(jhappi){

    jhappi.textContent =
      jhappiCount;

  }


  if(chupair){

    chupair.textContent =
      chupairCount;

  }


  const buttons =
    document.querySelectorAll(
      `#actions-${postId} .post-action`
    );


  if(buttons.length >= 2){

    if(myJhappi){

      buttons[0]
        .classList
        .add("active");

    }


    if(myChupair){

      buttons[1]
        .classList
        .add("active");

    }

  }

}


/* TOGGLE ACTION */

async function togglePostAction(
  postId,
  actionType
){

  if(!currentUser){
    return;
  }


  const {data,error} =
    await supabaseClient
    .from("post_actions")
    .select("id")
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    )
    .eq(
      "action_type",
      actionType
    )
    .maybeSingle();


  if(error){

    alert(error.message);

    return;
  }


  if(data){

    await supabaseClient
      .from("post_actions")
      .delete()
      .eq("id",data.id);

  }else{

    const {error:insertError} =
      await supabaseClient
      .from("post_actions")
      .insert({

        post_id:postId,

        user_id:currentUser.id,

        action_type:actionType

      });


    if(insertError){

      alert(
        insertError.message
      );

      return;
    }

  }


  loadPosts();

}


/* REPLY */

function replyToPost(username){

  const input =
    document.getElementById(
      "postInput"
    );


  input.value =
    "@"+username+" ";


  input.focus();


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* PUBLIC CHAT */

async function loadMessages(){

  const {data,error} =
    await supabaseClient
    .from("messages")
    .select("*")
    .order("created_at",{

      ascending:true

    });


  if(error){

    document.getElementById(
      "status"
    ).textContent =
      error.message;

    return;
  }


  const box =
    document.getElementById(
      "messages"
    );


  box.innerHTML="";


  data.forEach(msg=>{

    const row =
      document.createElement(
        "div"
      );


    const mine =
      msg.user_id ===
      currentUser.id;


    row.className =
      "message-row "+
      (
        mine
          ? "mine"
          : "other"
      );


    const bubble =
      document.createElement(
        "div"
      );


    bubble.className =
      "message";


    const username =
      document.createElement(
        "div"
      );


    username.className =
      "username";


    username.textContent =
      msg.username ||
      "User";


    const text =
      document.createElement(
        "div"
      );


    text.className =
      "text";


    text.textContent =
      msg.message;


    const time =
      document.createElement(
        "div"
      );


    time.className =
      "time";


    time.textContent =
      new Date(
        msg.created_at
      ).toLocaleTimeString(
        [],
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );


    const reply =
      document.createElement(
        "button"
      );


    reply.className =
      "reply";


    reply.textContent =
      "↩️ Reply";


    reply.onclick=function(){

      document.getElementById(
        "postInput"
      ).value =
        "@"+
        (
          msg.username ||
          "User"
        )+
        " ";


      document.getElementById(
        "postInput"
      ).focus();

    };


    bubble.appendChild(
      username
    );

    bubble.appendChild(
      text
    );

    bubble.appendChild(
      time
    );

    bubble.appendChild(
      reply
    );

    row.appendChild(
      bubble
    );

    box.appendChild(
      row
    );

  });


  box.scrollTop =
    box.scrollHeight;

}


/* SEND CHAT */

async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );


  if(!input){
    return;
  }

}


/* TOP ACTION MESSAGE */

function showAction(text){

  const box =
    document.getElementById(
      "actionNote"
    );


  box.textContent =
    text+" selected";


  box.style.display =
    "block";


  setTimeout(function(){

    box.style.display =
      "none";

  },1500);

}


/* HTML SAFETY */

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


function escapeAttribute(text){

  return String(text)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}


/* POST BUTTON */

document.getElementById(
  "postBtn"
).addEventListener(
  "click",
  createPost
);


/* ENTER */

document.getElementById(
  "postInput"
).addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      createPost();

    }

  }
);


/* START */

checkUser();

</script>

</body>
</html>
