
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Socialyte</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f9;
  color:#20242c;
  padding-bottom:75px;
}

/* HEADER */
header{
  height:60px;
  background:#20242c;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logo span{
  color:#ff4f81;
}

.header-icons{
  display:flex;
  gap:8px;
}

.header-icons button{
  border:0;
  background:#303641;
  color:white;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:17px;
}

/* PROFILE */
.profile-card{
  background:white;
  padding:16px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #eee;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:50%;
  background:#ff4f81;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:bold;
}

.profile-name{
  font-size:17px;
  font-weight:bold;
}

.status{
  color:#19a463;
  font-size:12px;
  margin-top:4px;
}

/* MENU */
.menu{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:12px;
  background:white;
}

.menu button{
  border:0;
  background:#f0f2f5;
  padding:10px 14px;
  border-radius:20px;
  white-space:nowrap;
  font-size:13px;
}

/* CHAT */
.chat-card{
  margin:12px;
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.chat-title{
  padding:15px;
  font-weight:bold;
  border-bottom:1px solid #eee;
}

#messages{
  min-height:48vh;
  max-height:55vh;
  overflow-y:auto;
  padding:15px;
}

.message-row{
  display:flex;
  margin-bottom:15px;
}

.mine{
  justify-content:flex-end;
}

.other{
  justify-content:flex-start;
}

.message{
  max-width:80%;
  padding:10px 13px;
  border-radius:16px;
}

.mine .message{
  background:#20242c;
  color:white;
  border-bottom-right-radius:4px;
}

.other .message{
  background:#f0f2f5;
  border-bottom-left-radius:4px;
}

.username{
  font-size:11px;
  font-weight:bold;
  margin-bottom:4px;
  opacity:.7;
}

.message-text{
  font-size:15px;
  word-break:break-word;
}

.time{
  font-size:9px;
  opacity:.55;
  text-align:right;
  margin-top:5px;
}

/* REPLY */
.reply-btn{
  border:0;
  background:transparent;
  font-size:11px;
  margin-top:6px;
  opacity:.7;
}

.reply-box{
  display:none;
  background:#f8f8f8;
  padding:8px 12px;
  border-top:1px solid #eee;
  font-size:12px;
}

.reply-box.active{
  display:block;
}

#replyText{
  font-weight:bold;
}

/* REACTIONS */
.reactions{
  display:flex;
  gap:7px;
  padding:10px 12px;
  border-top:1px solid #eee;
  overflow-x:auto;
}

.reactions button{
  border:0;
  background:#f0f2f5;
  padding:8px 12px;
  border-radius:18px;
  white-space:nowrap;
}

/* INPUT */
.send-area{
  padding:10px 12px 14px;
  display:flex;
  gap:8px;
}

#messageInput{
  flex:1;
  border:1px solid #ddd;
  border-radius:13px;
  padding:13px;
  outline:none;
  font-size:15px;
}

#sendBtn{
  border:0;
  background:#ff4f81;
  color:white;
  border-radius:13px;
  padding:0 17px;
  font-weight:bold;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:30;
}

.bottom-nav button{
  border:0;
  background:none;
  font-size:11px;
  color:#555;
}

.bottom-nav button div{
  font-size:20px;
  margin-bottom:3px;
}

.bottom-nav .active{
  color:#ff4f81;
  font-weight:bold;
}

#status{
  text-align:center;
  font-size:11px;
  color:#777;
  padding:5px;
}
</style>
</head>

<body>

<header>
  <div class="logo">Socia<span>lyte</span></div>

  <div class="header-icons">
    <button>🔔</button>
    <button>⚙️</button>
  </div>
</header>

<div class="profile-card">

  <div class="avatar" id="avatar">U</div>

  <div>
    <div class="profile-name" id="profileName">User</div>
    <div class="status">● Online</div>
  </div>

</div>

<div class="menu">

  <button>🏠 Home</button>
  <button>💬 Chat</button>
  <button>🟢 Online</button>
  <button>👥 Members</button>
  <button>📝 Posts</button>

</div>

<div class="chat-card">

  <div class="chat-title">
    💬 Public Chat
  </div>

  <div id="messages"></div>

  <div class="reply-box" id="replyBox">
    Replying to: <span id="replyText"></span>
  </div>

  <div class="reactions">

    <button onclick="sendFun('🤗 Jhappi')">🤗 Jhappi</button>
    <button onclick="sendFun('😘 Chupair')">😘 Chupair</button>
    <button onclick="sendFun('❤️ Love')">❤️ Love</button>
    <button onclick="sendFun('😂 Haha')">😂 Haha</button>

  </div>

  <div class="send-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Write a message..."
    >

    <button id="sendBtn">Send</button>

  </div>

  <div id="status"></div>

</div>

<div class="bottom-nav">

  <button class="active">
    <div>🏠</div>
    Home
  </button>

  <button>
    <div>💬</div>
    Chat
  </button>

  <button>
    <div>🟢</div>
    Online
  </button>

  <button>
    <div>📝</div>
    Posts
  </button>

  <button>
    <div>👤</div>
    Profile
  </button>

</div>

<script>

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
""sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser=null;

async function checkUser(){

  const {data,error} =
    await supabaseClient.auth.getUser();

  if(error || !data.user){

    window.location.href="login.html";
    return;
  }

  currentUser=data.user;

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email.split("@")[0];

  document.getElementById("profileName")
    .textContent=username;

  document.getElementById("avatar")
    .textContent=username
    .charAt(0)
    .toUpperCase();

  loadMessages();
}

async function loadMessages(){

  const {data,error} =
    await supabaseClient
    .from("messages")
    .select("*")
    .order("created_at",{ascending:true});

  if(error){

    document.getElementById("status")
      .textContent=error.message;

    return;
  }

  const box=document.getElementById("messages");

  box.innerHTML="";

  data.forEach(msg=>{

    const row=document.createElement("div");

    const mine =
      msg.user_id===currentUser.id;

    row.className =
      "message-row "+
      (mine ? "mine":"other");

    const message=document.createElement("div");

    message.className="message";

    const username=document.createElement("div");

    username.className="username";

    username.textContent=
      msg.username || "User";

    const text=document.createElement("div");

    text.className="message-text";

    text.textContent=msg.message;

    const time=document.createElement("div");

    time.className="time";

    time.textContent=
      new Date(msg.created_at)
      .toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
      });

    const reply=document.createElement("button");

    reply.className="reply-btn";

    reply.textContent="↩️ Reply";

    reply.onclick=function(){

      document.getElementById("replyBox")
        .classList.add("active");

      document.getElementById("replyText")
        .textContent=
        (msg.username || "User")+
        ": "+
        msg.message;

      document.getElementById("messageInput")
        .focus();

    };

    message.appendChild(username);
    message.appendChild(text);
    message.appendChild(time);
    message.appendChild(reply);

    row.appendChild(message);

    box.appendChild(row);

  });

  box.scrollTop=box.scrollHeight;
}

async function sendMessage(){

  const input=
    document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text || !currentUser)return;

  const username=
    currentUser.user_metadata?.username ||
    currentUser.email.split("@")[0];

  const {error}=
    await supabaseClient
    .from("messages")
    .insert({
      user_id:currentUser.id,
      username:username,
      message:text
    });

  if(error){

    document.getElementById("status")
      .textContent=error.message;

    return;
  }

  input.value="";

  document.getElementById("replyBox")
    .classList.remove("active");

  loadMessages();
}

function sendFun(text){

  document.getElementById("messageInput")
    .value=text;

  sendMessage();
}

document.getElementById("sendBtn")
  .addEventListener("click",sendMessage);

document.getElementById("messageInput")
  .addEventListener("keydown",function(e){

    if(e.key==="Enter"){
      sendMessage();
    }

  });

checkUser();

</script>

</body>
</html>
