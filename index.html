
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socialyte</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-bottom:75px;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:18px 15px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:50;
}

.logo{
  font-size:27px;
  font-weight:bold;
}

.logo span{
  opacity:.85;
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:12px;
}

/* PROFILE */
.profile-card{
  background:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.profile-name{
  font-size:19px;
  font-weight:bold;
}

.online{
  color:#16a085;
  font-size:13px;
  margin-top:4px;
}

/* TOP MESSAGE */
.home-message-box{
  background:white;
  border-radius:15px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.message-title{
  font-weight:bold;
  margin-bottom:8px;
}

.message-row{
  display:flex;
  gap:7px;
}

#chatInput{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:22px;
  padding:11px 14px;
  outline:none;
}

.chat-send{
  width:45px;
  border:0;
  border-radius:50%;
  background:#6c5ce7;
  color:white;
  font-size:19px;
}

.message-tools{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.message-tools button{
  flex:1;
  border:0;
  border-radius:10px;
  padding:9px 5px;
  background:#f0eefc;
  cursor:pointer;
}

.record-status{
  font-size:12px;
  color:#e74c3c;
  margin-top:5px;
  display:none;
}

/* POST BOX */
.post-box{
  background:white;
  border-radius:15px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.post-box textarea{
  width:100%;
  min-height:75px;
  resize:none;
  border:1px solid #ddd;
  border-radius:12px;
  padding:11px;
  outline:none;
}

.post-btn{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#6c5ce7;
  color:white;
  font-weight:bold;
}

/* SECTION */
.section-title{
  font-size:20px;
  font-weight:bold;
  margin:15px 3px 10px;
}

/* POST */
.post{
  background:white;
  border-radius:15px;
  padding:13px;
  margin-bottom:13px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.post-user{
  font-weight:bold;
  color:#6c5ce7;
}

.post-time{
  font-size:11px;
  color:#888;
  margin-top:3px;
}

.post-content{
  margin:12px 0;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.post-actions button,
.comment-btn{
  border:0;
  background:#f1f1f5;
  padding:8px 10px;
  border-radius:9px;
  cursor:pointer;
}

.delete-btn{
  background:#ffe8e8!important;
  color:#c0392b;
}

.block-btn{
  background:#fff3df!important;
  color:#b9770e;
}

/* COMMENTS */
.comments-area{
  margin-top:12px;
  border-top:1px solid #eee;
  padding-top:10px;
  display:none;
}

.comment{
  background:#f7f7fb;
  border-radius:10px;
  padding:9px;
  margin:7px 0;
}

.comment-user{
  font-weight:bold;
  font-size:14px;
  color:#6c5ce7;
}

.comment-text{
  margin-top:4px;
  word-break:break-word;
}

.reply-btn{
  border:0;
  background:transparent;
  color:#6c5ce7;
  font-size:12px;
  padding:5px 0;
}

.comment-input-row{
  display:flex;
  gap:6px;
  margin-top:9px;
}

.comment-input-row input{
  flex:1;
  border:1px solid #ddd;
  border-radius:20px;
  padding:9px 12px;
  outline:none;
}

.comment-input-row button{
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:20px;
  padding:0 14px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:center;
  z-index:100;
  box-shadow:0 -3px 12px rgba(0,0,0,.08);
}

.bottom-nav button{
  flex:1;
  max-width:130px;
  border:0;
  background:white;
  font-size:12px;
  cursor:pointer;
}

.bottom-nav button div{
  font-size:21px;
  margin-bottom:2px;
}

.hidden{
  display:none!important;
}

.empty{
  text-align:center;
  color:#888;
  padding:20px;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Socia<span>lyte</span></div>
</header>

<main class="container">

  <!-- PROFILE -->
  <div class="profile-card">
    <div class="profile-name" id="profileName">Loading...</div>
    <div class="online">● Online</div>
  </div>

  <!-- TOP MESSAGE BOX -->
  <div class="home-message-box">

    <div class="message-title">💬 Message</div>

    <div id="replyPreview"
         style="display:none;background:#f1eefc;padding:7px 10px;border-radius:9px;margin-bottom:7px;font-size:13px;">
      Replying to <b id="replyUsername"></b>
      <button onclick="cancelReply()"
              style="float:right;border:0;background:none;">✕</button>
    </div>

    <div class="message-row">
      <input
        id="chatInput"
        type="text"
        placeholder="Write a message..."
        onkeydown="if(event.key==='Enter') sendTextMessage()">

      <button class="chat-send" onclick="sendTextMessage()">➤</button>
    </div>

    <div class="message-tools">
      <button onclick="document.getElementById('imageInput').click()">
        🖼️ Upload Image
      </button>

      <button id="voiceBtn" onclick="toggleRecording()">
        🎤 Voice
      </button>
    </div>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      style="display:none"
      onchange="sendImage()">

    <div id="recordStatus" class="record-status">
      Recording... Tap 🎤 again to stop
    </div>

  </div>

  <!-- POST BOX -->
  <div class="post-box">

    <textarea
      id="postInput"
      placeholder="Write a post..."></textarea>

    <button class="post-btn" onclick="createPost()">
      📝 Post
    </button>

  </div>

  <div class="section-title">🔥 Trending Posts</div>

  <div id="posts">
    <div class="empty">Loading posts...</div>
  </div>

</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button onclick="goHome()">
    <div>🏠</div>
    Home
  </button>

  <button onclick="openPrivate()">
    <div>💬</div>
    Private
  </button>

  <button onclick="openProfile()">
    <div>👤</div>
    Profile
  </button>

  <button onclick="openNotifications()">
    <div>🔔</div>
    Notifications
  </button>

  <button onclick="openMore()">
    <div>☰</div>
    More
  </button>

</nav>

<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL = "https://szmauhxiyjffjhrcruee.supabase.co";



const SUPABASE_KEY = "sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


/* ================= VARIABLES ================= */

let currentUser = null;
let currentUsername = "User";

let replyToUser = "";
let replyToUserId = null;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;


/* ================= CHECK USER ================= */

async function checkUser(){

  const {
    data:{user},
    error
  } = await supabaseClient.auth.getUser();

  if(error || !user){
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  currentUsername =
    user.user_metadata?.username ||
    user.email?.split("@")[0] ||
    "User";

  document.getElementById("profileName").textContent =
    currentUsername;

  await loadPosts();
}

checkUser();


/* ================= LOAD POSTS ================= */

async function loadPosts(){

  const box = document.getElementById("posts");

  const { data:blockedRows } =
    await supabaseClient
      .from("user_blocks")
      .select("blocked_id")
      .eq("blocker_id", currentUser.id);

  const blockedIds =
    (blockedRows || []).map(x => x.blocked_id);

  const { data, error } =
    await supabaseClient
      .from("posts")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    box.innerHTML =
      `<div class="empty">Posts load nahi ho sake.</div>`;

    return;
  }

  const posts =
    (data || []).filter(
      p => !blockedIds.includes(p.user_id)
    );

  if(!posts.length){

    box.innerHTML =
      `<div class="empty">Abhi koi post nahi hai.</div>`;

    return;
  }

  box.innerHTML = posts.map(post => `

    <div class="post">

      <div class="post-user">
        @${escapeHtml(post.username || "User")}
      </div>

      <div class="post-time">
        ${formatDate(post.created_at)}
      </div>

      <div class="post-content">
        ${escapeHtml(post.content || "")}
      </div>

      <div class="post-actions">

        <button onclick="toggleAction('${post.id}','jhappi')">
          🤗 Jhappi
        </button>

        <button onclick="toggleAction('${post.id}','chupair')">
          👋 Chupair
        </button>

        <button onclick="showNotice('Love')">
          ❤️ Love
        </button>

        <button onclick="showNotice('Haha')">
          😂 Haha
        </button>

        <button class="comment-btn"
                onclick="toggleComments('${post.id}')">
          💬 Comments
        </button>

        ${
          post.user_id === currentUser.id
          ?
          `<button class="delete-btn"
             onclick="deletePost('${post.id}')">
             🗑️ Delete
           </button>`
          :
          `<button class="block-btn"
             onclick="blockUser('${post.user_id}')">
             🚫 Block
           </button>`
        }

      </div>

      <div id="comments-${post.id}"
           class="comments-area">

        <div id="comment-list-${post.id}">
          Loading comments...
        </div>

        <div class="comment-input-row">

          <input
            id="comment-input-${post.id}"
            placeholder="Write a comment..."
            onkeydown="if(event.key==='Enter') addComment('${post.id}')">

          <button onclick="addComment('${post.id}')">
            ➤
          </button>

        </div>

      </div>

    </div>

  `).join("");

}


/* ================= ADD COMMENT ================= */

async function addComment(postId){

  if(!currentUser){
    alert("Please login first.");
    return;
  }

  const input =
    document.getElementById("comment-input-" + postId);

  if(!input){
    alert("Comment box nahi mila.");
    return;
  }

  const text = input.value.trim();

  if(!text){
    return;
  }

  const { error } =
    await supabaseClient
      .from("comments")
      .insert({
        post_id: postId,
        user_id: currentUser.id,
        username: currentUsername,
        content: text
      });

  if(error){

    console.error("COMMENT SAVE ERROR:",error);

    alert(
      "Comment save nahi hua.\n\n" +
      error.message
    );

    return;
  }

  input.value = "";

  await loadComments(postId);

}


/* ================= LOAD COMMENTS ================= */

async function loadComments(postId){

  const box =
    document.getElementById("comment-list-" + postId);

  if(!box) return;

  const { data, error } =
    await supabaseClient
      .from("comments")
      .select("*")
      .eq("post_id",postId)
      .order("created_at",{ascending:true});

  if(error){

    console.error("COMMENT LOAD ERROR:",error);

    box.innerHTML =
      `<div class="empty">Comments load nahi hue.</div>`;

    return;
  }

  if(!data || !data.length){

    box.innerHTML =
      `<div class="empty">No comments yet.</div>`;

    return;
  }

  box.innerHTML = data.map(comment => `

    <div class="comment">

      <div class="comment-user">
        @${escapeHtml(comment.username || "User")}
      </div>

      <div class="comment-text">
        ${escapeHtml(comment.content || "")}
      </div>

      <button
        class="reply-btn"
        onclick="replyTo('${escapeAttr(comment.username || "User")}')">
        ↩️ Reply
      </button>

    </div>

  `).join("");

}


/* ================= TOGGLE COMMENTS ================= */

async function toggleComments(postId){

  const area =
    document.getElementById("comments-" + postId);

  if(!area) return;

  if(area.style.display === "block"){

    area.style.display = "none";

  }else{

    area.style.display = "block";

    await loadComments(postId);
  }

}


/* ================= REPLY ================= */

function replyTo(username){

  replyToUser = username;

  document.getElementById("replyUsername").textContent =
    "@" + username;

  document.getElementById("replyPreview").style.display =
    "block";

  const input =
    document.getElementById("chatInput");

  input.value =
    "@" + username + " ";

  input.focus();

}


function cancelReply(){

  replyToUser = "";

  replyToUserId = null;

  document.getElementById("replyPreview").style.display =
    "none";

  document.getElementById("chatInput").value = "";

}


/* ================= CREATE POST ================= */

async function createPost(){

  if(!currentUser){
    alert("Please login first.");
    return;
  }

  const input =
    document.getElementById("postInput");

  const content =
    input.value.trim();

  if(!content) return;

  const {error} =
    await supabaseClient
      .from("posts")
      .insert({
        user_id: currentUser.id,
        username: currentUsername,
        content: content
      });

  if(error){

    console.error(error);

    alert(
      "Post save nahi hua.\n\n" +
      error.message
    );

    return;
  }

  input.value = "";

  await loadPosts();

}


/* ================= DELETE POST ================= */

async function deletePost(postId){

  if(!confirm("Kya aap ye post delete karna chahte hain?")){
    return;
  }

  const {error} =
    await supabaseClient
      .from("posts")
      .delete()
      .eq("id",postId)
      .eq("user_id",currentUser.id);

  if(error){

    alert(
      "Post delete nahi hua.\n\n" +
      error.message
    );

    return;
  }

  await loadPosts();

}


/* ================= BLOCK USER ================= */

async function blockUser(userId){

  if(!currentUser) return;

  if(userId === currentUser.id) return;

  const {error} =
    await supabaseClient
      .from("user_blocks")
      .insert({
        blocker_id: currentUser.id,
        blocked_id: userId
      });

  if(error){

    if(error.code === "23505"){

      alert("Ye user already blocked hai.");

    }else{

      alert(
        "User block nahi hua.\n\n" +
        error.message
      );
    }

    return;
  }

  alert("User blocked.");

  await loadPosts();

}


/* ================= POST ACTION ================= */

async function toggleAction(postId,actionType){

  if(!currentUser) return;

  const {data:existing,error:findError} =
    await supabaseClient
      .from("post_actions")
      .select("id")
      .eq("post_id",postId)
      .eq("user_id",currentUser.id)
      .eq("action_type",actionType)
      .maybeSingle();

  if(findError){

    console.error(findError);

    return;
  }

  if(existing){

    await supabaseClient
      .from("post_actions")
      .delete()
      .eq("id",existing.id);

  }else{

    const {error} =
      await supabaseClient
        .from("post_actions")
        .insert({
          post_id:postId,
          user_id:currentUser.id,
          action_type:actionType
        });

    if(error){

      console.error(error);

      alert(error.message);

      return;
    }
  }

}


/* ================= MESSAGE ================= */

async function sendTextMessage(){

  if(!currentUser){
    alert("Please login first.");
    return;
  }

  const input =
    document.getElementById("chatInput");

  let text =
    input.value.trim();

  if(!text) return;

  const {error} =
    await supabaseClient
      .from("messages")
      .insert({
        user_id:currentUser.id,
        username:currentUsername,
        content:text
      });

  if(error){

    console.error("MESSAGE ERROR:",error);

    alert(
      "Message send nahi hua.\n\n" +
      error.message
    );

    return;
  }

  input.value = "";

  cancelReply();

}


/* ================= IMAGE ================= */

async function sendImage(){

  const file =
    document.getElementById("imageInput").files[0];

  if(!file || !currentUser) return;

  alert(
    "Image upload ke liye Supabase Storage bucket required hai. " +
    "Pehle storage bucket configure karna hoga."
  );

}


/* ================= VOICE ================= */

async function toggleRecording(){

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getUserMedia){

    alert("Voice recording browser mein supported nahi hai.");
    return;
  }

  if(isRecording){

    mediaRecorder.stop();

    isRecording = false;

    document.getElementById("recordStatus").style.display =
      "none";

    document.getElementById("voiceBtn").textContent =
      "🎤 Voice";

    return;
  }

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    audioChunks = [];

    mediaRecorder =
      new MediaRecorder(stream);

    mediaRecorder.ondataavailable =
      event => {

        if(event.data.size > 0){
          audioChunks.push(event.data);
        }

      };

    mediaRecorder.onstop =
      () => {

        stream.getTracks().forEach(
          track => track.stop()
        );

        alert(
          "Voice recording ready hai. " +
          "Storage setup ke baad ise messages mein save kiya ja sakta hai."
        );

      };

    mediaRecorder.start();

    isRecording = true;

    document.getElementById("recordStatus").style.display =
      "block";

    document.getElementById("voiceBtn").textContent =
      "⏹️ Stop";

  }catch(error){

    console.error(error);

    alert(
      "Microphone permission allow karein."
    );

  }

}


/* ================= NAVIGATION ================= */

function goHome(){
  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function openPrivate(){
  alert("Private Chat section coming soon.");
}

function openProfile(){
  alert("Profile section coming soon.");
}

function openNotifications(){
  alert("Notifications section coming soon.");
}

async function openMore(){

  const logout =
    confirm(
      "More Menu\n\nOK = Logout\nCancel = Stay"
    );

  if(logout){

    await supabaseClient.auth.signOut();

    window.location.href =
      "login.html";
  }

}


/* ================= HELPERS ================= */

function showNotice(name){

  alert(
    name +
    " feature ko baad mein connect kiya ja sakta hai."
  );

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttr(value){

  return escapeHtml(value)
    .replace(/`/g,"&#096;");
}


function formatDate(date){

  if(!date) return "";

  try{

    return new Date(date)
      .toLocaleString();

  }catch{

    return "";

  }

}

</script>

</body>
</html>
