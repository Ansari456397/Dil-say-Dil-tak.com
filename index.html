```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socialyte</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
}

/* HEADER */
.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:60px;
  z-index:1000;
  background:white;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  padding:0 15px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#4f46e5;
}

/* TOP MESSAGE AREA */
.message-area{
  position:fixed;
  top:60px;
  left:0;
  width:100%;
  z-index:999;
  background:#f4f6fb;
  padding:8px;
  border-bottom:1px solid #ddd;
}

/* MESSAGE BOX */
.message-box{
  max-width:650px;
  margin:auto;
  background:white;
  border-radius:14px;
  padding:10px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

/* TITLE */
.message-title{
  font-size:15px;
  font-weight:bold;
  margin-bottom:8px;
  color:#4f46e5;
}

/* INPUT ROW */
.message-row{
  display:flex;
  gap:7px;
  align-items:center;
}

/* MESSAGE INPUT */
.message-input{
  flex:1;
  height:44px;
  border:1px solid #ddd;
  border-radius:22px;
  padding:0 15px;
  font-size:14px;
  outline:none;
  background:#f8f9fc;
}

.message-input:focus{
  border-color:#4f46e5;
  background:white;
}

/* SEND */
.send-btn{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#4f46e5;
  color:white;
  font-size:20px;
  cursor:pointer;
}

/* OPTIONS */
.message-options{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.option-btn{
  flex:1;
  border:1px solid #ddd;
  background:#f8f9fc;
  border-radius:9px;
  padding:8px 5px;
  font-size:12px;
  cursor:pointer;
}

.option-btn:active{
  transform:scale(.97);
}

/* RECORDING */
.record-status{
  display:none;
  text-align:center;
  color:#e53935;
  font-size:12px;
  margin-top:6px;
}

/* IMAGE PREVIEW */
#imagePreview img{
  width:100%;
  max-height:150px;
  object-fit:cover;
  border-radius:10px;
  margin-top:8px;
}

/* POSTS */
.container{
  max-width:650px;
  margin:auto;
  padding:185px 10px 25px;
}

.post{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.post-user{
  font-weight:bold;
  margin-bottom:8px;
  color:#4f46e5;
}

.post-text{
  font-size:15px;
  line-height:1.5;
}

.post-image{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:10px;
  margin-top:10px;
}

/* MOBILE */
@media(max-width:500px){

  .message-box{
    border-radius:12px;
  }

  .message-title{
    font-size:14px;
  }

  .message-options{
    gap:5px;
  }

  .option-btn{
    font-size:11px;
    padding:8px 3px;
  }

  .container{
    padding-top:180px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">Socialyte</div>
</div>


<!-- =========================
     MESSAGE BOX - SAB SE UPAR
========================= -->

<div class="message-area">

  <div class="message-box">

    <div class="message-title">
      💬 Message
    </div>

    <div class="message-row">

      <input
        type="text"
        id="messageInput"
        class="message-input"
        placeholder="Write a message..."
        onkeydown="handleEnter(event)"
      >

      <button
        class="send-btn"
        onclick="sendMessage()">
        ➤
      </button>

    </div>


    <div class="message-options">

      <!-- IMAGE -->
      <button
        class="option-btn"
        onclick="document.getElementById('imageInput').click()">
        🖼️ Upload Image
      </button>

      <!-- VOICE -->
      <button
        class="option-btn"
        onclick="toggleVoice()">
        🎤 Voice
      </button>

    </div>


    <div id="recordStatus" class="record-status">
      🔴 Recording... Tap Voice again to stop
    </div>


    <input
      type="file"
      id="imageInput"
      accept="image/*"
      style="display:none"
      onchange="sendImage(event)"
    >

    <div id="imagePreview"></div>

  </div>

</div>


<!-- =========================
     POSTS
========================= -->

<div class="container">

  <div id="posts">

    <div class="post">

      <div class="post-user">
        Socialyte
      </div>

      <div class="post-text">
        Welcome to Socialyte 💙
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   MESSAGE
========================= */

function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  const post =
    document.createElement("div");

  post.className = "post";

  post.innerHTML = `
    <div class="post-user">
      You
    </div>

    <div class="post-text">
      ${escapeHTML(text)}
    </div>
  `;

  document
    .getElementById("posts")
    .prepend(post);

  input.value = "";
}


/* ENTER SEND */

function handleEnter(event){

  if(event.key === "Enter"){

    event.preventDefault();

    sendMessage();

  }

}


/* =========================
   IMAGE
========================= */

function sendImage(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  const reader =
    new FileReader();

  reader.onload =
    function(e){

      const image =
        e.target.result;

      const post =
        document.createElement("div");

      post.className = "post";

      post.innerHTML = `
        <div class="post-user">
          You
        </div>

        <img
          class="post-image"
          src="${image}">
      `;

      document
        .getElementById("posts")
        .prepend(post);

      document
        .getElementById("imagePreview")
        .innerHTML = "";

      document
        .getElementById("imageInput")
        .value = "";

    };

  reader.readAsDataURL(file);

}


/* =========================
   VOICE
========================= */

let recognition = null;
let isRecording = false;

function toggleVoice(){

  if(!("webkitSpeechRecognition" in window)){

    alert(
      "Voice typing is not supported in this browser."
    );

    return;
  }


  if(isRecording){

    recognition.stop();

    isRecording = false;

    document
      .getElementById("recordStatus")
      .style.display = "none";

    return;
  }


  recognition =
    new webkitSpeechRecognition();

  recognition.lang = "ur-PK";

  recognition.continuous = false;

  recognition.interimResults = false;


  recognition.onstart =
    function(){

      isRecording = true;

      document
        .getElementById("recordStatus")
        .style.display = "block";

    };


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0].transcript;

      document
        .getElementById("messageInput")
        .value = text;

    };


  recognition.onend =
    function(){

      isRecording = false;

      document
        .getElementById("recordStatus")
        .style.display = "none";

    };


  recognition.start();

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
