<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;
let currentUsername = "User";

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;


/* =====================================================
   SET USER
===================================================== */

function setCurrentUser(user){

  if(!user){
    return false;
  }

  currentUser = user;

  currentUsername =
    user.user_metadata?.username ||
    user.user_metadata?.name ||
    user.email?.split("@")[0] ||
    "User";

  const usernameBox =
    document.getElementById(
      "loggedInUsername"
    );

  if(usernameBox){

    usernameBox.textContent =
      currentUsername;

  }

  console.log(
    "CURRENT USER:",
    user.email
  );

  return true;

}


/* =====================================================
   CHECK LOGIN
===================================================== */

async function checkUser(){

  console.log(
    "Checking Socialyte login session..."
  );

  for(
    let attempt = 1;
    attempt <= 8;
    attempt++
  ){

    try{

      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();

      console.log(
        "Session check:",
        attempt,
        data
      );

      if(error){

        console.error(
          "GET SESSION ERROR:",
          error
        );

      }

      if(
        data &&
        data.session &&
        data.session.user
      ){

        setCurrentUser(
          data.session.user
        );

        console.log(
          "SESSION FOUND"
        );

        await loadPosts();

        return;

      }

    }catch(error){

      console.error(
        "SESSION CHECK ERROR:",
        error
      );

    }

    if(attempt < 8){

      await new Promise(
        resolve =>
          setTimeout(resolve,750)
      );

    }

  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.getUser();

    console.log(
      "FINAL USER CHECK:",
      data,
      error
    );

    if(
      !error &&
      data &&
      data.user
    ){

      setCurrentUser(
        data.user
      );

      await loadPosts();

      return;

    }

  }catch(error){

    console.error(
      "FINAL USER CHECK ERROR:",
      error
    );

  }


  console.log(
    "NO SESSION FOUND - LOGIN PAGE"
  );

  window.location.replace(
    "login.html"
  );

}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  (event,session) => {

    console.log(
      "AUTH EVENT:",
      event
    );

    if(
      session &&
      session.user
    ){

      setCurrentUser(
        session.user
      );

    }

  }
);


/* =====================================================
   PROFILE
===================================================== */

function openProfile(){

  window.location.href =
    "profile.html";

}


/* =====================================================
   LOAD COMBINED HOME FEED
===================================================== */

async function loadPosts(){

  if(!currentUser){
    return;
  }

  const feedBox =
    document.getElementById(
      "homeFeed"
    );

  if(!feedBox){
    return;
  }

  feedBox.innerHTML =
    '<div class="empty">Loading feed...</div>';

  let blockedIds = [];


  /* ================= BLOCKED USERS ================= */

  try{

    const {
      data:blocked,
      error:blockError
    } =
      await supabaseClient
        .from("user_blocks")
        .select("blocked_id")
        .eq(
          "blocker_id",
          currentUser.id
        );

    if(!blockError){

      blockedIds =
        (blocked || [])
          .map(
            item =>
              item.blocked_id
          );

    }

  }catch(error){

    console.warn(
      "BLOCK CHECK ERROR:",
      error
    );

  }


  /* ================= LOAD POSTS ================= */

  const {
    data:posts,
    error:postError
  } =
    await supabaseClient
      .from("posts")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(postError){

    console.error(
      "POST ERROR:",
      postError
    );

  }


  /* ================= LOAD MESSAGES ================= */

  const {
    data:messages,
    error:messageError
  } =
    await supabaseClient
      .from("home_messages")
      .select(
        "id,user_id,username,message,created_at"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(messageError){

    console.error(
      "MESSAGE ERROR:",
      messageError
    );

  }


  /* ================= FILTER POSTS ================= */

  const safePosts =
    (posts || [])
      .filter(
        post =>
          !blockedIds.includes(
            post.user_id
          )
      );


  /* ================= COMBINE ================= */

  const feedItems = [];


  safePosts.forEach(
    post => {

      feedItems.push({

        type:"post",

        id:post.id,

        created_at:post.created_at,

        data:post

      });

    }
  );


  (messages || []).forEach(
    message => {

      if(
        !blockedIds.includes(
          message.user_id
        )
      ){

        feedItems.push({

          type:"message",

          id:message.id,

          created_at:message.created_at,

          data:message

        });

      }

    }
  );


  /* ================= LATEST FIRST ================= */

  feedItems.sort(
    (a,b) =>
      new Date(b.created_at) -
      new Date(a.created_at)
  );


  /* ================= EMPTY FEED ================= */

  if(feedItems.length === 0){

    feedBox.innerHTML =
      '<div class="empty">No posts or messages yet.</div>';

    return;

  }


  /* ================= RENDER FEED ================= */

  feedBox.innerHTML =
    feedItems
      .map(
        item => {

          if(
            item.type === "post"
          ){

            return renderFeedPost(
              item.data
            );

          }

          return renderFeedMessage(
            item.data
          );

        }
      )
      .join("");


  /* ================= LOAD ACTION STATES ================= */

  await Promise.all(

    safePosts.map(
      post =>
        loadPostActions(
          post.id
        )
    )

  );


  /* ================= LOAD FOLLOW STATES ================= */

  await Promise.all(

    safePosts
      .filter(
        post =>
          post.user_id !== currentUser.id
      )
      .map(
        post =>
          loadFollowStatus(
            post.user_id
          )
      )

  );

}


/* =====================================================
   RENDER FEED POST
===================================================== */

function renderFeedPost(post){

  const ownPost =
    post.user_id === currentUser.id;

  let controls = "";


  if(ownPost){

    controls = `

      <button
        type="button"
        onclick="deletePost('${escapeAttr(post.id)}')">

        🗑️ Delete

      </button>

    `;

  }else{

    controls = `

      <button
        type="button"
        onclick="blockUser('${escapeAttr(post.user_id)}')">

        🚫 Block

      </button>


      <button
        type="button"
        id="follow-btn-${escapeAttr(post.user_id)}"
        onclick="toggleFollow('${escapeAttr(post.user_id)}')">

        👥 Follow

      </button>

    `;

  }


  return `

    <div
      class="post feed-item"
      id="post-${escapeAttr(post.id)}">


      <div class="post-user">

        📝 ${escapeHtml(
          post.username || "User"
        )}

      </div>


      <div class="post-date">

        ${escapeHtml(
          formatDate(post.created_at)
        )}

      </div>


      <div class="post-content">

        ${escapeHtml(
          post.content || ""
        )}

      </div>


      <div class="post-actions">

        ${controls}


        <button
          type="button"
          id="like-btn-${escapeAttr(post.id)}"
          onclick="toggleLike('${escapeAttr(post.id)}')">

          ❤️ Like

          <span
            class="action-count"
            id="like-count-${escapeAttr(post.id)}">
            0
          </span>

        </button>


        <button
          type="button"
          id="dislike-btn-${escapeAttr(post.id)}"
          onclick="toggleDislike('${escapeAttr(post.id)}')">

          👎 Dislike

          <span
            class="action-count"
            id="dislike-count-${escapeAttr(post.id)}">
            0
          </span>

        </button>


        <button
          type="button"
          onclick="toggleComments('${escapeAttr(post.id)}')">

          💬 Comments

        </button>


      </div>


      <div
        class="comments"
        id="comments-${escapeAttr(post.id)}">


        <div
          id="comment-list-${escapeAttr(post.id)}">
        </div>


        <div class="comment-box">


          <input
            id="comment-input-${escapeAttr(post.id)}"
            type="text"
            placeholder="Write a comment..."
          >


          <button
            type="button"
            onclick="addComment('${escapeAttr(post.id)}')">

            ➤

          </button>


        </div>


      </div>


    </div>

  `;

}


/* =====================================================
   RENDER FEED MESSAGE
===================================================== */

function renderFeedMessage(message){

  const mine =
    currentUser &&
    message.user_id === currentUser.id;


  return `

    <div class="home-message feed-item">


      <div class="home-message-user">

        💬 ${escapeHtml(
          message.username || "User"
        )}

      </div>


      <div class="home-message-text">

        ${escapeHtml(
          message.message || ""
        )}

      </div>


      <div class="home-message-date">

        ${escapeHtml(
          formatDate(message.created_at)
        )}

      </div>


      ${
        mine
        ?
        `

          <button
            type="button"
            class="delete-message-btn"
            onclick="deleteHomeMessage(${message.id})">

            🗑️ Delete

          </button>

        `
        :
        ""
      }


    </div>

  `;

}


/* =====================================================
   POST ACTIONS - LOAD COUNTS
===================================================== */

async function loadPostActions(postId){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("post_actions")
      .select(
        "user_id,action_type"
      )
      .eq(
        "post_id",
        postId
      );


  if(error){

    console.error(
      "POST ACTIONS ERROR:",
      error
    );

    return;

  }


  const actions =
    data || [];


  /*
    Count unique users.
    This prevents old duplicate rows
    from inflating the displayed count.
  */

  const likeUsers =
    new Set(
      actions
        .filter(
          item =>
            item.action_type === "like"
        )
        .map(
          item =>
            item.user_id
        )
    );


  const dislikeUsers =
    new Set(
      actions
        .filter(
          item =>
            item.action_type === "dislike"
        )
        .map(
          item =>
            item.user_id
        )
    );


  const likes =
    likeUsers.size;


  const dislikes =
    dislikeUsers.size;


  const myAction =
    actions.find(
      item =>
        item.user_id === currentUser.id
    );


  const likeCount =
    document.getElementById(
      "like-count-" + postId
    );


  const dislikeCount =
    document.getElementById(
      "dislike-count-" + postId
    );


  if(likeCount){

    likeCount.textContent =
      likes;

  }


  if(dislikeCount){

    dislikeCount.textContent =
      dislikes;

  }


  const likeBtn =
    document.getElementById(
      "like-btn-" + postId
    );


  const dislikeBtn =
    document.getElementById(
      "dislike-btn-" + postId
    );


  if(likeBtn){

    likeBtn.classList.toggle(
      "active",
      myAction?.action_type === "like"
    );

  }


  if(dislikeBtn){

    dislikeBtn.classList.toggle(
      "active",
      myAction?.action_type === "dislike"
    );

  }

}


/* =====================================================
   SET POST ACTION
===================================================== */

async function setPostAction(
  postId,
  actionType
){

  if(!currentUser){

    alert(
      "Please login first."
    );

    return;

  }


  /*
    Get current user's existing actions.
  */

  const {
    data:existingRows,
    error:checkError
  } =
    await supabaseClient
      .from("post_actions")
      .select(
        "id,action_type"
      )
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      );


  if(checkError){

    console.error(
      "ACTION CHECK ERROR:",
      checkError
    );

    showNotice(
      "Action check nahi hua."
    );

    return;

  }


  const existing =
    existingRows &&
    existingRows.length
      ? existingRows[0]
      : null;


  /*
    Same action:
    remove all existing rows.
  */

  if(
    existing &&
    existing.action_type === actionType
  ){

    const {
      error
    } =
      await supabaseClient
        .from("post_actions")
        .delete()
        .eq(
          "post_id",
          postId
        )
        .eq(
          "user_id",
          currentUser.id
        );


    if(error){

      console.error(
        "ACTION DELETE ERROR:",
        error
      );

      showNotice(
        "Action remove nahi hua."
      );

      return;

    }


    await loadPostActions(
      postId
    );

    return;

  }


  /*
    Remove any previous action first.
    This guarantees one active action
    per user for this post.
  */

  if(
    existingRows &&
    existingRows.length > 0
  ){

    const {
      error
    } =
      await supabaseClient
        .from("post_actions")
        .delete()
        .eq(
          "post_id",
          postId
        )
        .eq(
          "user_id",
          currentUser.id
        );


    if(error){

      console.error(
        "OLD ACTION DELETE ERROR:",
        error
      );

      showNotice(
        "Previous action remove nahi hua."
      );

      return;

    }

  }


  /*
    Save new action.
  */

  const {
    error
  } =
    await supabaseClient
      .from("post_actions")
      .insert({

        post_id:
          postId,

        user_id:
          currentUser.id,

        action_type:
          actionType

      });


  if(error){

    console.error(
      "ACTION INSERT ERROR:",
      error
    );

    showNotice(
      "Action save nahi hua."
    );

    return;

  }


  await loadPostActions(
    postId
  );

}

/* =====================================================
   LOAD COMMENTS
===================================================== */

async function loadComments(
  postId
){

  const list =
    document.getElementById(
      "comment-list-" + postId
    );


  if(!list){
    return;
  }


  list.innerHTML =
    '<div class="empty">Loading comments...</div>';


  const {
    data,
    error
  } =
    await supabaseClient
      .from("comments")
      .select("*")
      .eq(
        "post_id",
        postId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "COMMENTS ERROR:",
      error
    );


    list.innerHTML =
      '<div class="empty">Comments load nahi hue.</div>';

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    list.innerHTML =
      '<div class="empty">No comments yet.</div>';

    setupCommentInput(
      postId
    );

    return;

  }


  list.innerHTML =
    data.map(
      comment => {

        const username =
          comment.username ||
          "User";


        return `

          <div
            class="comment"
            id="comment-${escapeAttr(comment.id)}">


            <div class="comment-user">

              ${escapeHtml(
                username
              )}

            </div>


            <div class="comment-text">

              ${escapeHtml(
                comment.content || ""
              )}

            </div>


            <div class="comment-actions">

              <button
                type="button"
                onclick="
                  showCommentReply(
                    '${escapeAttr(comment.id)}',
                    '${escapeAttr(username)}'
                  )
                ">

                ↩️ Reply

              </button>

            </div>


            <div
              class="comment-reply-box"
              id="reply-box-${escapeAttr(comment.id)}">


              <div class="comment-reply-row">

                <input
                  id="reply-input-${escapeAttr(comment.id)}"
                  type="text"
                  placeholder="Reply to ${escapeAttr(username)}..."
                >


                <button
                  type="button"
                  onclick="
                    sendCommentReply(
                      '${escapeAttr(comment.id)}',
                      '${escapeAttr(postId)}'
                    )
                  ">

                  ➤

                </button>

              </div>


            </div>


          </div>

        `;

      }
    ).join("");


  setupCommentInput(
    postId
  );


  data.forEach(
    comment => {

      const replyInput =
        document.getElementById(
          "reply-input-" + comment.id
        );


      if(replyInput){

        replyInput.onkeydown =
          function(event){

            if(
              event.key === "Enter"
            ){

              event.preventDefault();

              sendCommentReply(
                comment.id,
                postId
              );

            }

          };

      }

    }
  );

}

/* =====================================================
   VOICE
===================================================== */

async function toggleRecording(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "Voice recording browser mein available nahi."
    );

    return;

  }


  if(isRecording){

    if(mediaRecorder){

      mediaRecorder.stop();

    }

    return;

  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    audioChunks =
      [];


    mediaRecorder =
      new MediaRecorder(
        stream
      );


    mediaRecorder.ondataavailable =
      event => {

        if(
          event.data.size > 0
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        isRecording =
          false;


        const status =
          document.getElementById(
            "recordStatus"
          );


        const voiceBtn =
          document.getElementById(
            "voiceBtn"
          );


        if(status){

          status.style.display =
            "none";

        }


        if(voiceBtn){

          voiceBtn.textContent =
            "🎤 Voice";

        }


        showNotice(
          "Voice recording ready hai."
        );

      };


    mediaRecorder.start();


    isRecording =
      true;


    const status =
      document.getElementById(
        "recordStatus"
      );


    const voiceBtn =
      document.getElementById(
        "voiceBtn"
      );


    if(status){

      status.style.display =
        "block";

    }


    if(voiceBtn){

      voiceBtn.textContent =
        "⏹️ Stop";

    }

  }


  catch(error){

    console.error(
      "VOICE ERROR:",
      error
    );


    alert(
      "Microphone permission nahi mili."
    );

  }

}

/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttr(
  value
){

  return escapeHtml(
    value
  );

}


function formatDate(
  date
){

  if(!date){
    return "";
  }


  try{

    return new Date(
      date
    ).toLocaleString();

  }catch(error){

    return "";

  }

}
