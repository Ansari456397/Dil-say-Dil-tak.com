<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Socialyte</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6fa;
  color:#20242c;
  padding-bottom:75px;
}

header{
  background:#20242c;
  color:white;
  height:60px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#ff4f81;
}

.header-btns{
  display:flex;
  gap:8px;
}

.header-btns button{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#303641;
  color:white;
  font-size:17px;
}

/* PROFILE */
.profile{
  background:white;
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ff4f81;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  font-size:20px;
}

.name{
  font-weight:bold;
}

.online{
  color:#18a463;
  font-size:12px;
  margin-top:4px;
}

/* WRITE BOX */
.write-card{
  background:white;
  margin:12px;
  padding:12px;
  border-radius:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.write-row{
  display:flex;
  gap:8px;
}

#messageInput{
  flex:1;
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  font-size:15px;
  outline:none;
}

#sendBtn{
  border:0;
  background:#ff4f81;
  color:white;
  border-radius:14px;
  padding:0 18px;
  font-weight:bold;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.action{
  flex:1;
  border:0;
  padding:10px 5px;
  border-radius:13px;
  background:#f1f2f5;
  font-size:12px;
}

.action:active{
  transform:scale(.96);
}

/* MENU */
.menu{
  background:white;
  margin:12px;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.menu button{
  width:50%;
  border:0;
  background:white;
  padding:15px;
  font-size:14px;
  text-align:left;
  border-bottom:1px solid #eee;
}

.menu button:hover{
  background:#f8f8f8;
}

/* CHAT */
.chat{
  background:white;
  margin:12px;
  border-radius:18px;
  overflow:hidden;
}

.chat-title{
  padding:15px;
  font-weight:bold;
  border-bottom:1px solid #eee;
}

#messages{
  max-height:45vh;
  overflow-y:auto;
  padding:15px;
}

.message-row{
  display:flex;
  margin-bottom:14px;
}

.mine{
  justify-content:flex-end;
}

.other{
  justify-content:flex-start;
}

.message{
  max-width:80%;
  padding:10px 13px;
  border-radius:16px;
}

.mine .message{
  background:#20242c;
  color:white;
  border-bottom-right-radius:4px;
}

.other .message{
  background:#f0f2f5;
  border-bottom-left-radius:4px;
}

.username{
  font-size:11px;
  font-weight:bold;
  opacity:.7;
  margin-bottom:4px;
}

.text{
  font-size:15px;
  word-break:break-word;
}

.time{
  font-size:9px;
  opacity:.55;
  text-align:right;
  margin-top:5px;
}

.reply{
  border:0;
  background:transparent;
  font-size:11px;
  margin-top:5px;
  opacity:.7;
}

/* BOTTOM */
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.bottom button{
  border:0;
  background:none;
  font-size:11px;
  color:#555;
}

.bottom div{
  font-size:20px;
  margin-bottom:3px;
}

.active{
  color:#ff4f81 !important;
  font-weight:bold;
}

#status{
  text-align:center;
  color:#777;
  font-size:11px;
  padding:7px;
}

/* ACTION MESSAGE */
.action-note{
  text-align:center;
  margin:8px 12px;
  padding:10px;
  border-radius:12px;
  background:#fff;
  font-size:13px;
  display:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">Socia<span>lyte</span></div>

  <div class="header-btns">
    <button>🔔</button>
    <button>⚙️</button>
  </div>
</header>

<div class="profile">

  <div class="avatar" id="avatar">U</div>

  <div>
    <div class="name" id="profileName">User</div>
    <div class="online">● Online</div>
  </div>

</div>

<!-- WRITE MESSAGE FIRST -->
<div class="write-card">

  <div class="write-row">

    <input
      id="messageInput"
      type="text"
      placeholder="Write a message..."
    >

    <button id="sendBtn">Send</button>

  </div>

  <!-- SEPARATE ACTIONS -->
  <div class="actions">

    <button class="action" onclick="jhappi()">
      🤗<br>Jhappi
    </button>

    <button class="action" onclick="chupair()">
      😘<br>Chupair
    </button>

    <button class="action" onclick="showAction('❤️ Love')">
      ❤️<br>Love
    </button>

    <button class="action" onclick="showAction('😂 Haha')">
      😂<br>Haha
    </button>

  </div>

</div>

<div class="action-note" id="actionNote"></div>

<!-- MAIN OPTIONS -->
<div class="menu">

  <button>🏠 Home</button>
  <button>💬 Public Chat</button>

  <button>🔒 Private Chat</button>
  <button>🟢 Online Users</button>

  <button>👥 Members</button>
  <button>📝 Posts</button>

  <button>🔔 Notifications</button>
  <button>👤 My Profile</button>

  <button>⭐ Stars</button>
  <button>🔥 Trending Posts</button>

</div>

<!-- CHAT -->
<div class="chat">

  <div class="chat-title">
    💬 Public Chat
  </div>

  <div id="messages"></div>

  <div id="status"></div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom">

  <button class="active">
    <div>🏠</div>
    Home
  </button>

  <button>
    <div>💬</div>
    Chat
  </button>

  <button>
    <div>🟢</div>
    Online
  </button>

  <button>
    <div>📝</div>
    Posts
  </button>

  <button>
    <div>👤</div>
    Profile
  </button>

</div>

<script>

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser=null;

/* USER */
async function checkUser(){

  const {data,error} =
    await supabaseClient.auth.getUser();

  if(error || !data.user){

    window.location.href="login.html";
    return;
  }

  currentUser=data.user;

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email.split("@")[0];

  document.getElementById("profileName")
    .textContent=username;

  document.getElementById("avatar")
    .textContent=username.charAt(0).toUpperCase();

  loadMessages();
}

/* LOAD CHAT */
async function loadMessages(){

  const {data,error} =
    await supabaseClient
    .from("messages")
    .select("*")
    .order("created_at",{ascending:true});

  if(error){

    document.getElementById("status")
      .textContent=error.message;

    return;
  }

  const box=document.getElementById("messages");

  box.innerHTML="";

  data.forEach(msg=>{

    const row=document.createElement("div");

    const mine =
      msg.user_id===currentUser.id;

    row.className=
      "message-row "+
      (mine ? "mine":"other");

    const bubble=document.createElement("div");

    bubble.className="message";

    const username=document.createElement("div");

    username.className="username";

    username.textContent=
      msg.username || "User";

    const text=document.createElement("div");

    text.className="text";

    text.textContent=msg.message;

    const time=document.createElement("div");

    time.className="time";

    time.textContent=
      new Date(msg.created_at)
      .toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
      });

    const reply=document.createElement("button");

    reply.className="reply";

    reply.textContent="↩️ Reply";

    reply.onclick=function(){

      document.getElementById("messageInput")
        .value="@"+(msg.username || "User")+" ";

      document.getElementById("messageInput")
        .focus();

    };

    bubble.appendChild(username);
    bubble.appendChild(text);
    bubble.appendChild(time);
    bubble.appendChild(reply);

    row.appendChild(bubble);

    box.appendChild(row);

  });

  box.scrollTop=box.scrollHeight;
}

/* SEND MESSAGE */
async function sendMessage(){

  const input=
    document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text || !currentUser)return;

  const username=
    currentUser.user_metadata?.username ||
    currentUser.email.split("@")[0];

  const {error}=
    await supabaseClient
    .from("messages")
    .insert({
      user_id:currentUser.id,
      username:username,
      message:text
    });

  if(error){

    document.getElementById("status")
      .textContent=error.message;

    return;
  }

  input.value="";

  loadMessages();
}

/* JHAPPI */
function jhappi(){

  showAction(
    "🤗 Jhappi sent!"
  );

}

/* CHUPAIR */
function chupair(){

  showAction(
    "😘 Chupair sent!"
  );

}

/* OTHER ACTIONS */
function showAction(text){

  const box=
    document.getElementById("actionNote");

  box.textContent=text;

  box.style.display="block";

  setTimeout(function(){

    box.style.display="none";

  },2000);
}

document.getElementById("sendBtn")
  .addEventListener(
    "click",
    sendMessage
  );

document.getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key==="Enter"){
        sendMessage();
      }

    }
  );

checkUser();

</script>

</body>
</html>
