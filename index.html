<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Socialyte</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-top:125px;
}

/* HEADER */
.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:60px;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
  box-shadow:0 2px 10px #0002;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

/* TOP MESSAGE BOX */
.home-message-box{
  position:fixed;
  top:60px;
  left:0;
  width:100%;
  background:white;
  padding:10px;
  z-index:999;
  box-shadow:0 2px 10px #0002;
}

.message-title{
  font-weight:bold;
  color:#6c5ce7;
  margin-bottom:7px;
}

.message-row{
  display:flex;
  gap:6px;
}

#chatInput{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:20px;
  padding:11px 14px;
  outline:none;
  font-size:14px;
}

.chat-send{
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:20px;
  width:45px;
  font-size:20px;
  cursor:pointer;
}

.media-row{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.media-btn{
  border:0;
  background:#f0edff;
  color:#5d4bd6;
  padding:7px 12px;
  border-radius:15px;
  cursor:pointer;
  font-size:13px;
}

/* CONTENT */
.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:10px;
}

.welcome{
  background:white;
  padding:15px;
  border-radius:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}

.welcome h3{
  margin:0 0 5px;
  color:#6c5ce7;
}

/* POSTS */
.post{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}

.post-user{
  font-weight:bold;
  color:#6c5ce7;
  margin-bottom:7px;
}

.post-text{
  white-space:pre-wrap;
  word-break:break-word;
}

.post-image{
  max-width:100%;
  border-radius:12px;
  margin-top:8px;
}

.status{
  text-align:center;
  color:#777;
  font-size:13px;
  margin:10px;
}

#recordStatus{
  display:none;
  color:#e74c3c;
  font-size:12px;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">Socialyte</div>
</div>

<!-- MESSAGE BOX TOP PAR -->
<div class="home-message-box">

  <div class="message-title">💬 Message</div>

  <div class="message-row">
    <input
      type="text"
      id="chatInput"
      placeholder="Write a message..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >

    <button class="chat-send" onclick="sendMessage()">➤</button>
  </div>

  <div class="media-row">

    <button
      class="media-btn"
      onclick="document.getElementById('imageInput').click()">
      🖼️ Upload Image
    </button>

    <button
      class="media-btn"
      id="voiceBtn"
      onclick="toggleVoice()">
      🎤 Voice
    </button>

  </div>

  <input
    type="file"
    id="imageInput"
    accept="image/*"
    style="display:none"
    onchange="sendImage()"
  >

  <div id="recordStatus">🎤 Listening... Tap Voice again to stop</div>

</div>


<div class="container">

  <div class="welcome">
    <h3>Welcome to Socialyte 💜</h3>
    <div id="userStatus">Loading...</div>
  </div>

  <div id="posts">
    <div class="status">Loading posts...</div>
  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

/*
  YAHAN APNI EXISTING PUBLISHABLE KEY PASTE KARO
  Chat mein key mat bhejna.
*/
const SUPABASE_KEY =
"PASTE_YOUR_KEY_HERE";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentUsername = "User";


/* =========================
   START APP
========================= */

async function startApp(){

  const {
    data,
    error
  } = await supabaseClient.auth.getUser();

  if(error || !data.user){

    window.location.href = "login.html";
    return;
  }

  currentUser = data.user;

  currentUsername =
    data.user.user_metadata?.username ||
    data.user.email?.split("@")[0] ||
    "User";

  document.getElementById("userStatus").textContent =
    "Logged in as " + currentUsername;

  loadPosts();
}


/* =========================
   LOAD POSTS
========================= */

async function loadPosts(){

  const postsBox =
    document.getElementById("posts");

  postsBox.innerHTML =
    '<div class="status">Loading...</div>';

  const {
    data,
    error
  } = await supabaseClient
    .from("posts")
    .select("*")
    .order("id", {ascending:false});

  if(error){

    console.error(error);

    postsBox.innerHTML =
      '<div class="status">Posts load nahi ho rahe.</div>';

    return;
  }

  postsBox.innerHTML = "";

  if(!data || data.length === 0){

    postsBox.innerHTML =
      '<div class="status">Abhi koi post nahi hai.</div>';

    return;
  }

  data.forEach(post => {

    const div =
      document.createElement("div");

    div.className = "post";

    const user =
      document.createElement("div");

    user.className = "post-user";

    user.textContent =
      post.username || "User";

    const text =
      document.createElement("div");

    text.className = "post-text";

    text.textContent =
      post.content || "";

    div.appendChild(user);
    div.appendChild(text);

    postsBox.appendChild(div);

  });
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const input =
    document.getElementById("chatInput");

  const text =
    input.value.trim();

  if(!text) return;

  if(!currentUser){

    alert("Please login first.");
    return;
  }

  const {
    error
  } = await supabaseClient
    .from("posts")
    .insert({
      user_id: currentUser.id,
      username: currentUsername,
      content: text
    });

  if(error){

    console.error(error);

    alert("Message send nahi hua.");

    return;
  }

  input.value = "";

  await loadPosts();

}


/* =========================
   IMAGE
========================= */

async function sendImage(){

  const input =
    document.getElementById("imageInput");

  const file =
    input.files[0];

  if(!file) return;

  /*
    Abhi image ko database mein permanently
    save nahi kar rahe.
    Pehle Storage setup karna hoga.
  */

  alert(
    "Image option ready hai 👍\n\n" +
    "Image ko permanently save karne ke liye " +
    "Supabase Storage setup karna hoga."
  );

  input.value = "";
}


/* =========================
   VOICE / SPEECH TO TEXT
========================= */

let recognition = null;
let isRecording = false;

function toggleVoice(){

  const status =
    document.getElementById("recordStatus");

  const input =
    document.getElementById("chatInput");

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice typing tumhare browser mein supported nahi hai."
    );

    return;
  }

  if(isRecording){

    recognition.stop();

    isRecording = false;

    status.style.display = "none";

    return;
  }

  recognition =
    new SpeechRecognition();

  recognition.lang = "ur-PK";

  recognition.continuous = true;

  recognition.interimResults = false;

  recognition.onresult = function(event){

    let result = "";

    for(
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ){

      if(event.results[i].isFinal){

        result +=
          event.results[i][0].transcript + " ";
      }
    }

    input.value += result;

  };

  recognition.onerror = function(){

    isRecording = false;

    status.style.display = "none";
  };

  recognition.onend = function(){

    isRecording = false;

    status.style.display = "none";
  };

  recognition.start();

  isRecording = true;

  status.style.display = "block";
}


/* =========================
   START
========================= */

startApp();

</script>

</body>
</html>
