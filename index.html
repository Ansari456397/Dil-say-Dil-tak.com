<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Socialyte</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-bottom:80px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  padding:16px;
  text-align:center;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#ffd6ff;
}

/* CONTAINER */

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:12px;
}

/* TOP MESSAGE */

.home-message-box{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.message-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:10px;
}

.message-row{
  display:flex;
  gap:8px;
}

#chatInput{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  outline:none;
  font-size:15px;
}

.chat-send{
  border:0;
  border-radius:10px;
  background:#6c5ce7;
  color:white;
  width:48px;
  font-size:20px;
}

.message-tools{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.message-tools button{
  flex:1;
  border:1px solid #ddd;
  background:#fafafa;
  border-radius:9px;
  padding:9px 5px;
}

/* WELCOME */

.welcome-box{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  text-align:center;
}

.welcome-title{
  font-size:20px;
  font-weight:bold;
  color:#6c5ce7;
}

.logged-in{
  margin-top:6px;
  font-size:13px;
  color:#777;
}

.logged-in span{
  font-weight:bold;
  color:#333;
}

/* FEED */

.section-title{
  font-size:19px;
  font-weight:bold;
  margin:15px 0 10px;
}

#homeFeed{
  margin-bottom:20px;
}

/* POST */

.post{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.post-user{
  font-weight:bold;
  margin-bottom:6px;
}

.post-date{
  color:#888;
  font-size:12px;
  margin-bottom:10px;
}

.post-content{
  white-space:pre-wrap;
  line-height:1.5;
  word-break:break-word;
}

/* POST OPTIONS */

.post-actions{
  display:flex !important;
  flex-wrap:wrap !important;
  gap:7px !important;
  margin-top:15px !important;
  padding-top:12px !important;
  border-top:1px solid #eee !important;
  width:100% !important;
}

.post-actions button{
  display:inline-block !important;
  visibility:visible !important;
  opacity:1 !important;
  border:1px solid #ddd !important;
  background:#fafafa !important;
  color:#222 !important;
  border-radius:8px !important;
  padding:9px 10px !important;
  cursor:pointer !important;
  font-size:13px !important;
}

.post-actions button.active{
  background:#eee9ff !important;
  border-color:#6c5ce7 !important;
  color:#6c5ce7 !important;
  font-weight:bold !important;
}

.action-count{
  font-weight:bold;
  margin-left:3px;
}

/* HOME MESSAGE */

.home-message{
  background:white;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.home-message-user{
  font-weight:bold;
  color:#6c5ce7;
  margin-bottom:6px;
}

.home-message-text{
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.home-message-date{
  color:#888;
  font-size:11px;
  margin-top:8px;
}

.delete-message-btn{
  margin-top:8px;
  border:0;
  background:none;
  color:#d63031;
  cursor:pointer;
  font-size:12px;
}

/* COMMENTS */

.comments{
  display:none;
  margin-top:12px;
  border-top:1px solid #eee;
  padding-top:12px;
}

.comment{
  background:#f6f7fb;
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}

.comment-user{
  font-weight:bold;
  font-size:14px;
}

.comment-text{
  margin-top:4px;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-actions{
  margin-top:7px;
}

.comment-actions button{
  border:0;
  background:none;
  color:#6c5ce7;
  padding:3px 0;
  cursor:pointer;
}

.comment-box{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.comment-box input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:9px;
  padding:10px;
  outline:none;
}

.comment-box button{
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:9px;
  padding:0 14px;
}

.comment-reply-box{
  display:none;
  margin-top:8px;
  padding-left:12px;
}

.comment-reply-row{
  display:flex;
  gap:6px;
}

.comment-reply-row input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:9px;
  padding:9px;
}

.comment-reply-row button{
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:9px;
  padding:0 13px;
}

/* EMPTY */

.empty{
  background:white;
  border-radius:12px;
  padding:20px;
  text-align:center;
  color:#777;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:200;
  height:65px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
}

.bottom-nav button{
  flex:1;
  border:0;
  background:white;
  font-size:12px;
}

.bottom-nav button span{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

/* NOTICE */

.notice{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:10px 15px;
  border-radius:10px;
  display:none;
  z-index:500;
  max-width:90%;
  text-align:center;
}

</style>
</head>

<div id="notice" class="notice"></div>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


/* ================= VARIABLES ================= */

let currentUser = null;
let currentUsername = "User";

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;


/* ================= USER ================= */

function setCurrentUser(user){

  if(!user) return false;

  currentUser = user;

  currentUsername =
    user.user_metadata?.username ||
    user.user_metadata?.name ||
    user.email?.split("@")[0] ||
    "User";

  const box =
    document.getElementById(
      "loggedInUsername"
    );

  if(box){
    box.textContent =
      currentUsername;
  }

  return true;
}


/* ================= LOGIN CHECK ================= */

async function checkUser(){

  for(
    let attempt=1;
    attempt<=8;
    attempt++
  ){

    try{

      const {
        data,
        error
      } =
      await supabaseClient.auth.getSession();

      if(
        !error &&
        data?.session?.user
      ){

        setCurrentUser(
          data.session.user
        );

        await loadPosts();

        return;
      }

    }catch(error){

      console.error(
        "SESSION ERROR:",
        error
      );

    }

    await new Promise(
      resolve =>
        setTimeout(resolve,750)
    );

  }


  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getUser();

    if(
      !error &&
      data?.user
    ){

      setCurrentUser(
        data.user
      );

      await loadPosts();

      return;
    }

  }catch(error){

    console.error(error);

  }


  window.location.replace(
    "login.html"
  );
}


supabaseClient.auth.onAuthStateChange(
  (event,session)=>{

    if(session?.user){

      setCurrentUser(
        session.user
      );

    }

  }
);


/* ================= PROFILE ================= */

function openProfile(){

  window.location.href =
    "profile.html";

}


/* ================= LOAD FEED ================= */

async function loadPosts(){

  if(!currentUser) return;

  const feed =
    document.getElementById(
      "homeFeed"
    );

  if(!feed) return;

  feed.innerHTML =
    '<div class="empty">Loading feed...</div>';


  /* BLOCKED USERS */

  let blockedIds = [];

  try{

    const {
      data
    } =
    await supabaseClient
      .from("user_blocks")
      .select("blocked_id")
      .eq(
        "blocker_id",
        currentUser.id
      );

    blockedIds =
      (data || []).map(
        x => x.blocked_id
      );

  }catch(error){

    console.error(error);

  }


  /* POSTS */

  const {
    data:posts,
    error:postError
  } =
  await supabaseClient
    .from("posts")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );

  if(postError){

    console.error(
      "POST ERROR:",
      postError
    );

  }


  /* MESSAGES */

  const {
    data:messages,
    error:messageError
  } =
  await supabaseClient
    .from("home_messages")
    .select(
      "id,user_id,username,message,created_at"
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );

  if(messageError){

    console.error(
      "MESSAGE ERROR:",
      messageError
    );

  }


  const safePosts =
    (posts || []).filter(
      post =>
        !blockedIds.includes(
          post.user_id
        )
    );


  const feedItems = [];


  safePosts.forEach(
    post => {

      feedItems.push({
        type:"post",
        id:post.id,
        created_at:post.created_at,
        data:post
      });

    }
  );


  (messages || []).forEach(
    message => {

      if(
        !blockedIds.includes(
          message.user_id
        )
      ){

        feedItems.push({
          type:"message",
          id:message.id,
          created_at:message.created_at,
          data:message
        });

      }

    }
  );


  feedItems.sort(
    (a,b)=>
      new Date(b.created_at) -
      new Date(a.created_at)
  );


  if(feedItems.length===0){

    feed.innerHTML =
      '<div class="empty">No posts or messages yet.</div>';

    return;

  }


  feed.innerHTML =
    feedItems.map(
      item =>
        item.type==="post"
        ? renderFeedPost(item.data)
        : renderFeedMessage(item.data)
    ).join("");


  /* LOAD COUNTS */

  for(
    const post of safePosts
  ){

    await loadPostActions(
      post.id
    );

    if(
      post.user_id !== currentUser.id
    ){

      await loadFollowStatus(
        post.user_id
      );

    }

  }

}


/* ================= RENDER POST ================= */

function renderFeedPost(post){

  const ownPost =
    post.user_id === currentUser.id;

  let controls = "";


  if(ownPost){

    controls = `

      <button
        type="button"
        onclick="deletePost('${escapeAttr(post.id)}')">

        🗑️ Delete

      </button>

    `;

  }else{

    controls = `

      <button
        type="button"
        onclick="blockUser('${escapeAttr(post.user_id)}')">

        🚫 Block

      </button>

      <button
        type="button"
        id="follow-btn-${escapeAttr(post.user_id)}"
        onclick="toggleFollow('${escapeAttr(post.user_id)}')">

        👥 Follow

      </button>

    `;

  }


  return `

    <div
      class="post feed-item"
      id="post-${escapeAttr(post.id)}">

      <div class="post-user">

        📝 ${escapeHtml(
          post.username || "User"
        )}

      </div>


      <div class="post-date">

        ${escapeHtml(
          formatDate(post.created_at)
        )}

      </div>


      <div class="post-content">

        ${escapeHtml(
          post.content || ""
        )}

      </div>


      <!-- OPTIONS -->

      <div class="post-actions">

        ${controls}


        <button
          type="button"
          id="like-btn-${escapeAttr(post.id)}"
          onclick="toggleLike('${escapeAttr(post.id)}')">

          ❤️ Like
          <span
            class="action-count"
            id="like-count-${escapeAttr(post.id)}">
            0
          </span>

        </button>


        <button
          type="button"
          id="dislike-btn-${escapeAttr(post.id)}"
          onclick="toggleDislike('${escapeAttr(post.id)}')">

          👎 Dislike
          <span
            class="action-count"
            id="dislike-count-${escapeAttr(post.id)}">
            0
          </span>

        </button>


        <button
          type="button"
          onclick="toggleComments('${escapeAttr(post.id)}')">

          💬 Comments

        </button>

      </div>


      <!-- COMMENTS -->

      <div
        class="comments"
        id="comments-${escapeAttr(post.id)}">

        <div
          id="comment-list-${escapeAttr(post.id)}">
        </div>


        <div class="comment-box">

          <input
            id="comment-input-${escapeAttr(post.id)}"
            type="text"
            placeholder="Write a comment..."
          >

          <button
            type="button"
            onclick="addComment('${escapeAttr(post.id)}')">

            ➤

          </button>

        </div>

      </div>

    </div>

  `;

}


/* ================= MESSAGE ================= */

function renderFeedMessage(message){

  const mine =
    currentUser &&
    message.user_id === currentUser.id;


  return `

    <div class="home-message feed-item">

      <div class="home-message-user">

        💬 ${escapeHtml(
          message.username || "User"
        )}

      </div>


      <div class="home-message-text">

        ${escapeHtml(
          message.message || ""
        )}

      </div>


      <div class="home-message-date">

        ${escapeHtml(
          formatDate(message.created_at)
        )}

      </div>


      ${
        mine
        ?
        `
          <button
            type="button"
            class="delete-message-btn"
            onclick="deleteHomeMessage(${message.id})">

            🗑️ Delete

          </button>
        `
        :
        ""
      }

    </div>

  `;

}


/* ================= LIKE / DISLIKE COUNTS ================= */

async function loadPostActions(postId){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("post_actions")
    .select(
      "user_id,action_type"
    )
    .eq(
      "post_id",
      postId
    );


  if(error){

    console.error(
      "ACTION ERROR:",
      error
    );

    return;

  }


  const actions =
    data || [];


  const likes =
    new Set(
      actions
        .filter(
          x =>
            x.action_type === "like"
        )
        .map(
          x =>
            x.user_id
        )
    ).size;


  const dislikes =
    new Set(
      actions
        .filter(
          x =>
            x.action_type === "dislike"
        )
        .map(
          x =>
            x.user_id
        )
    ).size;


  const myAction =
    actions.find(
      x =>
        x.user_id === currentUser.id
    );


  const likeCount =
    document.getElementById(
      "like-count-" + postId
    );

  const dislikeCount =
    document.getElementById(
      "dislike-count-" + postId
    );


  if(likeCount){

    likeCount.textContent =
      likes;

  }


  if(dislikeCount){

    dislikeCount.textContent =
      dislikes;

  }


  const likeBtn =
    document.getElementById(
      "like-btn-" + postId
    );

  const dislikeBtn =
    document.getElementById(
      "dislike-btn-" + postId
    );


  if(likeBtn){

    likeBtn.classList.toggle(
      "active",
      myAction?.action_type === "like"
    );

  }


  if(dislikeBtn){

    dislikeBtn.classList.toggle(
      "active",
      myAction?.action_type === "dislike"
    );

  }

}


/* ================= ACTION ================= */

async function setPostAction(
  postId,
  actionType
){

  if(!currentUser){

    alert(
      "Please login first."
    );

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("post_actions")
    .select(
      "id,action_type"
    )
    .eq(
      "post_id",
      postId
    )
    .eq(
      "user_id",
      currentUser.id
    );


  if(error){

    showNotice(
      "Action check nahi hua."
    );

    return;

  }


  const existing =
    data?.[0];


  /* SAME ACTION = REMOVE */

  if(
    existing &&
    existing.action_type === actionType
  ){

    const {
      error
    } =
    await supabaseClient
      .from("post_actions")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      );


    if(error){

      showNotice(
        "Action remove nahi hua."
      );

      return;

    }

    await loadPostActions(
      postId
    );

    return;

  }


  /* REMOVE OLD ACTION */

  if(data && data.length){

    const {
      error
    } =
    await supabaseClient
      .from("post_actions")
      .delete()
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      );


    if(error){

      showNotice(
        "Previous action remove nahi hua."
      );

      return;

    }

  }


  /* ADD NEW */

  const {
    error:insertError
  } =
  await supabaseClient
    .from("post_actions")
    .insert({

      post_id:postId,

      user_id:currentUser.id,

      action_type:actionType

    });


  if(insertError){

    console.error(
      insertError
    );

    showNotice(
      "Action save nahi hua."
    );

    return;

  }


  await loadPostActions(
    postId
  );

}


async function toggleLike(postId){

  await setPostAction(
    postId,
    "like"
  );

}


async function toggleDislike(postId){

  await setPostAction(
    postId,
    "dislike"
  );

}


/* ================= FOLLOW ================= */

async function loadFollowStatus(
  userId
){

  const button =
    document.getElementById(
      "follow-btn-" + userId
    );

  if(!button) return;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("user_follows")
    .select("id")
    .eq(
      "follower_id",
      currentUser.id
    )
    .eq(
      "following_id",
      userId
    )
    .maybeSingle();


  if(error){

    console.error(
      "FOLLOW ERROR:",
      error
    );

    return;

  }


  if(data){

    button.textContent =
      "👥 Following";

    button.classList.add(
      "active"
    );

  }else{

    button.textContent =
      "👥 Follow";

    button.classList.remove(
      "active"
    );

  }

}


async function toggleFollow(
  userId
){

  if(!currentUser) return;


  const {
    data:existing,
    error
  } =

    .from("user_follows")
    .select("id")
    .eq(

      currentUser.id
    )
    .eq(
      "following_id",
      userId
    )
    .maybeSingle();


  if(error){

    showNotice(

    );

  }


  if(existing){

    const {
      error
    } =
    await supabaseClient
      .from("user_follows")

      .eq(
        "id",
        existing.id
      );

    if(error){

      showNotice(
        "Unfollow nahi hua."
      );

      "Unfollowed."
    );

  }else{

      error
    } =
    await supabaseClient
      .from("user_follows")
      .insert({

        follower_id:
          currentUser.id,

        following_id:
          userId

      });


    if(error){

      showNotice(
        "Follow nahi hua."
      );

      return;

    }

    showNotice(
      "👥 Following"
    );

  }


  await loadFollowStatus(

async function loadComments(
  postId
){

  const list =
    document.getElementById(
      "comment-list-" + postId
    );

  if(!list) return;


  list.innerHTML =
    '<div class="empty">Loading comments...</div>';


  const {
    data,
    error
  } =
  await supabaseClient
    .from("comments")
    .select("*")
    .eq(
      "post_id",
      postId
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );


  if(error){

    list.innerHTML =
      '<div class="empty">Comments load nahi hue.</div>';

    return;

  }


  if(
    !data ||
    data.length === 0
  ){

    list.innerHTML =
      '<div class="empty">No comments yet.</div>';

    setupCommentInput(
      postId
    );

    return;

  }


  list.innerHTML =
    data.map(
      comment => {

        const username =
          comment.username ||
          "User";


        return `

          <div class="comment">

            <div class="comment-user">
              ${escapeHtml(username)}
            </div>

            <div class="comment-text">
              ${escapeHtml(comment.content || "")}
            </div>

            <div class="comment-actions">

              <button
                type="button"
                onclick="showCommentReply(
                  '${escapeAttr(comment.id)}',
                  '${escapeAttr(username)}'
                )">

                ↩️ Reply

              </button>

            </div>


            <div
              class="comment-reply-box"
              id="reply-box-${escapeAttr(comment.id)}">

              <div class="comment-reply-row">

                <input
                  id="reply-input-${escapeAttr(comment.id)}"
                  type="text"
                  placeholder="Reply to ${escapeAttr(username)}..."
                >

                <button
                  type="button"
                  onclick="sendCommentReply(
                    '${escapeAttr(comment.id)}',
                    '${escapeAttr(postId)}'
                  )">

                  ➤

                </button>

              </div>

            </div>

          </div>

        `;

      }
    ).join("");


  setupCommentInput(
    postId
  );

}


function setupCommentInput(
  postId
){

  const input =
    document.getElementById(
      "comment-input-" + postId
    );

  if(input){

    input.onkeydown =
      function(event){

        if(
          event.key === "Enter"
        ){

          event.preventDefault();

          addComment(
            postId
          );

        }

      };

  }

}


function showCommentReply(
  commentId,
  username
){

  const box =
    document.getElementById(
      "reply-box-" + commentId
    );

  const input =
    document.getElementById(
      "reply-input-" + commentId
    );

  if(!box || !input) return;


  box.style.display =
    "block";

  input.value =
    "@" + username + " ";

  input.focus();

}


async function sendCommentReply(

      user_id:currentUser.id,

/* ================= VOICE ================= */

async function toggleRecording(){

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    alert(
      "Voice recording available nahi."
    );

    return;

  }


  if(isRecording){

    mediaRecorder.stop();

    return;

  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    audioChunks = [];


    mediaRecorder =
      new MediaRecorder(
        stream
      );


    mediaRecorder.ondataavailable =
      event => {

        if(
          event.data.size > 0
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        isRecording =
          false;


        document.getElementById(
          "recordStatus"
        ).style.display =
          "none";


        document.getElementById(
          "voiceBtn"
        ).textContent =
          "🎤 Voice";


        showNotice(
          "Voice recording ready hai."
        );

      };


    mediaRecorder.start();

    isRecording =
      true;


    document.getElementById(
      "recordStatus"
    ).style.display =
      "block";


    document.getElementById(
      "voiceBtn"
    ).textContent =
      "⏹️ Stop";

  }catch(error){

    console.error(
      error
    );

    alert(
      "Microphone permission nahi mili."
    );

  }

}

/* ================= HELPERS ================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttr(value){

  return escapeHtml(
    value
  );

}


function formatDate(date){

  if(!date) return "";

  try{

    return new Date(
      date
    ).toLocaleString();

  }catch(error){

    return "";

  }

}
