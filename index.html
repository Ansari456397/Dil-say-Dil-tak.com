<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Socialyte</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-bottom:75px;
}

.header{
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 15px;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#ffd6ff;
}

.online-users-btn{
  border:none;
  background:rgba(255,255,255,.18);
  color:white;
  padding:9px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:12px;
}

/* MESSAGE BOX */

.home-message-box,
.create-post-box,
.welcome-box{
  background:white;
  border-radius:14px;
  padding:13px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.box-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:10px;
}

.message-row{
  display:flex;
  gap:7px;
}

#chatInput{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:22px;
  padding:11px 14px;
  outline:none;
  font-size:14px;
}

.chat-send{
  border:none;
  background:#6c5ce7;
  color:white;
  width:43px;
  border-radius:22px;
  font-size:19px;
  cursor:pointer;
}

.media-row{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.media-btn{
  flex:1;
  border:1px solid #ddd;
  background:#fafafa;
  padding:9px 5px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
}

#recordStatus{
  display:none;
  margin-top:7px;
  color:#e74c3c;
  font-size:12px;
}

/* CREATE POST */

#postInput{
  width:100%;
  min-height:85px;
  resize:vertical;
  border:1px solid #ddd;
  border-radius:11px;
  padding:11px;
  outline:none;
  font-size:14px;
}

.post-btn{
  width:100%;
  margin-top:8px;
  border:none;
  background:#6c5ce7;
  color:white;
  padding:11px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.post-btn:disabled{
  opacity:.6;
}

/* WELCOME */

.welcome-box{
  text-align:center;
}

.welcome-title{
  font-size:18px;
  font-weight:bold;
  color:#6c5ce7;
}

.username-line{
  margin-top:5px;
  font-size:13px;
  color:#666;
}

/* FEED */

.section-title{
  font-size:18px;
  font-weight:bold;
  margin:15px 3px 10px;
}

.feed-item{
  background:white;
  border-radius:14px;
  padding:13px;
  margin-bottom:11px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.feed-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.feed-user{
  font-weight:bold;
  color:#5d45c7;
}

.feed-type{
  font-size:11px;
  color:#999;
}

.feed-date{
  font-size:11px;
  color:#999;
  margin-bottom:9px;
}

.feed-content{
  font-size:15px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.post-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #eee;
}

.post-actions button{
  border:1px solid #ddd;
  background:#fff;
  color:#333;
  border-radius:9px;
  padding:7px 9px;
  font-size:12px;
  cursor:pointer;
}

.post-actions button:hover{
  background:#f5f3ff;
}

.post-actions button.active{
  background:#eee9ff;
  border-color:#6c5ce7;
  color:#5d45c7;
}

.action-count{
  font-weight:bold;
}

.delete-btn{
  color:#e74c3c !important;
}

.block-btn{
  color:#c0392b !important;
}

.follow-btn.active{
  background:#eee9ff !important;
}

/* COMMENTS */

.comments-box{
  display:none;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #eee;
}

.comment{
  background:#f7f7fb;
  border-radius:10px;
  padding:9px;
  margin-bottom:7px;
}

.comment-user{
  font-weight:bold;
  color:#5d45c7;
  font-size:13px;
}

.comment-text{
  margin-top:4px;
  font-size:13px;
  white-space:pre-wrap;
  word-break:break-word;
}

.comment-date{
  color:#999;
  font-size:10px;
  margin-top:3px;
}

.comment-actions{
  margin-top:6px;
}

.comment-actions button{
  border:0;
  background:none;
  color:#6c5ce7;
  font-size:11px;
  cursor:pointer;
}

.comment-input-row{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.comment-input{
  flex:1;
  border:1px solid #ddd;
  border-radius:20px;
  padding:9px 12px;
  outline:none;
}

.comment-send{
  border:0;
  background:#6c5ce7;
  color:white;
  border-radius:20px;
  padding:0 14px;
}

/* NOTICE */

.notice{
  display:none;
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%);
  background:#222;
  color:white;
  padding:10px 15px;
  border-radius:10px;
  z-index:2000;
  font-size:13px;
  max-width:90%;
  text-align:center;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:64px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:1500;
  box-shadow:0 -2px 10px rgba(0,0,0,.08);
}

.bottom-nav button{
  border:0;
  background:none;
  color:#555;
  font-size:11px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.bottom-nav button:first-child{
  color:#6c5ce7;
  font-weight:bold;
}

.nav-icon{
  font-size:20px;
}

/* EMPTY */

.empty{
  background:white;
  border-radius:14px;
  padding:25px;
  text-align:center;
  color:#888;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

/* ONLINE POPUP */

.online-popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:3000;
}

.online-card{
  width:90%;
  max-width:400px;
  max-height:75vh;
  overflow:auto;
  background:white;
  border-radius:16px;
  padding:16px;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.online-card h3{
  margin-top:0;
  color:#6c5ce7;
}

.close-online{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:30px;
  height:30px;
  cursor:pointer;
}

.online-user{
  padding:10px;
  border-bottom:1px solid #eee;
}

.online-dot{
  color:#2ecc71;
}

/* MOBILE */

@media(max-width:480px){

  .logo{
    font-size:22px;
  }

  .online-users-btn{
    font-size:12px;
    padding:8px 10px;
  }

  .post-actions button{
    font-size:11px;
    padding:7px 8px;
  }

}

</style>

</head>

<body>

<header class="header">

  <div class="logo">
    Socia<span>lyte</span>
  </div>

  <button
    class="online-users-btn"
    onclick="showOnlineUsers()">
    🟢 Online Users
  </button>

</header>


<main class="container">

  <!-- MESSAGE -->

  <div class="home-message-box">

    <div class="box-title">
      💬 Message
    </div>

    <div class="message-row">

      <input
        id="chatInput"
        type="text"
        placeholder="Write a message..."
        autocomplete="off">

      <button
        id="sendMessageBtn"
        class="chat-send"
        type="button">
        ➤
      </button>

    </div>

    <div class="media-row">

      <button
        id="uploadImageBtn"
        class="media-btn"
        type="button">
        🖼️ Upload Image
      </button>

      <button
        id="voiceBtn"
        class="media-btn"
        type="button">
        🎤 Voice
      </button>

    </div>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      style="display:none;">

    <div id="recordStatus">
      Recording... Tap 🎤 again to stop
    </div>

  </div>


  <!-- CREATE POST -->

  <div class="create-post-box">

    <div class="box-title">
      📝 Create Post
    </div>

    <textarea
      id="postInput"
      placeholder="Write a post..."></textarea>

    <button
      id="publishPostBtn"
      class="post-btn"
      type="button">
      📝 Post
    </button>

  </div>


  <!-- WELCOME -->

  <div class="welcome-box">

    <div class="welcome-title">
      Welcome to Socialyte ♥️
    </div>

    <div class="username-line">
      Logged in as:
      <strong id="loggedInUsername">User</strong>
    </div>

  </div>


  <!-- ONLY HOME FEED -->

  <div class="section-title">
    🏠 Home Feed
  </div>

  <div id="homeFeed">
    <div class="empty">
      Loading feed...
    </div>
  </div>

</main>


<!-- NOTICE -->

<div id="notice" class="notice"></div>


<!-- ONLINE USERS -->

<div
  id="onlinePopup"
  class="online-popup"
  onclick="closeOnlineUsers(event)">

  <div
    class="online-card"
    onclick="event.stopPropagation()">

    <button
      class="close-online"
      onclick="hideOnlineUsers()">
      ✕
    </button>

    <h3>🟢 Online Users</h3>

    <div id="onlineUsersList">
      Loading...
    </div>

  </div>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button onclick="goHome()">
    <span class="nav-icon">🏠</span>
    Home
  </button>

  <button onclick="openPrivate()">
    <span class="nav-icon">💬</span>
    Private
  </button>

  <button onclick="openProfile()">
    <span class="nav-icon">👤</span>
    Profile
  </button>

  <button onclick="openNotifications()">
    <span class="nav-icon">🔔</span>
    Notifications
  </button>

  <button onclick="moreMenu()">
    <span class="nav-icon">☰</span>
    More
  </button>

</nav>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
  "https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* ================= GLOBAL ================= */

let currentUser = null;
let currentUsername = "User";

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;


/* ================= HELPERS ================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}

function formatDate(value){

  if(!value) return "";

  try{
    return new Date(value).toLocaleString();
  }catch{
    return "";
  }

}

function showNotice(message){

  const notice =
    document.getElementById("notice");

  if(!notice) return;

  notice.textContent = message;
  notice.style.display = "block";

  clearTimeout(window.noticeTimer);

  window.noticeTimer =
    setTimeout(function(){
      notice.style.display = "none";
    },2500);

}


/* ================= USER ================= */

function setCurrentUser(user){

  currentUser = user || null;

  if(!currentUser){
    return;
  }

  currentUsername =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  const usernameElement =
    document.getElementById("loggedInUsername");

  if(usernameElement){
    usernameElement.textContent =
      currentUsername;
  }

}


/* ================= SESSION ================= */

async function checkUser(){

  for(let i=0;i<8;i++){

    const {
      data
    } =
      await supabaseClient.auth.getSession();

    if(data && data.session){

      setCurrentUser(
        data.session.user
      );

      await loadFeed();

      return;
    }

    await new Promise(
      resolve => setTimeout(resolve,300)
    );

  }

  const {
    data
  } =
    await supabaseClient.auth.getUser();

  if(data && data.user){

    setCurrentUser(data.user);

    await loadFeed();

    return;
  }

  window.location.href =
    "login.html";

}


/* ================= AUTH LISTENER ================= */

supabaseClient.auth.onAuthStateChange(
  function(event,session){

    if(session){

      setCurrentUser(
        session.user
      );

    }

  }
);


/* ================= ADD POST ================= */

async function addPost(){

  if(!currentUser){
    alert("Please login first.");
    return;
  }

  const input =
    document.getElementById("postInput");

  if(!input){
    alert("Post box nahi mila.");
    return;
  }

  const text =
    input.value.trim();

  if(!text){
    showNotice("Post likho pehle.");
    input.focus();
    return;
  }

  const button =
    document.getElementById(
      "publishPostBtn"
    );

  if(button){
    button.disabled = true;
    button.textContent = "Posting...";
  }

  try{

    const {
      error
    } =
      await supabaseClient
        .from("posts")
        .insert({
          user_id:currentUser.id,
          username:currentUsername,
          content:text
        });

    if(error){

      console.error(
        "POST ERROR:",
        error
      );

      alert(
        "Post save nahi hui.\n\n" +
        error.message
      );

      return;
    }

    input.value = "";

    await loadFeed();

    showNotice(
      "📝 Post published."
    );

  }finally{

    if(button){

      button.disabled = false;
      button.textContent = "📝 Post";

    }

  }

}


/* ================= SEND MESSAGE ================= */

async function sendTextMessage(){

  if(!currentUser){
    alert("Please login first.");
    return;
  }

  const input =
    document.getElementById("chatInput");

  if(!input){
    alert("Message box nahi mila.");
    return;
  }

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  const button =
    document.getElementById(
      "sendMessageBtn"
    );

  if(button){
    button.disabled = true;
  }

  try{

    const {
      error
    } =
      await supabaseClient
        .from("home_messages")
        .insert({
          user_id:currentUser.id,
          username:currentUsername,
          message:text
        });

    if(error){

      console.error(
        "MESSAGE ERROR:",
        error
      );

      alert(
        "Message send nahi hua.\n\n" +
        error.message
      );

      return;
    }

    input.value = "";

    await loadFeed();

    showNotice(
      "💬 Message sent."
    );

  }finally{

    if(button){
      button.disabled = false;
    }

  }

}


/* ================= LOAD FEED ================= */

async function loadFeed(){

  const feed =
    document.getElementById("homeFeed");

  if(!feed) return;

  feed.innerHTML =
    '<div class="empty">Loading feed...</div>';

  try{

    /* BLOCKED USERS */

    let blockedIds = [];

    const {
      data:blocks
    } =
      await supabaseClient
        .from("user_blocks")
        .select("blocked_id")
        .eq(
          "blocker_id",
          currentUser.id
        );

    if(blocks){

      blockedIds =
        blocks.map(
          item => item.blocked_id
        );

    }


    /* POSTS */

    const {
      data:posts,
      error:postError
    } =
      await supabaseClient
        .from("posts")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );

    if(postError){
      console.error(
        "POST LOAD ERROR:",
        postError
      );
    }


    /* MESSAGES */

    const {
      data:messages,
      error:messageError
    } =
      await supabaseClient
        .from("home_messages")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );

    if(messageError){
      console.error(
        "MESSAGE LOAD ERROR:",
        messageError
      );
    }


    let feedItems = [];


    /* ADD POSTS */

    (posts || []).forEach(function(post){

      if(
        blockedIds.includes(
          post.user_id
        )
      ){
        return;
      }

      feedItems.push({
        type:"post",
        id:post.id,
        user_id:post.user_id,
        username:post.username,
        content:post.content,
        created_at:post.created_at,
        raw:post
      });

    });


    /* ADD MESSAGES */

    (messages || []).forEach(function(message){

      if(
        blockedIds.includes(
          message.user_id
        )
      ){
        return;
      }

      feedItems.push({
        type:"message",
        id:message.id,
        user_id:message.user_id,
        username:message.username,
        content:message.message,
        created_at:message.created_at,
        raw:message
      });

    });


    /* NEWEST FIRST */

    feedItems.sort(function(a,b){

      return new Date(
        b.created_at || 0
      ) -
      new Date(
        a.created_at || 0
      );

    });


    if(feedItems.length === 0){

      feed.innerHTML =
        '<div class="empty">' +
        'No posts or messages yet.' +
        '</div>';

      return;

    }


    feed.innerHTML =
      feedItems
        .map(function(item){

          if(item.type === "post"){
            return renderPost(item);
          }

          return renderMessage(item);

        })
        .join("");


    /* LOAD ACTIONS */

    for(
      const item of feedItems
    ){

      if(item.type === "post"){

        await loadPostActions(
          item.id
        );

        if(
          item.user_id &&
          item.user_id !== currentUser.id
        ){

          await loadFollowStatus(
            item.user_id
          );

        }

      }

    }

  }catch(error){

    console.error(
      "FEED ERROR:",
      error
    );

    feed.innerHTML =
      '<div class="empty">' +
      'Feed load nahi ho saki.' +
      '</div>';

  }

}


/* ================= RENDER POST ================= */

function renderPost(item){

  const isMine =
    currentUser &&
    item.user_id === currentUser.id;

  let controls = "";


  if(isMine){

    controls += `
      <button
        class="delete-btn"
        type="button"
        onclick="deletePost('${escapeAttr(item.id)}')">
        🗑️ Delete
      </button>
    `;

  }else{

    controls += `
      <button
        class="block-btn"
        type="button"
        onclick="blockUser('${escapeAttr(item.user_id)}')">
        🚫 Block
      </button>

      <button
        class="follow-btn"
        id="follow-btn-${escapeAttr(item.user_id)}"
        type="button"
        onclick="toggleFollow('${escapeAttr(item.user_id)}')">
        👥 Follow
      </button>
    `;

  }


  return `

    <article class="feed-item">

      <div class="feed-header">

        <div class="feed-user">
          📝 ${escapeHtml(item.username || "User")}
        </div>

        <div class="feed-type">
          POST
        </div>

      </div>

      <div class="feed-date">
        ${escapeHtml(formatDate(item.created_at))}
      </div>

      <div class="feed-content">
        ${escapeHtml(item.content)}
      </div>

      <div class="post-actions">

        ${controls}

        <button
          type="button"
          id="like-btn-${escapeAttr(item.id)}"
          onclick="toggleLike('${escapeAttr(item.id)}')">

          ❤️ Like
          <span
            class="action-count"
            id="like-count-${escapeAttr(item.id)}">
            0
          </span>

        </button>

        <button
          type="button"
          id="dislike-btn-${escapeAttr(item.id)}"
          onclick="toggleDislike('${escapeAttr(item.id)}')">

          👎 Dislike
          <span
            class="action-count"
            id="dislike-count-${escapeAttr(item.id)}">
            0
          </span>

        </button>

        <button
          type="button"
          onclick="toggleComments('${escapeAttr(item.id)}')">

          💬 Comments

        </button>

      </div>

      <div
        id="comments-${escapeAttr(item.id)}"
        class="comments-box">

      </div>

    </article>

  `;

}


/* ================= RENDER MESSAGE ================= */

function renderMessage(item){

  const isMine =
    currentUser &&
    item.user_id === currentUser.id;

  let controls = "";


  if(isMine){

    controls = `
      <button
        class="delete-btn"
        type="button"
        onclick="deleteHomeMessage('${escapeAttr(item.id)}')">
        🗑️ Delete
      </button>
    `;

  }else{

    controls = `
      <button
        class="block-btn"
        type="button"
        onclick="blockUser('${escapeAttr(item.user_id)}')">
        🚫 Block
      </button>
    `;

  }


  return `

/* ================= POST ACTIONS ================= */

async function loadPostActions(postId){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("post_actions")
      .select(
        "id,user_id,action_type"
      )
      .eq(
        "post_id",
        postId
      );

  if(error){

    console.error(
      "ACTION LOAD ERROR:",
      error
    );

    return;

  }


  let likes = 0;
  let dislikes = 0;
  let myAction = null;


  (data || []).forEach(function(row){

    if(row.action_type === "like"){
      likes++;
    }

    if(row.action_type === "dislike"){
      dislikes++;
    }

    if(
      currentUser &&
      row.user_id === currentUser.id
    ){
      myAction =
        row.action_type;
    }

  });


  const likeCount =
    document.getElementById(
      "like-count-" + postId
    );

  const dislikeCount =
    document.getElementById(
      "dislike-count-" + postId
    );

  const likeBtn =
    document.getElementById(
      "like-btn-" + postId
    );

  const dislikeBtn =
    document.getElementById(
      "dislike-btn-" + postId
    );


  if(likeCount){
    likeCount.textContent =
      likes;
  }

  if(dislikeCount){
    dislikeCount.textContent =
      dislikes;
  }

  if(likeBtn){
    likeBtn.classList.toggle(
      "active",
      myAction === "like"
    );
  }

  if(dislikeBtn){
    dislikeBtn.classList.toggle(
      "active",
      myAction === "dislike"
    );
  }

}


/* ================= SET ACTION ================= */

async function setPostAction(
  postId,
  actionType
){

  if(!currentUser){
    alert("Please login first.");
    return;
  }


  const {
    data:existing,
    error:findError
  } =
    await supabaseClient
      .from("post_actions")
      .select(
        "id,action_type"
      )
      .eq(
        "post_id",
        postId
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .maybeSingle();


  if(findError){

    console.error(
      "ACTION FIND ERROR:",
      findError
    );

    return;

  }


  if(existing){

    if(
      existing.action_type ===
      actionType
    ){

      const {
        error
      } =
        await supabaseClient
          .from("post_actions")
          .delete()
          .eq(
            "id",
            existing.id
          );

      if(error){

        alert(
          error.message
        );

        return;

      }

    }else{

      const {
        error:deleteError
      } =
        await supabaseClient
          .from("post_actions")
          .delete()
          .eq(
            "id",
            existing.id
          );

      if(deleteError){

        alert(
          deleteError.message
        );

        return;

      }


      const {
        error:insertError
      } =
        await supabaseClient
          .from("post_actions")
          .insert({
            post_id:postId,
            user_id:currentUser.id,
            action_type:actionType
          });

      if(insertError){

        alert(
          insertError.message
        );

        return;

      }

    }

  }else{

    const {
      error
    } =
      await supabaseClient
        .from("post_actions")
        .insert({
          post_id:postId,
          user_id:currentUser.id,
          action_type:actionType
        });

    if(error){

      alert(
        error.message
      );

      return;

    }

  }


  await loadPostActions(
    postId
  );

}

/* ================= LOAD COMMENTS ================= */

async function loadComments(postId){

  const box =
    document.getElementById(
      "comments-" + postId
    );

  if(!box) return;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("comments")
      .select("*")
      .eq(
        "post_id",
        postId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    box.innerHTML =
      "<div>Comments load nahi huay.</div>";

    console.error(
      error
    );

    return;

  }


  let html = "";


  (data || []).forEach(
    function(comment){

      html += `

        <div class="comment">

          <div class="comment-user">
            ${escapeHtml(
              comment.username || "User"
            )}
          </div>

          <div class="comment-text">
            ${escapeHtml(
              comment.content
            )}
          </div>

          <div class="comment-date">
            ${escapeHtml(
              formatDate(
                comment.created_at
              )
            )}
          </div>

          <div class="comment-actions">

            <button
              type="button"
              onclick="showCommentReply(
                '${escapeAttr(comment.id)}',
                '${escapeAttr(comment.username || "User")}'
              )">

              ↩️ Reply

            </button>

          </div>

        </div>

      `;

    }
  );


  html += `

    <div
      id="reply-box-${escapeAttr(postId)}">
    </div>

    <div class="comment-input-row">

      <input
        class="comment-input"
        id="comment-input-${escapeAttr(postId)}"
        placeholder="Write a comment..."
        type="text">

      <button
        class="comment-send"
        type="button"
        onclick="addComment('${escapeAttr(postId)}')">

        ➤

      </button>

    </div>

  `;


  box.innerHTML =
    html;


  setupCommentInput(
    postId
  );

}

/* ================= VOICE ================= */

async function toggleRecording(){

  const status =
    document.getElementById(
      "recordStatus"
    );


  if(!isRecording){

    try{

      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio:true
          });


      audioChunks = [];


      mediaRecorder =
        new MediaRecorder(
          stream
        );


      mediaRecorder.ondataavailable =
        function(event){

          if(event.data.size > 0){

            audioChunks.push(
              event.data
            );

          }

        };


      mediaRecorder.onstop =
        function(){

          stream
            .getTracks()
            .forEach(
              track => track.stop()
            );

          if(status){

            status.style.display =
              "none";

          }

          showNotice(
            "🎤 Voice recording ready hai."
          );

        };


      mediaRecorder.start();

      isRecording = true;

      if(status){

        status.style.display =
          "block";

      }

    }catch(error){

      console.error(
        error
      );

      alert(
        "Microphone permission nahi mili."
      );

    }

  }else{

    if(
      mediaRecorder &&
      mediaRecorder.state !== "inactive"
    ){

      mediaRecorder.stop();

    }

    isRecording = false;

  }

}
