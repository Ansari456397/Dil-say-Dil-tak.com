<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dil Say Dil Tak - Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      min-height: 100vh;
    }

    header {
      background: #20242c;
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    #logout {
      background: white;
      color: #20242c;
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-weight: bold;
    }

    .chat {
      max-width: 600px;
      margin: 20px auto;
      padding: 15px;
    }

    #messages {
      height: 60vh;
      overflow-y: auto;
      background: white;
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .message-row {
      display: flex;
      margin-bottom: 12px;
    }

    .message-row.mine {
      justify-content: flex-end;
    }

    .message-row.other {
      justify-content: flex-start;
    }

    .message {
      max-width: 80%;
      padding: 10px 13px;
      border-radius: 15px;
    }

    .mine .message {
      background: #20242c;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .other .message {
      background: #f0f2f5;
      color: #20242c;
      border-bottom-left-radius: 4px;
    }

    .username {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      opacity: 0.75;
    }

    .message-text {
      font-size: 15px;
      word-wrap: break-word;
    }

    .time {
      font-size: 10px;
      margin-top: 5px;
      opacity: 0.6;
      text-align: right;
    }

    .send-box {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    #messageInput {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    #sendBtn {
      border: none;
      background: #20242c;
      color: white;
      padding: 0 18px;
      border-radius: 12px;
      font-weight: bold;
    }

    #status {
      text-align: center;
      margin: 10px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Dil Say Dil Tak 💬</div>
  <button id="logout">Logout</button>
</header>

<div class="chat">

  <div id="messages"></div>

  <div class="send-box">
    <input
      type="text"
      id="messageInput"
      placeholder="Write a message..."
    >
    <button id="sendBtn">Send</button>
  </div>

  <div id="status"></div>

</div>

<script>

const SUPABASE_URL = "https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY = "sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;

async function checkUser() {

  const { data, error } = await supabaseClient.auth.getUser();

  if (error || !data.user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = data.user;

  loadMessages();
}

async function loadMessages() {

  const { data, error } = await supabaseClient
    .from("messages")
    .select("*")
    .order("created_at", { ascending: true });

  if (error) {
    document.getElementById("status").textContent = error.message;
    return;
  }

  const box = document.getElementById("messages");

  box.innerHTML = "";

  data.forEach(msg => {

    const isMine = msg.user_id === currentUser.id;

    const row = document.createElement("div");
    row.className = "message-row " + (isMine ? "mine" : "other");

    const messageDiv = document.createElement("div");
    messageDiv.className = "message";

    const usernameDiv = document.createElement("div");
    usernameDiv.className = "username";
    usernameDiv.textContent = msg.username || "User";

    const textDiv = document.createElement("div");
    textDiv.className = "message-text";
    textDiv.textContent = msg.message;

    const timeDiv = document.createElement("div");
    timeDiv.className = "time";

    const messageTime = new Date(msg.created_at);

    timeDiv.textContent = messageTime.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });

    messageDiv.appendChild(usernameDiv);
    messageDiv.appendChild(textDiv);
    messageDiv.appendChild(timeDiv);

    row.appendChild(messageDiv);
    box.appendChild(row);

  });

  box.scrollTop = box.scrollHeight;
}

document.getElementById("sendBtn").addEventListener("click", async function() {

  const input = document.getElementById("messageInput");

  const text = input.value.trim();

  if (!text || !currentUser) return;

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email.split("@")[0];

  const { error } = await supabaseClient
    .from("messages")
    .insert({
      user_id: currentUser.id,
      username: username,
      message: text
    });

  if (error) {
    document.getElementById("status").textContent = error.message;
    return;
  }

  input.value = "";

  loadMessages();

});

document.getElementById("messageInput").addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    document.getElementById("sendBtn").click();
  }

});

document.getElementById("logout").addEventListener("click", async function() {

  await supabaseClient.auth.signOut();

  window.location.href = "login.html";

});

checkUser();

</script>

</body>
</html>
