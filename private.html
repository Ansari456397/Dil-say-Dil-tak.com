<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Socialyte - Private Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  padding-bottom:125px;
}

.chat-header{
  position:sticky;
  top:0;
  z-index:1000;
  height:62px;
  background:linear-gradient(135deg,#6c5ce7,#8e44ad);
  color:white;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.back-btn,
.menu-btn{
  border:0;
  background:rgba(255,255,255,.15);
  color:white;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.chat-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:white;
  color:#6c5ce7;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-weight:bold;
}

.chat-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.chat-user-info{
  flex:1;
  min-width:0;
}

.chat-username{
  font-size:16px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-status{
  font-size:11px;
  opacity:.8;
  margin-top:2px;
}

.chat-container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:12px;
}

.messages{
  min-height:calc(100vh - 210px);
  padding-bottom:10px;
}

.empty{
  background:white;
  border-radius:12px;
  padding:25px;
  text-align:center;
  color:#999;
  margin-top:15px;
}

.message-row{
  display:flex;
  margin:8px 0;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-bubble{
  max-width:78%;
  padding:9px 11px;
  border-radius:14px;
  font-size:14px;
  line-height:1.4;
  word-break:break-word;
}

.mine .message-bubble{
  background:#6c5ce7;
  color:white;
  border-bottom-right-radius:4px;
}

.theirs .message-bubble{
  background:white;
  color:#222;
  border-bottom-left-radius:4px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}

.message-time{
  display:block;
  font-size:9px;
  opacity:.65;
  margin-top:4px;
  text-align:right;
}

.chat-image{
  display:block;
  max-width:220px;
  max-height:300px;
  border-radius:10px;
  object-fit:cover;
}

.voice-message{
  display:flex;
  align-items:center;
  gap:7px;
  min-width:180px;
}

.voice-message audio{
  width:180px;
  max-width:100%;
}

.chat-composer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:1500;
  background:white;
  border-top:1px solid #ddd;
  box-shadow:0 -3px 12px rgba(0,0,0,.08);
  padding:8px;
}

.composer-inner{
  width:100%;
  max-width:650px;
  margin:auto;
}

.message-input-row{
  display:flex;
  gap:6px;
}

#messageInput{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:20px;
  padding:11px 13px;
  outline:none;
  font-size:14px;
}

#messageInput:focus{
  border-color:#6c5ce7;
}

.send-btn{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#6c5ce7;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.media-row{
  display:flex;
  gap:8px;
  margin-top:7px;
}

.media-btn{
  flex:1;
  border:0;
  background:#f0edff;
  color:#6045c5;
  padding:9px 6px;
  border-radius:9px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.media-btn.recording{
  background:#ffecec;
  color:#d63031;
}

#recordStatus{
  display:none;
  text-align:center;
  color:#d63031;
  font-size:11px;
  margin-top:5px;
}

.chat-menu{
  display:none;
  position:fixed;
  top:58px;
  right:10px;
  z-index:3000;
  background:white;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
  overflow:hidden;
}

.chat-menu button{
  border:0;
  background:white;
  padding:13px 16px;
  color:#d63031;
  font-size:13px;
  cursor:pointer;
}

.notice{
  position:fixed;
  left:50%;
  bottom:145px;
  transform:translateX(-50%);
  z-index:5000;
  background:#222;
  color:white;
  padding:10px 15px;
  border-radius:10px;
  font-size:13px;
  max-width:90%;
  text-align:center;
  display:none;
}

.loading{
  text-align:center;
  color:#888;
  padding:20px;
}
</style>
</head>

<body>

<header class="chat-header">

<button class="back-btn" onclick="goBack()">←</button>

<div id="chatAvatar" class="chat-avatar">
👤
</div>

<div class="chat-user-info">

<div id="chatUsername" class="chat-username">
Loading...
</div>

<div class="chat-status">
Private Chat
</div>

</div>

<button class="menu-btn" onclick="toggleChatMenu()">⋮</button>

</header>


<div id="chatMenu" class="chat-menu">

<button onclick="leavePrivateChat()">
🚪 Leave Private Chat
</button>

</div>


<main class="chat-container">

<div id="messages" class="messages">

<div class="loading">
Loading messages...
</div>

</div>

</main>


<div class="chat-composer">

<div class="composer-inner">

<div class="message-input-row">

<input
id="messageInput"
type="text"
placeholder="Write a message..."
autocomplete="off">

<button
id="sendBtn"
class="send-btn">
➤
</button>

</div>


<div class="media-row">

<button
id="imageBtn"
class="media-btn">
🖼️ Image
</button>

<button
id="voiceBtn"
class="media-btn">
🎤 Voice
</button>

</div>


<input
id="imageInput"
type="file"
accept="image/*"
style="display:none;">


<div id="recordStatus">
🔴 Recording... Tap 🎤 again to stop
</div>

</div>

</div>


<div id="notice" class="notice"></div>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://szmauhxiyjffjhrcruee.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-ys_eIxK2WuUucSGtoBdqw_nKWnIgep";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* ================= GLOBAL ================= */

let currentUser = null;
let chatUser = null;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;


/* ================= HELPERS ================= */

function escapeHtml(value){

if(value === null || value === undefined){
return "";
}

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function formatTime(date){

return new Date(date)
.toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});

}


function showNotice(message){

const notice =
document.getElementById("notice");

notice.textContent = message;
notice.style.display = "block";

clearTimeout(window.noticeTimer);

window.noticeTimer =
setTimeout(()=>{
notice.style.display="none";
},3000);

}


/* ================= USER ID ================= */

function getChatUserId(){

const params =
new URLSearchParams(
window.location.search
);

return params.get("user");

}


/* ================= LOGIN ================= */

async function checkUser(){

const {data} =
await supabaseClient.auth.getSession();

currentUser =
data?.session?.user || null;

if(!currentUser){

window.location.href="login.html";
return false;

}

return true;

}


/* ================= CHAT USER ================= */

async function loadChatUser(){

const userId =
getChatUserId();

if(!userId){

showNotice("Chat user nahi mila.");

setTimeout(goBack,1000);

return false;

}

if(userId === currentUser.id){

showNotice(
"Apne aap se private chat nahi ho sakti."
);

setTimeout(goBack,1200);

return false;

}


const {data,error} =
await supabaseClient
.from("profiles")
.select("id,username,name,avatar_url")
.eq("id",userId)
.maybeSingle();


if(error || !data){

showNotice("User profile nahi mili.");

setTimeout(goBack,1200);

return false;

}


chatUser = data;


const username =
data.username ||
data.name ||
"User";


document.getElementById(
"chatUsername"
).textContent =
"@" + username;


const avatar =
document.getElementById(
"chatAvatar"
);


if(data.avatar_url){

avatar.innerHTML = `
<img
src="${escapeHtml(data.avatar_url)}"
alt="">
`;

}else{

avatar.textContent =
username.charAt(0).toUpperCase();

}

return true;

}


/* ================= LOAD MESSAGES ================= */

async function loadMessages(){

if(!currentUser || !chatUser){
return;
}


const {data,error} =
await supabaseClient
.from("private_messages")
.select("*")
.or(
`and(sender_id.eq.${currentUser.id},receiver_id.eq.${chatUser.id}),and(sender_id.eq.${chatUser.id},receiver_id.eq.${currentUser.id})`
)
.order(
"created_at",
{ascending:true}
);


const box =
document.getElementById("messages");


if(error){

console.error(error);

box.innerHTML =
`<div class="empty">
Messages load nahi ho sake.
</div>`;

return;

}


const messages =
data || [];


if(messages.length === 0){

box.innerHTML =
`<div class="empty">
💬 Abhi koi message nahi hai.<br>
Pehla message bhejein.
</div>`;

return;

}


box.innerHTML =
messages.map(
renderMessage
).join("");


window.scrollTo(
0,
document.body.scrollHeight
);

}


/* ================= RENDER ================= */

function renderMessage(message){

const mine =
message.sender_id === currentUser.id;

let content = "";


if(message.message_type === "image"){

content = `
<img
class="chat-image"
src="${escapeHtml(message.media_url || "")}"
alt="Image">
`;

}
else if(message.message_type === "voice"){

content = `
<div class="voice-message">

🎤

<audio
controls
src="${escapeHtml(message.media_url || "")}">
</audio>

</div>
`;

}
else{

content =
escapeHtml(
message.content || ""
);

}


return `
<div class="message-row ${mine ? "mine":"theirs"}">

<div class="message-bubble">

${content}

<span class="message-time">
${formatTime(message.created_at)}
</span>

</div>

</div>
`;

}


/* ================= SEND TEXT ================= */

async function sendTextMessage(){

if(!currentUser || !chatUser){
return;
}


const input =
document.getElementById(
"messageInput"
);


const text =
input.value.trim();


if(!text){
return;
}


input.disabled=true;


const {error} =
await supabaseClient
.from("private_messages")
.insert({

sender_id:currentUser.id,

receiver_id:chatUser.id,

message_type:"text",

content:text

});


input.disabled=false;


if(error){

console.error(error);

showNotice(
"Message send nahi hua."
);

return;

}


input.value="";

await loadMessages();

}


/* ================= IMAGE ================= */

document.getElementById(
"imageBtn"
).onclick=()=>{

document.getElementById(
"imageInput"
).click();

};


document.getElementById(
"imageInput"
).onchange=
async function(){

const file =
this.files[0];

if(!file){
return;
}


const path =
`${currentUser.id}/${Date.now()}-${file.name}`;


showNotice(
"🖼️ Image upload ho rahi hai..."
);


const {error} =
await supabaseClient
.storage
.from("private-media")
.upload(
path,
file,
{
upsert:false,
contentType:file.type
}
);


if(error){

console.error(error);

showNotice(
"Image upload nahi hui."
);

return;

}


const {data:urlData} =
await supabaseClient
.storage
.from("private-media")
.createSignedUrl(
path,
60*60*24
);


if(!urlData?.signedUrl){

showNotice(
"Image URL nahi mili."
);

return;

}


const {error:msgError} =
await supabaseClient
.from("private_messages")
.insert({

sender_id:currentUser.id,

receiver_id:chatUser.id,

message_type:"image",

media_url:urlData.signedUrl

});


if(msgError){

console.error(msgError);

showNotice(
"Image message save nahi hua."
);

return;

}


this.value="";

await loadMessages();

showNotice("🖼️ Image sent.");

};


/* ================= VOICE ================= */

document.getElementById(
"voiceBtn"
).onclick=
async function(){

const button=this;

const status =
document.getElementById(
"recordStatus"
);


if(isRecording){

mediaRecorder.stop();

return;

}


try{

const stream =
await navigator.mediaDevices
.getUserMedia({
audio:true
});


audioChunks=[];


mediaRecorder =
new MediaRecorder(stream);


mediaRecorder.ondataavailable =
event=>{

if(event.data.size>0){

audioChunks.push(
event.data
);

}

};


mediaRecorder.onstop =
async ()=>{

isRecording=false;

button.textContent =
"🎤 Voice";

button.classList.remove(
"recording"
);

status.style.display =
"none";


stream.getTracks()
.forEach(
track=>track.stop()
);


const blob =
new Blob(
audioChunks,
{
type:
mediaRecorder.mimeType ||
"audio/webm"
}
);


const path =
`${currentUser.id}/${Date.now()}.webm`;


showNotice(
"🎤 Voice upload ho rahi hai..."
);


const {error} =
await supabaseClient
.storage
.from("private-media")
.upload(
path,
blob,
{
upsert:false,
contentType:blob.type
}
);


if(error){

console.error(error);

showNotice(
"Voice upload nahi hui."
);

return;

}


const {data:urlData} =
await supabaseClient
.storage
.from("private-media")
.createSignedUrl(
path,
60*60*24
);


if(!urlData?.signedUrl){

showNotice(
"Voice URL nahi mili."
);

return;

}


const {error:msgError} =
await supabaseClient
.from("private_messages")
.insert({

sender_id:currentUser.id,

receiver_id:chatUser.id,

message_type:"voice",

media_url:urlData.signedUrl

});


if(msgError){

console.error(msgError);

showNotice(
"Voice message save nahi hua."
);

return;

}


await loadMessages();

showNotice(
"🎤 Voice sent."
);

};


mediaRecorder.start();

isRecording=true;

button.textContent="⏹️ Stop";

button.classList.add(
"recording"
);

status.style.display="block";


}catch(error){

console.error(error);

showNotice(
"Microphone permission allow karein."
);

}

};


/* ================= MENU ================= */

function toggleChatMenu(){

const menu =
document.getElementById(
"chatMenu"
);

menu.style.display =
menu.style.display === "block"
? "none"
: "block";

}


function leavePrivateChat(){

window.location.href =
"private.html";

}


function goBack(){

window.location.href =
"index.html";

}


/* ================= SEND BUTTON ================= */

document.getElementById(
"sendBtn"
).onclick =
sendTextMessage;


document.getElementById(
"messageInput"
).addEventListener(
"keydown",
function(event){

if(event.key==="Enter"){

event.preventDefault();

sendTextMessage();

}

});


/* ================= START ================= */

(async function(){

const loggedIn =
await checkUser();

if(!loggedIn){
return;
}


const loaded =
await loadChatUser();

if(!loaded){
return;
}


await loadMessages();


setInterval(
loadMessages,
3000
);

})();

</script>

</body>
</html>
