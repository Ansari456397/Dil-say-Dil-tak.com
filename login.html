<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socialyte - Login</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #f5f7fb;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 400px;
  background: white;
  padding: 35px 25px;
  border-radius: 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.logo {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 28px;
}

input {
  width: 100%;
  padding: 14px;
  margin-bottom: 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  outline: none;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #20242c;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

.signup {
  text-align: center;
  margin-top: 20px;
  color: #777;
}

.signup a {
  color: #20242c;
  font-weight: bold;
  text-decoration: none;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">Socialyte</div>

  <div class="subtitle">
    Welcome back! Login to continue.
  </div>

  <form>
    <input type="text" placeholder="Username or Email" required>

    <input type="password" placeholder="Password" required>

    <button type="submit">Login</button>
  </form>

  <div class="signup">
    Don't have an account?
    <a href="signup.html">Create Account</a>
  </div>

</div>

</body>
</html>
